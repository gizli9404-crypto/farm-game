<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Miner Pro - Canlı Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; padding: 20px; }
        .header { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 22px; color: #38bdf8; }
        .badge { background: #22c55e; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .user-info h3 { color: #f8fafc; font-size: 18px; margin-bottom: 5px; }
        .user-info p { color: #94a3b8; font-size: 14px; margin-bottom: 3px; }
        .actions { display: flex; gap: 10px; align-items: center; }
        input { background: #0f172a; border: 1px solid #475569; color: white; padding: 8px; border-radius: 6px; width: 100px; }
        button { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-add { background: #22c55e; color: white; }
        .btn-sub { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Sanal Miner Pro - Canlı Admin Panel</h1>
            <span class="badge">Aktif Veritabanı Modu</span>
        </div>

        <div id="users-list">
            <p style="text-align: center; color: #94a3b8;">Veriler yükleniyor...</p>
        </div>
    </div>

    <script>
        const SECRET = "SizinGucluSifreniz123";

        function loadUsers() {
            fetch(`/api/admin/users?secret=${SECRET}`)
                .then(res => res.json())
                .then(users => {
                    const listDiv = document.getElementById('users-list');
                    if (users.length === 0) {
                        listDiv.innerHTML = '<p style="text-align: center; color: #94a3b8;">Henüz kayıtlı kullanıcı yok.</p>';
                        return;
                    }

                    let html = '';
                    users.forEach(u => {
                        html += `
                            <div class="card">
                                <div class="user-info">
                                    <h3>${u.full_name || u.username} (@${u.username})</h3>
                                    <p><b>ID:</b> ${u.user_id} | <b>Bilet:</b> ${u.tickets} Adet</p>
                                    <p><b>Bakiye:</b> <span style="color: #4ade80;">${u.balance} PEPE</span></p>
                                    <p><b>Cüzdan:</b> ${u.wallet || 'Yok'}</p>
                                </div>
                                <div class="actions">
                                    <input type="number" id="amt_${u.user_id}" placeholder="Miktar" value="10">
                                    <button class="btn-add" onclick="updateBalance(${u.user_id}, 'add')">+ Ekle</button>
                                    <button class="btn-sub" onclick="updateBalance(${u.user_id}, 'sub')">- Çıkar</button>
                                </div>
                            </div>
                        `;
                    });
                    listDiv.innerHTML = html;
                })
                .catch(err => console.error("Admin veri çekme hatası:", err));
        }

        function updateBalance(userId, action) {
            const amount = parseFloat(document.getElementById(`amt_${userId}`).value) || 0;
            fetch('/api/admin/update_balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret: SECRET, user_id: userId, amount: amount, action: action })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadUsers();
            });
        }

        // Sayfa açıldığında yükle ve her 3 saniyede bir canlı güncelle
        loadUsers();
        setInterval(loadUsers, 3000);
    </script>
</body>
</html>
