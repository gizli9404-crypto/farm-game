<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Miner Pro - Premium Admin Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #030712; color: #f8fafc; font-family: system-ui, sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="p-6 space-y-6 max-w-7xl mx-auto">

    <!-- ÜST BAŞLIK -->
    <div class="flex justify-between items-center glass p-6 rounded-2xl shadow-xl">
        <div>
            <h1 class="text-2xl font-black text-emerald-400"><i class="fa-solid fa-shield-halved mr-2"></i>Sanal Miner Pro Yönetim Paneli</h1>
            <p class="text-xs text-slate-400 mt-1">Sistem istatistikleri, bakiye yönetimi ve bot API kontrolü</p>
        </div>
        <button onclick="loadAdminData()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-4 py-2.5 rounded-xl text-xs transition-all shadow">
            <i class="fa-solid fa-rotate mr-1.5"></i> Verileri Yenile
        </button>
    </div>

    <!-- İSTATİSTİK KARTLARI -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="glass p-5 rounded-2xl space-y-1">
            <span class="text-xs text-slate-400 font-bold">Toplam Kullanıcı</span>
            <div id="stat-users" class="text-2xl font-black text-white">0</div>
        </div>
        <div class="glass p-5 rounded-2xl space-y-1">
            <span class="text-xs text-slate-400 font-bold">Toplam Dağıtılan PEPE</span>
            <div id="stat-balance" class="text-2xl font-black text-emerald-400">0.00 PEPE</div>
        </div>
        <div class="glass p-5 rounded-2xl space-y-1">
            <span class="text-xs text-slate-400 font-bold">Aktif Bot Durumu</span>
            <div class="text-2xl font-black text-emerald-400">Online 🟢</div>
        </div>
    </div>

    <!-- KULLANICI LİSTESİ VE YÖNETİMİ -->
    <div class="glass p-6 rounded-2xl space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="text-base font-black text-white"><i class="fa-solid fa-users mr-2 text-emerald-400"></i>Kullanıcı Veritabanı</h2>
            <input type="text" id="search-input" placeholder="Kullanıcı Ara (ID veya Ad)..." onkeyup="filterUsers()" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 w-64">
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-900/80 text-slate-400 uppercase border-b border-slate-800">
                    <tr>
                        <th class="p-3">Telegram ID</th>
                        <th class="p-3">Kullanıcı Adı</th>
                        <th class="p-3">Bakiye (PEPE)</th>
                        <th class="p-3">Bilet</th>
                        <th class="p-3">Cüzdan</th>
                        <th class="p-3 text-right">İşlemler</th>
                    </tr>
                </thead>
                <tbody id="user-table-body" class="divide-y divide-slate-800/60">
                    <!-- Dinamik Dolacak -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allUsers = [];

        function loadAdminData() {
            fetch('/api/admin/users')
                .then(res => res.json())
                .then(data => {
                    allUsers = data;
                    renderTable(allUsers);
                    calcStats(allUsers);
                }).catch(err => console.error("Admin verileri alınamadı:", err));
        }

        function renderTable(users) {
            let tbody = document.getElementById('user-table-body');
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">Kayıt bulunamadı.</td></tr>`;
                return;
            }
            let html = '';
            users.forEach(u => {
                html += `
                    <tr class="hover:bg-slate-900/40 transition-colors">
                        <td class="p-3 font-mono text-emerald-400">${u.telegram_id}</td>
                        <td class="p-3 font-bold text-white">${u.username || 'Bilinmiyor'}</td>
                        <td class="p-3 font-black">${Number(u.balance || 0).toFixed(2)} PEPE</td>
                        <td class="p-3">${u.tickets || 0} 🎫</td>
                        <td class="p-3 font-mono text-slate-400 text-[10px]">${u.wallet || 'Tanımlı Değil'}</td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="modifyBalance('${u.telegram_id}', 100)" class="bg-emerald-500/20 hover:bg-emerald-500 text-emerald-400 hover:text-slate-950 px-2.5 py-1.5 rounded-lg font-bold transition-all">+100 Pepe</button>
                            <button onclick="modifyBalance('${u.telegram_id}', -100)" class="bg-rose-500/20 hover:bg-rose-500 text-rose-400 hover:text-slate-950 px-2.5 py-1.5 rounded-lg font-bold transition-all">-100 Pepe</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function calcStats(users) {
            document.getElementById('stat-users').innerText = users.length;
            let totalB = users.reduce((acc, curr) => acc + Number(curr.balance || 0), 0);
            document.getElementById('stat-balance').innerText = totalB.toFixed(2) + " PEPE";
        }

        function modifyBalance(telegramId, amount) {
            fetch('/api/admin/modify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, amount: amount })
            }).then(() => loadAdminData())
              .catch(err => alert("İşlem başarısız: " + err));
        }

        function filterUsers() {
            let query = document.getElementById('search-input').value.toLowerCase();
            let filtered = allUsers.filter(u => 
                (u.telegram_id && u.telegram_id.toLowerCase().includes(query)) ||
                (u.username && u.username.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
