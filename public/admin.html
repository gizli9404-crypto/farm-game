<!-- Log Paneli -->
<div class="glass p-6 rounded-2xl shadow-xl mt-6">
    <h2 class="font-bold text-sm text-white mb-4 flex items-center"><i class="fa-solid fa-list-ul text-blue-400 mr-2"></i> Sistem Hareket Kayıtları (Son 50)</h2>
    <div class="overflow-y-auto max-h-60">
        <table class="w-full text-left text-[11px] text-slate-400">
            <tbody id="logs-table-body">
                <tr><td class="py-2">Loglar yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Logları çekme fonksiyonu
    function loadLogs() {
        fetch('/api/admin/logs')
            .then(res => res.json())
            .then(data => {
                let tbody = document.getElementById('logs-table-body');
                tbody.innerHTML = "";
                data.logs.forEach(l => {
                    tbody.innerHTML += `
                        <tr class="border-b border-slate-800">
                            <td class="py-2 text-blue-300 font-bold">${l.action}</td>
                            <td class="py-2">${l.details}</td>
                            <td class="py-2 text-right opacity-60">${new Date(l.timestamp).toLocaleTimeString()}</td>
                        </tr>`;
                });
            });
    }

    // loadAdminData fonksiyonunun içine ekle:
    function loadAdminData() {
        // ... mevcut fetch işlemleri ...
        loadLogs(); // Bunu buraya ekle
    }
</script>
