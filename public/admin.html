<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sanal Miner Pro - Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 font-sans">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Üst Bilgi ve Şifre Alanı -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl gap-4 shadow-xl">
            <div>
                <h1 class="text-2xl font-black text-emerald-400">⚡ Sanal Miner Pro - Admin Panel</h1>
                <p class="text-xs text-slate-400 mt-1">Kullanıcı bakiyelerini yönetin, para ekleyin/çıkarın ve talepleri inceleyin.</p>
            </div>
            <div class="flex space-x-2 w-full md:w-auto">
                <input type="password" id="admin-pass" placeholder="Admin Şifresi" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 w-full md:w-64">
                <button onclick="loadAllData()" class="bg-emerald-500 text-slate-950 font-bold px-5 py-2 rounded-xl text-sm whitespace-nowrap hover:bg-emerald-400 transition-all shadow-lg">Verileri Yenile</button>
            </div>
        </div>

        <!-- Sekmeler -->
        <div class="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
            <button onclick="switchTab('users')" id="tab-users-btn" class="px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500 text-slate-950 transition-all">Kullanıcı & Bakiye Yönetimi</button>
            <button onclick="switchTab('withdrawals')" id="tab-withdrawals-btn" class="px-4 py-2 rounded-xl text-sm font-bold bg-slate-900 text-slate-400 hover:text-white transition-all">Çekim Talepleri</button>
            <button onclick="switchTab('ads')" id="tab-ads-btn" class="px-4 py-2 rounded-xl text-sm font-bold bg-slate-900 text-slate-400 hover:text-white transition-all">Anlık Reklam İzleyenler</button>
        </div>

        <!-- 1. Kullanıcı Yönetimi Sekmesi -->
        <div id="users-section" class="space-y-4">
            <input type="text" id="search-user" onkeyup="filterUsers()" placeholder="🔍 Kullanıcı adı, isim veya ID ile ara..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
            <div id="users-container" class="space-y-3">
                <div class="text-slate-500 text-sm p-4 bg-slate-900/50 border border-slate-800/50 rounded-xl text-center">Şifreyi girip verileri getirin.</div>
            </div>
        </div>

        <!-- 2. Çekim Talepleri Sekmesi -->
        <div id="withdrawals-section" class="space-y-3 hidden">
            <div class="text-slate-500 text-sm p-4 bg-slate-900/50 border border-slate-800/50 rounded-xl text-center">Şifreyi girip verileri getirin.</div>
        </div>

        <!-- 3. Anlık Reklamlar Sekmesi -->
        <div id="ads-section" class="space-y-3 hidden">
            <div class="text-slate-500 text-sm p-4 bg-slate-900/50 border border-slate-800/50 rounded-xl text-center">Şifreyi girip verileri getirin.</div>
        </div>

    </div>

    <script>
        let cachedData = { users: [], withdrawals: [], ads: [] };

        function switchTab(tab) {
            ['users', 'withdrawals', 'ads'].forEach(t => {
                document.getElementById(`${t}-section`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).className = "px-4 py-2 rounded-xl text-sm font-bold bg-slate-900 text-slate-400 hover:text-white transition-all";
            });
            document.getElementById(`${tab}-section`).classList.remove('hidden');
            document.getElementById(`tab-${tab}-btn`).className = "px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500 text-slate-950 transition-all shadow-lg";
        }

        async function loadAllData() {
            const pass = document.getElementById('admin-pass').value;
            if (!pass) {
                alert("Lütfen admin şifresini girin!");
                return;
            }

            try {
                const [resU, resW, resA] = await Promise.all([
                    fetch(`/api/admin/users?secret=${pass}`),
                    fetch(`/api/admin/withdrawals?secret=${pass}`),
                    fetch(`/api/admin/ads?secret=${pass}`)
                ]);

                if (!resU.ok || !resW.ok || !resA.ok) {
                    alert("Yetkisiz erişim veya yanlış şifre!");
                    return;
                }

                cachedData.users = await resU.json();
                cachedData.withdrawals = await resW.json();
                cachedData.ads = await resA.json();

                renderUsers(cachedData.users);
                renderWithdrawals();
                renderAds();
            } catch (err) {
                alert("Veriler yüklenirken hata oluştu: " + err);
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('users-container');
            container.innerHTML = users.length === 0 ? '<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center text-slate-400 text-sm">Kullanıcı bulunamadı.</div>' : '';
            
            users.forEach(user => {
                container.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-md">
                        <div>
                            <div class="font-bold text-white text-base">${user.full_name || 'İsimsiz'} <span class="text-xs text-emerald-400">(@${user.username})</span></div>
                            <div class="text-xs text-slate-400 mt-0.5">ID: <code class="text-slate-200">${user.user_id}</code> | Bilet: ${user.tickets}</div>
                            <div class="text-xs text-slate-300 font-mono bg-slate-950 px-2 py-1 rounded border border-slate-800 mt-1">Cüzdan: ${user.wallet || 'Yok'}</div>
                        </div>
                        <div class="flex flex-col sm:flex-row items-end sm:items-center gap-2 w-full md:w-auto">
                            <div class="text-right w-full sm:w-auto">
                                <span class="text-[10px] text-slate-400 block">Mevcut Bakiye: <strong class="text-emerald-400">${user.balance}</strong></span>
                                <input type="number" step="any" id="amount-${user.user_id}" placeholder="Miktar" class="bg-slate-950 border border-slate-800 text-white font-bold px-3 py-1.5 rounded-xl w-full sm:w-28 text-sm focus:outline-none focus:border-emerald-500 mt-1">
                            </div>
                            <div class="flex gap-1 mt-2 sm:mt-5">
                                <button onclick="modifyBalance(${user.user_id}, 'add')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition-all" title="Bakiyeye Ekle">+ Ekle</button>
                                <button onclick="modifyBalance(${user.user_id}, 'sub')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition-all" title="Bakiyeden Düş">- Çıkar</button>
                                <button onclick="modifyBalance(${user.user_id}, 'set')" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition-all" title="Direkt Eşitle">= Sabitle</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function filterUsers() {
            const query = document.getElementById('search-user').value.toLowerCase();
            const filtered = cachedData.users.filter(u => 
                u.full_name?.toLowerCase().includes(query) || 
                u.username?.toLowerCase().includes(query) || 
                String(u.user_id).includes(query)
            );
            renderUsers(filtered);
        }

        async function modifyBalance(userId, action) {
            const pass = document.getElementById('admin-pass').value;
            const inputVal = document.getElementById(`amount-${userId}`).value;
            const amount = parseFloat(inputVal);

            if (isNaN(amount)) {
                alert("Lütfen geçerli bir miktar girin!");
                return;
            }

            try {
                const res = await fetch('/api/admin/update_balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret: pass, user_id: userId, amount: amount, action: action })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("İşlem başarılı! Verileri güncellemek için 'Verileri Yenile'ye basın.");
                    loadAllData();
                } else {
                    alert("Hata: " + data.message);
                }
            } catch (err) {
                alert("Bağlantı hatası: " + err);
            }
        }

        function renderWithdrawals() {
            const container = document.getElementById('withdrawals-section');
            container.innerHTML = cachedData.withdrawals.length === 0 ? '<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center text-slate-400 text-sm">Talep yok.</div>' : '';
            cachedData.withdrawals.forEach(item => {
                container.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 text-sm shadow-md">
                        <div>
                            <div class="font-black text-emerald-400 text-base">${item.amount} PEPE <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">ID: ${item.user_id}</span></div>
                            <div class="text-xs text-slate-400 mt-1">Kullanıcı: @${item.username}</div>
                            <div class="text-xs text-slate-300 font-mono bg-slate-950 p-2 rounded border border-slate-800 mt-1">Cüzdan: ${item.wallet}</div>
                        </div>
                        <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1.5 rounded-xl text-xs font-bold">${item.status}</span>
                    </div>`;
            });
        }

        function renderAds() {
            const container = document.getElementById('ads-section');
            container.innerHTML = cachedData.ads.length === 0 ? '<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center text-slate-400 text-sm">Henüz reklam izleyen yok.</div>' : '';
            cachedData.ads.forEach(ad => {
                container.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center text-sm shadow-md">
                        <div>
                            <div class="font-bold text-white">@${ad.username} <span class="text-xs text-slate-400">(ID: ${ad.user_id})</span></div>
                            <div class="text-xs text-slate-500 mt-0.5">Zaman: ${ad.timestamp}</div>
                        </div>
                        <div class="bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-xl text-emerald-400 font-black text-xs">
                            +${ad.reward} Ödül
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
