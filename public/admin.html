<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Elite Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #050505; color: #fff; font-family: sans-serif; }</style>
</head>
<body class="p-6">
    <h1 class="text-2xl font-bold mb-6 text-amber-500">👑 ELITE BINANCE & OTONOM KONTROL</h1>
    
    <!-- İstatistikler -->
    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">Toplam Kullanıcı: <span id="count" class="font-bold">0</span></div>
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">Toplam Bakiye: <span id="total" class="font-bold">0</span></div>
    </div>

    <!-- İşlem Alanları -->
    <div class="grid grid-cols-2 gap-8">
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-700">
            <h2 class="text-sm font-bold mb-4">OTONOM DUYURU</h2>
            <textarea id="msg" class="w-full bg-black p-3 rounded mb-2 text-xs" placeholder="Mesajınız..."></textarea>
            <button onclick="broadcast()" class="w-full bg-blue-600 py-2 rounded font-bold text-xs">KANALA GÖNDER</button>
        </div>
        
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-700">
            <h2 class="text-sm font-bold mb-4">MANUEL BAKİYE EKLE</h2>
            <input id="tid" placeholder="Telegram ID" class="w-full bg-black p-2 rounded mb-2 text-xs">
            <input id="amt" placeholder="Miktar" class="w-full bg-black p-2 rounded mb-2 text-xs">
            <button onclick="addBalance()" class="w-full bg-emerald-600 py-2 rounded font-bold text-xs">BAKİYE YÜKLE</button>
        </div>
    </div>

    <!-- Çekim Talepleri -->
    <div class="mt-8 bg-slate-900 p-6 rounded-xl border border-slate-700">
        <h2 class="text-sm font-bold mb-4">BEKLEYEN ÇEKİM TALEPLERİ</h2>
        <div id="withdraw-list" class="space-y-2 text-xs"></div>
    </div>

    <script>
        async function fetchAdminData() {
            // Kullanıcıları ve çekimleri çekip listele
            const res = await fetch('/api/admin/users');
            const users = await res.json();
            document.getElementById('count').innerText = users.length;
            document.getElementById('total').innerText = users.reduce((a, b) => a + b.balance, 0);
        }

        async function addBalance() {
            const telegram_id = document.getElementById('tid').value;
            const amount = document.getElementById('amt').value;
            await fetch('/api/admin/add-balance', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telegram_id, amount }) 
            });
            alert("Bakiye eklendi!");
            fetchAdminData();
        }

        async function broadcast() {
            const message = document.getElementById('msg').value;
            await fetch('/api/admin/broadcast', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message }) 
            });
            alert("Duyuru gönderildi!");
        }

        fetchAdminData();
    </script>
</body>
</html>
