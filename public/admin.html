<!DOCTYPE html>
<html>
<body>
    <h1>Admin Paneli</h1>
    <table border="1">
        <thead><tr><th>ID</th><th>Username</th><th>Balance</th></tr></thead>
        <tbody id="user-list"></tbody>
    </table>
    <script>
        fetch('/api/users').then(res => res.json()).then(data => {
            const list = document.getElementById('user-list');
            data.forEach(u => {
                list.innerHTML += `<tr><td>${u.telegram_id}</td><td>${u.username}</td><td>${u.balance}</td></tr>`;
            });
        });
    </script>
</body>
</html>
