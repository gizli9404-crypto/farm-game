<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sanal Miner Pro — Admin Control</title>
    <link rel="stylesheet" href="style.css"> <!-- Kendi stil dosyanız -->
</head>
<body>
    <div class="admin-container">
        <h1>Sanal Miner Pro — Admin Control & Live Logs</h1>

        <!-- DUYURU GÖNDERME ALANI -->
        <div class="card">
            <h3>📢 TELEGRAM BOT DUYURU GÖNDER</h3>
            <textarea id="broadcastText" placeholder="Tüm kullanıcılara bildirim olarak gönderilecek metin..."></textarea>
            <button id="sendBroadcastBtn" onclick="sendBroadcast()">Toplu Bildirim Gönder</button>
        </div>

        <!-- ÇEKİMLER TABLOSU -->
        <div class="card">
            <h3>💳 ÇEKİMLER (Aktif)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Kimden</th>
                        <th>Tutar</th>
                        <th>Cüzdan / Durum</th>
                    </tr>
                </thead>
                <tbody id="withdrawalsTableBody">
                    <!-- Dinamik doldurulacak -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Çekim Taleplerini Tabloya Çekme Fonksiyonu
        async function loadWithdrawals() {
            try {
                const response = await fetch('/api/withdrawals');
                const data = await response.json();
                if (data.success) {
                    const tbody = document.getElementById('withdrawalsTableBody');
                    tbody.innerHTML = '';
                    data.withdrawals.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>@${item.username || item.telegram_id}</td>
                            <td>${item.amount} PEPE</td>
                            <td>${item.wallet} (${item.status})</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) {
                console.error('Çekimler yüklenirken hata:', e);
            }
        }

        // Toplu Duyuru Gönderme Fonksiyonu
        async function sendBroadcast() {
            const message = document.getElementById('broadcastText').value;
            if (!message) {
                alert('Lütfen bir duyuru metni yazın!');
                return;
            }

            try {
                const response = await fetch('/api/broadcast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                if (data.success) {
                    alert(`Duyuru başarıyla ${data.sent_count} kullanıcıya gönderildi!`);
                    document.getElementById('broadcastText').value = '';
                } else {
                    alert('Hata: ' + data.error);
                }
            } catch (e) {
                alert('Bağlantı hatası oluştu.');
            }
        }

        // Sayfa açıldığında ve her 5 saniyede bir çekimleri güncelle
        loadWithdrawals();
        setInterval(loadWithdrawals, 5000);
    </script>
</body>
</html>
