<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Miner - Yönetici Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .login-wrapper { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .sidebar { background: #212529; color: #fff; min-height: 100vh; padding: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 10px 15px; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: #0d6efd; color: #fff; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="loginSection" class="login-wrapper">
        <div class="card p-4" style="width: 380px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-shield-halved fa-3x text-primary mb-2"></i>
                <h4>Yönetici Girişi</h4>
                <p class="text-muted small">Devam etmek için şifrenizi girin</p>
            </div>
            <div class="mb-3">
                <input type="password" id="adminPassword" class="form-control" placeholder="Admin Şifresi">
            </div>
            <button onclick="loginAdmin()" class="btn btn-primary w-100">Giriş Yap</button>
            <div id="loginError" class="text-danger text-center small mt-2"></div>
        </div>
    </div>

    <!-- ADMIN PANELİ ANA GÖVDESİ -->
    <div id="adminPanel" class="container-fluid" style="display: none;">
        <div class="row">
            <!-- Sol Menü -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="text-white mb-4"><i class="fa-solid fa-server"></i> Miner Admin</h4>
                <a href="#" class="active"><i class="fa-solid fa-users me-2"></i> Kullanıcılar</a>
                <a href="#" onclick="location.reload()" class="text-danger mt-5"><i class="fa-solid fa-right-from-bracket me-2"></i> Çıkış Yap</a>
            </div>

            <!-- İçerik Alanı -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Kullanıcı Yönetimi</h2>
                    <button onclick="loadData()" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-rotate"></i> Yenile</button>
                </div>

                <!-- Toplu Duyuru Kartı -->
                <div class="card p-3 mb-4">
                    <h5 class="mb-3"><i class="fa-solid fa-bullhorn text-primary"></i> Toplu Duyuru Gönder</h5>
                    <div class="input-group">
                        <input type="text" id="broadcastText" class="form-control" placeholder="Tüm kullanıcılara gidecek duyuru mesajı...">
                        <button onclick="sendBroadcast()" class="btn btn-success">Gönder</button>
                    </div>
                </div>

                <!-- Kullanıcılar Tablosu -->
                <div class="card p-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Telegram ID</th>
                                    <th>Kullanıcı Adı</th>
                                    <th>Bakiye (PEPE)</th>
                                    <th>Bilet</th>
                                    <th>Cüzdan</th>
                                    <th>İşlemler</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <!-- Dinamik Dolacak -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bakiye Düzenleme Modal -->
    <div class="modal fade" id="balanceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content card">
                <div class="modal-header">
                    <h5 class="modal-title">Bakiye Güncelle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modalTelegramId">
                    <div class="mb-3">
                        <label class="form-label">İşlem Türü</label>
                        <select id="modalAction" class="form-select">
                            <option value="add">Ekle (+)</option>
                            <option value="sub">Çıkar (-)</option>
                            <option value="set">Sabitle (=)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Miktar</label>
                        <input type="number" id="modalAmount" class="form-control" placeholder="Miktar girin">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="updateBalance()">Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let secretKey = '';

        async function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    secretKey = password;
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadData();
                } else {
                    document.getElementById('loginError').innerText = data.error || 'Hatalı şifre!';
                }
            } catch (e) {
                document.getElementById('loginError').innerText = 'Sunucu bağlantı hatası!';
            }
        }

        async function loadData() {
            try {
                const res = await fetch(`/api/admin/users?secret=${secretKey}`);
                const users = await res.json();
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                if (!Array.isArray(users)) return;

                users.forEach(user => {
                    tbody.innerHTML += `
                        <tr>
                            <td><code>${user.telegram_id}</code></td>
                            <td>@${user.username || 'Bilinmiyor'}</td>
                            <td><strong>${user.balance}</strong> PEPE</td>
                            <td>${user.tickets}</td>
                            <td><small class="text-muted">${user.wallet || 'Yok'}</small></td>
                            <td>
                                <button onclick="openBalanceModal('${user.telegram_id}')" class="btn btn-sm btn-outline-primary">
                                    <i class="fa-solid fa-wallet"></i> Bakiye
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error('Veri çekilemedi:', e);
            }
        }

        function openBalanceModal(telegramId) {
            document.getElementById('modalTelegramId').value = telegramId;
            new bootstrap.Modal(document.getElementById('balanceModal')).show();
        }

        async function updateBalance() {
            const telegram_id = document.getElementById('modalTelegramId').value;
            const action = document.getElementById('modalAction').value;
            const amount = parseFloat(document.getElementById('modalAmount').value);

            if (isNaN(amount)) return alert('Geçerli bir miktar girin!');

            const res = await fetch('/api/admin/update-balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id, action, amount })
            });
            const data = await res.json();
            if (data.success) {
                bootstrap.Modal.getInstance(document.getElementById('balanceModal')).hide();
                loadData();
            } else {
                alert('Hata: ' + data.error);
            }
        }

        async function sendBroadcast() {
            const message = document.getElementById('broadcastText').value;
            if (!message) return alert('Duyuru metni boş olamaz!');

            const res = await fetch('/api/broadcast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await res.json();
            if (data.success) {
                alert(`Duyuru başarıyla ${data.sent_count} kullanıcıya gönderildi.`);
                document.getElementById('broadcastText').value = '';
            } else {
                alert('Gönderilemedi!');
            }
        }
    </script>
</body>
</html>
