<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Quest Hub - Admin Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #030712; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="p-6 max-w-4xl mx-auto space-y-6">
    <header class="glass p-5 rounded-2xl flex justify-between items-center">
        <h1 class="font-black text-base text-indigo-400"><i class="fa-solid fa-shield-halved mr-2"></i> Admin Yönetim Paneli</h1>
        <button onclick="loadStats()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold">Yenile</button>
    </header>

    <div class="grid grid-cols-2 gap-4">
        <div class="glass p-5 rounded-2xl">
            <p class="text-xs text-slate-400">Toplam Kullanıcı</p>
            <h3 id="stat-users" class="text-3xl font-black text-indigo-400 mt-1">0</h3>
        </div>
        <div class="glass p-5 rounded-2xl">
            <p class="text-xs text-slate-400">Toplam Dolaşımdaki QST</p>
            <h3 id="stat-balance" class="text-3xl font-black text-amber-400 mt-1">0</h3>
        </div>
    </div>

    <div class="glass p-6 rounded-2xl space-y-4">
        <h2 class="font-bold text-sm">Toplu Duyuru Gönder</h2>
        <textarea id="broadcast-msg" rows="3" placeholder="Duyuru metni..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs outline-none"></textarea>
        <button onclick="sendBroadcast()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-xs">Herkese Gönder</button>
    </div>

    <script>
        function loadStats() {
            fetch('/api/admin/stats').then(res => res.json()).then(data => {
                if(data.success) {
                    document.getElementById('stat-users').innerText = data.totalUsers || 0;
                    document.getElementById('stat-balance').innerText = Number(data.totalBalance || 0).toLocaleString();
                }
            });
        
        function sendBroadcast() {
            let message = document.getElementById('broadcast-msg').value;
            if(!message) return;
            fetch('/api/admin/broadcast', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message })
            }).then(res => res.json()).then(() => alert("Duyuru gönderildi!"));
        }
        loadStats();
    </script>
</body>
</html>
