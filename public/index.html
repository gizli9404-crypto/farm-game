<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLADIATOR PROTOCOL</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;900&display=swap');
        
        body { background: #0f0f12; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .arena { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; background: linear-gradient(135deg, #1a1a20, #000); }

        .gladiator-card { 
            width: 100%; max-width: 350px; background: #18181c; border: 2px solid #ff3e3e; 
            border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 0 30px rgba(255, 62, 62, 0.2);
        }
        
        .name-tag { font-family: 'Anton', sans-serif; font-size: 32px; letter-spacing: 2px; color: #ff3e3e; text-transform: uppercase; }
        .stats { display: flex; justify-content: space-around; margin: 20px 0; color: #bbb; font-weight: 900; }
        
        .battle-btn { 
            width: 100%; padding: 15px; border: none; border-radius: 10px; background: #ff3e3e; 
            color: #fff; font-weight: 900; font-size: 18px; cursor: pointer; text-transform: uppercase;
        }

        .ad-booster { 
            width: 100%; margin-top: 20px; background: #2a2a32; border-radius: 15px; 
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
        }

        .leaderboard-mini { 
            width: 100%; max-width: 350px; background: rgba(0,0,0,0.3); border-radius: 15px; 
            padding: 10px; font-size: 12px;
        }
    </style>
</head>
<body>

<div class="arena">
    <div class="gladiator-card">
        <div class="name-tag">BLOOD KNIGHT</div>
        <div class="stats">
            <div>ATK: 450</div>
            <div>HP: 1200</div>
        </div>
        <button class="battle-btn" onclick="battle()">ARENA'YA GİR</button>

        <div class="ad-booster">
            <div>
                <div style="font-size: 12px; color: #ff3e3e; font-weight: 900;">EPIC BOOSTER</div>
                <div style="font-size: 10px;">+200% Hasar (Reklam ile)</div>
            </div>
            <button onclick="reklamGoster()" style="background: #333; border: none; padding: 8px; border-radius: 5px; color: #fff; font-weight: 900;">İZLE</button>
        </div>
    </div>

    <div class="leaderboard-mini">
        <div style="text-align: center; color: #ff3e3e; font-weight: 900; margin-bottom: 10px;">ARENA LİDERLİĞİ</div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 5px;"><span>1. Zeus</span> <span>9999 Puan</span></div>
        <div style="display: flex; justify-content: space-between; padding: 5px;"><span>2. Ares</span> <span>8750 Puan</span></div>
    </div>
</div>

<script>
    function battle() { alert("Arena aranıyor..."); }

    function reklamGoster() {
        if (typeof window.Adsgram !== 'undefined') {
            window.Adsgram.init({ blockId: "int-your-block-id-here" }).show()
            .then(() => alert("Saldırı gücü ikiye katlandı!"))
            .catch(() => alert("Reklam kapatıldı."));
        } else {
            alert("Test Modu: Güç 2x Oldu!");
        }
    }
</script>
</body>
</html>
