<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Farm - Land Expansion Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.js"></script>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: #141c33;
            --accent-green: #22c55e;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-wrapper {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }
        #notification-toast {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 700;
            display: none;
            z-index: 1000;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
            white-space: nowrap;
        }
        /* Üst Dashboard */
        .dashboard {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-val {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 2px;
        }
        .stat-val.gold { color: var(--accent-gold); }

        /* Ana Tarla Alanı */
        .farm-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .farm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .seed-selector {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-gold);
            cursor: pointer;
        }

        /* Dinamik Blok Grid Yapısı (2x2, 3x3 vb.) */
        .plots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            transition: all 0.3s ease;
        }
        .plots-grid.expanded-3x3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .plot-card {
            background: #1a233d;
            border: 2px solid #2a375e;
            border-radius: 14px;
            padding: 10px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .plot-card.ready {
            border-color: var(--accent-green);
            background: linear-gradient(135deg, rgba(34,197,94,0.12), #1a233d);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
        }

        .plot-icon { font-size: 26px; margin-bottom: 2px; }
        .plot-text { font-size: 10px; font-weight: 700; color: var(--text-muted); }

        .growth-bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .growth-bar-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.1s linear;
        }

        .btn-action {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 3px 10px rgba(34, 197, 94, 0.3);
        }
        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
        }

        /* Arazi Blok Genişletme Paneli */
        .expansion-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bottom-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 12px;
        }
        .footer-credit { font-size: 10px; color: var(--text-muted); text-align: center; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div id="notification-toast">Bildiri</div>

        <!-- Üst Dashboard -->
        <div class="dashboard">
            <div class="stat-box">
                <span>Cüzdan</span>
                <div class="stat-val gold" id="gold-val">800 🪙</div>
            </div>
            <div class="stat-box">
                <span>Ambar Depo</span>
                <div class="stat-val" id="inv-val">0 / 30</div>
            </div>
            <div class="stat-box">
                <span>Açık Parsel</span>
                <div class="stat-val" id="parsel-val">4 / 9</div>
            </div>
        </div>

        <!-- Ana Tarla Yönetim Paneli -->
        <div class="farm-container">
            <div class="farm-header">
                <span style="font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--text-muted);">🌾 Çiftlik Arazi Bloğu</span>
                <div class="seed-selector" onclick="cycleSeed()">Tohum: <span id="current-seed-name">Buğday</span></div>
            </div>

            <!-- Parsel Grid Alanı -->
            <div class="plots-grid" id="plots-grid"></div>

            <!-- Arazi Satın Al / Blok Genişletme Bölümü -->
            <div class="expansion-panel" id="expansion-box">
                <div>
                    <div style="font-weight: 700; font-size: 11px;" id="expand-title">Yeni Blok Parsel Satın Al</div>
                    <div style="font-size: 10px; color: var(--text-muted);" id="expand-desc">Tarlayı büyütmek için yeni arsa aç</div>
                </div>
                <button class="btn-action btn-gold" style="width: auto; padding: 7px 14px;" onclick="expandLandBlock()">Arsa Al (<span id="expand-cost">350</span> 🪙)</button>
            </div>
        </div>

        <!-- Bonus & Reklam Paneli -->
        <div class="bottom-panel">
            <span style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted);">📺 Sponsorlu Yatırımlar</span>
            <div class="panel-row">
                <div>
                    <div style="font-weight: 700; font-size: 12px;">Ödüllü Tarım Kredisi</div>
                    <div style="font-size: 10px; color: var(--text-muted);">Reklam izle, anında +300 Altın al</div>
                </div>
                <button class="btn-action btn-gold" style="width: auto; padding: 6px 12px;" onclick="watchRewardAd()">İzle</button>
            </div>
        </div>

        <div class="footer-credit">Stellar Farm Engine v5.0 - Expansion Edition</div>
    </div>

    <script>
        let gold = 800;
        let inventory = 0;
        let maxInventory = 30;

        let seeds = [
            { name: 'Buğday', cost: 10, reward: 25, time: 3, icon: '🌾' },
            { name: 'Mısır', cost: 25, reward: 65, time: 5, icon: '🌽' },
            { name: 'Çilek', cost: 50, reward: 140, time: 8, icon: '🍓' }
        ];
        let currentSeedIdx = 0;

        // Toplam 9 parsellik arsa haritası (Başlangıçta 4 tanesi açık)
        let plots = [
            { id: 0, unlocked: true, status: 'empty', progress: 0, seed: null, timer: null },
            { id: 1, unlocked: true, status: 'empty', progress: 0, seed: null, timer: null },
            { id: 2, unlocked: true, status: 'empty', progress: 0, seed: null, timer: null },
            { id: 3, unlocked: true, status: 'empty', progress: 0, seed: null, timer: null },
            { id: 4, unlocked: false, status: 'locked', progress: 0, seed: null, timer: null },
            { id: 5, unlocked: false, status: 'locked', progress: 0, seed: null, timer: null },
            { id: 6, unlocked: false, status: 'locked', progress: 0, seed: null, timer: null },
            { id: 7, unlocked: false, status: 'locked', progress: 0, seed: null, timer: null },
            { id: 8, unlocked: false, status: 'locked', progress: 0, seed: null, timer: null }
        ];

        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "40974" }) : null;

        function showToast(msg) {
            const t = document.getElementById('notification-toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2400);
        }

        function updateUI() {
            document.getElementById('gold-val').innerText = gold + " 🪙";
            document.getElementById('inv-val').innerText = inventory + " / " + maxInventory;
            
            let unlockedCount = plots.filter(p => p.unlocked).length;
            document.getElementById('parsel-val').innerText = unlockedCount + " / 9";
            document.getElementById('current-seed-name').innerText = seeds[currentSeedIdx].name;

            // Eğer 4'ten fazla parsel açıldıysa gridi 3x3 formata genişlet
            const gridEl = document.getElementById('plots-grid');
            if (unlockedCount > 4) {
                gridEl.classList.add('expanded-3x3');
            } else {
                gridEl.classList.remove('expanded-3x3');
            }

            // Sonraki arsa açma maliyeti
            if (unlockedCount >= 9) {
                document.getElementById('expansion-box').style.display = 'none';
            } else {
                let cost = unlockedCount * 350;
                document.getElementById('expand-cost').innerText = cost;
            }

            renderPlots();
        }

        function cycleSeed() {
            currentSeedIdx = (currentSeedIdx + 1) % seeds.length;
            showToast(`Seçilen Tohum: ${seeds[currentSeedIdx].name}`);
            updateUI();
        }

        function renderPlots() {
            const grid = document.getElementById('plots-grid');
            grid.innerHTML = '';
            
            plots.forEach((p, idx) => {
                // Sadece kilidi açılmış veya açılacak sıradaki parselleri göster
                if (!p.unlocked && idx > 0 && !plots[idx-1].unlocked) return; // Sıralı açılım için kontrol

                let card = document.createElement('div');
                card.className = 'plot-card';

                if (!p.unlocked) {
                    card.innerHTML = `
                        <div class="plot-icon">🔒</div>
                        <div class="plot-text">Arsa Kapalı</div>
                        <div style="font-size:9px; color:var(--accent-gold); margin-top:2px;">Blok #${idx+1}</div>
                    `;
                } else if (p.status === 'empty') {
                    let s = seeds[currentSeedIdx];
                    card.innerHTML = `
                        <div class="plot-icon">🟫</div>
                        <div class="plot-text">Boş Toprak</div>
                        <button class="btn-action" style="margin-top:4px; padding:4px;" onclick="plantPlot(${idx})">Ekir (-${s.cost}🪙)</button>
                    `;
                } else if (p.status === 'growing') {
                    card.innerHTML = `
                        <div class="plot-icon">🌱</div>
                        <div class="plot-text" style="color:var(--accent-gold)">Büyüyor</div>
                        <div class="growth-bar-bg"><div class="growth-bar-fill" style="width: ${p.progress}%"></div></div>
                    `;
                } else if (p.status === 'ready') {
                    card.className += ' ready';
                    card.innerHTML = `
                        <div class="plot-icon">${p.seed.icon}</div>
                        <div class="plot-text" style="color:var(--accent-green)">HAZIR!</div>
                        <button class="btn-action" style="margin-top:4px; padding:4px;" onclick="harvestPlot(${idx})">Topla (+${p.seed.reward}🪙)</button>
                    `;
                }
                grid.appendChild(card);
            });
        }

        function expandLandBlock() {
            let unlockedCount = plots.filter(p => p.unlocked).length;
            let cost = unlockedCount * 350;

            if (gold >= cost) {
                gold -= cost;
                let nextPlot = plots.find(p => !p.unlocked);
                if (nextPlot) {
                    nextPlot.unlocked = true;
                    nextPlot.status = 'empty';
                    showToast("Tebrikler! Yeni arsa bloğu satın alındı ve tarlaya eklendi! 🚜");
                    updateUI();
                }
            } else {
                showToast(`Yeterli altının yok! (${cost} 🪙 gerekli)`);
            }
        }

        function plantPlot(idx) {
            let s = seeds[currentSeedIdx];
            if (gold < s.cost) {
                showToast("Bu tohum için altının yetersiz!");
                return;
            }
            gold -= s.cost;
            plots[idx].status = 'growing';
            plots[idx].seed = s;
            plots[idx].progress = 0;
            updateUI();

            let speedStep = 100 / (s.time * 10);
            plots[idx].timer = setInterval(() => {
                plots[idx].progress += speedStep;
                if (plots[idx].progress >= 100) {
                    plots[idx].progress = 100;
                    plots[idx].status = 'ready';
                    clearInterval(plots[idx].timer);
                }
                renderPlots();
            }, 100);
        }

        function harvestPlot(idx) {
            let s = plots[idx].seed;
            gold += s.reward;
            inventory = Math.min(maxInventory, inventory + 1);
            showToast(`+${s.reward} Altın kazandın! 🎉`);
            plots[idx].status = 'empty';
            plots[idx].seed = null;
            updateUI();
        }

        function watchRewardAd() {
            if (AdController) {
                AdController.show().then(() => {
                    gold += 300;
                    showToast("Sponsor Ödülü Yüklendi: +300 🪙");
                    updateUI();
                }).catch(() => { showToast("Reklam yüklenemedi."); });
            } else {
                gold += 300;
                showToast("Test Modu: +300 Altın hesabına eklendi! 🪙");
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
