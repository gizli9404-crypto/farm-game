<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Stellar Farm | Executive</title>
    <style>
        /* Modern, Dark, Telegram-esque UI */
        :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f8fafc; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 500px; height: 100%; display: flex; flex-direction: column; border-left: 1px solid #334155; border-right: 1px solid #334155; }
        
        /* Stats Header */
        .header { padding: 20px; background: #020617; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; }
        .stat-item { font-weight: bold; color: #94a3b8; }
        .stat-value { color: var(--accent); font-size: 1.2em; }

        /* Game Area */
        .viewport { flex: 1; overflow-y: auto; padding: 15px; }
        .farm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .plot { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #334155; transition: 0.2s; }
        .plot:hover { border-color: var(--accent); }
        
        /* Buttons */
        button { background: var(--accent); border: none; padding: 10px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; width: 100%; }
        button:disabled { background: #475569; }

        /* Footer Navigation */
        .nav { display: flex; background: #020617; padding: 10px; justify-content: space-around; border-top: 1px solid #334155; }
        .nav-btn { background: none; color: #64748b; font-size: 0.8em; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <div class="stat-item">🪙 <span id="gold" class="stat-value">500</span></div>
        <div class="stat-item">📦 <span id="storage" class="stat-value">0/50</span></div>
    </div>

    <div class="viewport" id="view">
        <!-- Farm Content -->
        <div class="farm-grid" id="farm-plots"></div>
    </div>

    <div class="nav">
        <button class="nav-btn" onclick="render('farm')">🌾 Tarla</button>
        <button class="nav-btn" onclick="render('workers')">👷 İşçiler</button>
        <button class="nav-btn" onclick="render('market')">📈 Borsa</button>
    </div>
</div>

<script>
    let state = { gold: 500, storage: 0, capacity: 50, plots: [0, 0, 0, 0], workers: 0 };
    
    function render(tab) {
        const view = document.getElementById('view');
        if(tab === 'farm') {
            view.innerHTML = `<div class="farm-grid" id="farm-plots"></div>`;
            state.plots.forEach((p, i) => {
                document.getElementById('farm-plots').innerHTML += `
                    <div class="plot">
                        <div>Parsel ${i+1}</div>
                        <button onclick="plant(${i})">Ekin (50🪙)</button>
                    </div>`;
            });
        } else if(tab === 'workers') {
            view.innerHTML = `<h3>Otomasyon</h3><button onclick="hireWorker()">İşçi Kirala (500🪙)</button>
            <p>Mevcut İşçi: ${state.workers}</p>`;
        } else if(tab === 'market') {
            view.innerHTML = `<h3>Piyasa Durumu</h3><p>Ürün fiyatları dalgalanıyor...</p><button onclick="sellAll()">Tümünü Sat</button>`;
        }
    }

    function plant(i) {
        if(state.gold >= 50) {
            state.gold -= 50;
            update();
            setTimeout(() => {
                state.storage += 10;
                alert("Hasat toplandı!");
                update();
            }, 3000);
        }
    }

    function update() {
        document.getElementById('gold').innerText = state.gold;
        document.getElementById('storage').innerText = `${state.storage}/${state.capacity}`;
    }

    function hireWorker() {
        if(state.gold >= 500) {
            state.gold -= 500;
            state.workers++;
            update();
            render('workers');
        }
    }

    function sellAll() {
        state.gold += state.storage * 10;
        state.storage = 0;
        update();
    }

    render('farm');
</script>
</body>
</html>
