<script>
        let gameState = { balance: 0.00, tickets: 0, wallet: "" };
        let telegramId = "user_" + Math.floor(Math.random() * 1000000); 
        let username = "MiniAppUser";

        const tg = window.Telegram?.WebApp;
        if (tg) {
            try {
                tg.expand();
                if (tg.initDataUnsafe?.user?.id) {
                    telegramId = tg.initDataUnsafe.user.id.toString();
                    username = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || "TelegramUser";
                }
            } catch (e) {
                console.log("Telegram WebApp API yüklenemedi, tarayıcı modunda devam ediliyor.");
            }
        }

        function sendActivityLog(actionType, details) {
            // Sunucu yoksa hatayı yutması için try-catch eklendi
            try {
                fetch('/api/user/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: telegramId, username: username, action: actionType,
                        details: details, balance: gameState.balance, tickets: gameState.tickets, wallet: gameState.wallet
                    })
                }).catch(err => {});
            } catch(e) {}
        }

        function syncToDatabase() {
            try {
                fetch('/api/user/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId, username: username, balance: gameState.balance, tickets: gameState.tickets, wallet: gameState.wallet })
                }).catch(err => {});
            } catch(e) {}
        }

        function fetchUserData() {
            // Yerel depolama (localStorage) desteği eklendi ki sunucu olmasa bile verileriniz kaybolmasın
            let savedData = localStorage.getItem('sanal_miner_' + telegramId);
            if (savedData) {
                try {
                    let parsed = JSON.parse(savedData);
                    gameState.balance = parsed.balance || 0;
                    gameState.tickets = parsed.tickets || 0;
                    gameState.wallet = parsed.wallet || "";
                    updateUI();
                } catch(e) {}
            }

            fetch(`/api/user/${telegramId}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.balance !== undefined) {
                        gameState.balance = data.balance;
                        gameState.tickets = data.tickets;
                        gameState.wallet = data.wallet || "";
                        updateUI();
                    }
                })
                .catch(err => {
                    console.log("Sunucu bağlantısı yok, yerel hafıza modu aktif.");
                    updateUI();
                });
        }

        function saveUserData() {
            localStorage.setItem('sanal_miner_' + telegramId, JSON.stringify(gameState));
            syncToDatabase();
        }

        let currentRotation = 0;
        let isSpinning = false;
        
        // Ses bağlamı hataya sebep olmaması için tıklama anında başlatılacak şekilde ertelendi
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            try {
                let ctx = getAudioContext();
                if (!ctx) return;
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                let now = ctx.currentTime;
                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.02, now); gain.gain.linearRampToValueAtTime(0, now + 0.05);
                } else if (type === 'win') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                }
                osc.start(now); osc.stop(now + 0.4);
            } catch(e) {}
        }

        function playClickSound() { playSound('click'); }
        function toggleTheme() { document.body.classList.toggle('light-theme'); }
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            let targetTab = document.getElementById('tab-' + tabId);
            if(targetTab) targetTab.classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-emerald-400');
                btn.classList.add('text-slate-400');
                if(btn.getAttribute('data-target') === tabId) btn.classList.add('text-emerald-400');
            });
            if(tabId === 'rank') {
                fetchLeaderboard();
            }
        }

        function updateUI() {
            let balEl = document.getElementById('balance');
            let rankBalEl = document.getElementById('rank-balance');
            let ticketEl = document.getElementById('ticket-count');
            let progBar = document.getElementById('progress-bar');
            let progText = document.getElementById('progress-text');

            if(balEl) balEl.innerText = gameState.balance.toFixed(4);
            if(rankBalEl) rankBalEl.innerText = gameState.balance.toFixed(2) + " PEPE";
            if(ticketEl) ticketEl.innerText = gameState.tickets + " Biletiniz Var";
            
            let progressPercent = Math.min((gameState.balance / 5000) * 100, 100);
            if(progBar) progBar.style.width = progressPercent + '%';
            if(progText) progText.innerText = `${gameState.balance.toFixed(2)} / 5,000 PEPE (${progressPercent.toFixed(1)}%)`;
        }

        function showModal(title, desc, isSuccess = true) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            let modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            let modal = document.getElementById('custom-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function watchAdTask(taskId, counterId, maxLimit) {
            let countEl = document.getElementById(counterId);
            let currentCount = parseInt(countEl.innerText || "0");
            if(currentCount >= maxLimit) { showModal("Limit", "Günlük sınır.", false); return; }
            
            showModal("Reklam", "Sponsorlu reklam simülasyonu...", true);
            setTimeout(() => {
                currentCount++;
                countEl.innerText = currentCount;
                gameState.tickets += 1;
                saveUserData();
                updateUI();
                showModal("Başarılı", "+1 bilet eklendi!", true);
            }, 1000);
        }

        function spinWheel() {
            if (isSpinning) return;
            if (gameState.tickets < 1) { showModal("Bilet Yok", "Çevirmek için bilet gerekli.", false); return; }

            isSpinning = true;
            gameState.tickets -= 1;
            saveUserData();
            updateUI();

            let prizes = [50, 0, 250, 1000, 0, 100];
            let prize = prizes[Math.floor(Math.random() * prizes.length)];
            currentRotation += 1800 + Math.random() * 360;
            let wheel = document.getElementById('svg-wheel');
            if(wheel) wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                if (prize > 0) {
                    gameState.balance += prize;
                    saveUserData();
                    updateUI();
                    if (typeof confetti === 'function') confetti({ particleCount: 50 });
                    showModal("Kazanıldı!", `Çarktan ${prize} PEPE kazandınız!`, true);
                } else {
                    showModal("Boş", "Ödül çıkmadı.", false);
                }
            }, 5000);
        }

        function copyRefLink() {
            let refLinkInput = document.getElementById("ref-link");
            if(refLinkInput) {
                navigator.clipboard.writeText(refLinkInput.value);
                showModal("Kopyalandı", "Davet linki panoda.", true);
            }
        }

        function shareViaTelegram() {
            let refLinkInput = document.getElementById("ref-link");
            let url = refLinkInput ? refLinkInput.value : "";
            window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=PEPE Kazan!`, '_blank');
        }

        function requestWithdraw() {
            let addrEl = document.getElementById('wallet-addr');
            let amountEl = document.getElementById('withdraw-amount');
            let networkEl = document.getElementById('wallet-network');

            let addr = addrEl ? addrEl.value.trim() : "";
            let amount = amountEl ? parseFloat(amountEl.value) : 0;
            let network = networkEl ? networkEl.value : "TON";

            if (!addr || amount < 5000 || gameState.balance < amount) {
                showModal("Hata", "Adres veya bakiye yetersiz (Min: 5000 PEPE).", false);
                return;
            }

            gameState.balance -= amount;
            gameState.wallet = addr;
            saveUserData();
            updateUI();
            showModal("Başarılı", "Çekim talebiniz başarıyla oluşturuldu!", true);
        }

        function fetchLeaderboard() {
            let listEl = document.getElementById('leaderboard-list');
            if(listEl) {
                listEl.innerHTML = `
                    <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-emerald-500/50 bg-emerald-500/10">
                        <div class="flex items-center space-x-2">
                            <span class="text-amber-400 font-black">🥇</span>
                            <span class="text-white font-bold">${username} (Siz)</span>
                        </div>
                        <span class="text-emerald-400 font-black">${gameState.balance.toFixed(2)} PEPE</span>
                    </div>
                `;
            }
        }

        window.onload = function() {
            fetchUserData();
        };
    </script>
