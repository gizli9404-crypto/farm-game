<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest Master - Elite Farm Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.js"></script>
    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: #131c2e;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }
        #toast-notification {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            white-space: nowrap;
        }
        /* Üst Panel Durum Çubuğu */
        .top-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
        }
        .stat-value {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 2px;
        }
        .stat-value.gold { color: var(--accent-gold); }

        /* Sekmeler */
        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 14px;
            gap: 4px;
        }
        .nav-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
        }
        .nav-btn.active {
            background: var(--accent-green);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* İçerik Alanları */
        .content-panel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            min-height: 280px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .content-panel.active {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        /* Grid Kartları */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .game-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            min-height: 100px;
        }
        .game-card.ready {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.05);
        }

        /* İlerleme Çubuğu */
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.3s linear;
        }

        /* Butonlar */
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-gold {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .market-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 12px;
        }
        .footer-note {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="toast-notification">Bildiri</div>

        <!-- Üst Bilgi Paneli -->
        <div class="top-bar">
            <div class="stat-item">
                <span>SERVET</span>
                <div class="stat-value gold" id="lbl-gold">500 🪙</div>
            </div>
            <div class="stat-item">
                <span>DEPO</span>
                <div class="stat-value" id="lbl-inv">0 / 25</div>
            </div>
            <div class="stat-item">
                <span>SEVİYE</span>
                <div class="stat-value" id="lbl-lvl">1 ⭐</div>
            </div>
        </div>

        <!-- Sekme Navigasyonu -->
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('farm', this)">🌾 Tarla</button>
            <button class="nav-btn" onclick="switchTab('factory', this)">🏭 Fabrika</button>
            <button class="nav-btn" onclick="switchTab('market', this)">🛒 Pazar</button>
            <button class="nav-btn" onclick="switchTab('ads', this)">📺 Ödül</button>
        </div>

        <!-- 1. TARLA PANELİ -->
        <div id="panel-farm" class="content-panel active">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="section-title" style="margin:0;">Tarım Arazileri</span>
                <span style="font-size: 11px; color: var(--accent-gold);">Aktif: Buğday (5s)</span>
            </div>
            <div class="grid-cards" id="farm-grid"></div>
        </div>

        <!-- 2. FABRİKA PANELİ -->
        <div id="panel-factory" class="content-panel">
            <span class="section-title">Gıda İşleme Tesisi</span>
            <div class="grid-cards" id="factory-grid"></div>
        </div>

        <!-- 3. PAZAR & SİPARİŞLER -->
        <div id="panel-market" class="content-panel">
            <span class="section-title">Şehir İhracat Pazarı</span>
            <div id="market-list"></div>
            <button class="btn-primary" onclick="sellAllGoods()">📦 Tüm Depoyu Nakite Çevir</button>
        </div>

        <!-- 4. REKLAM & BONUS PANELİ -->
        <div id="panel-ads" class="content-panel">
            <span class="section-title">Destek & Sponsorluk</span>
            <div class="market-row">
                <div>
                    <div style="font-weight: 700; font-size: 12px;">Sponsor Reklamı İzle</div>
                    <div style="font-size: 10px; color: var(--text-muted);">Anında +200 Altın kazan</div>
                </div>
                <button class="btn-primary btn-gold" style="width: auto; padding: 6px 14px;" onclick="watchAdReward()">İzle</button>
            </div>
            <div class="market-row">
                <div>
                    <div style="font-weight: 700; font-size: 12px;">Hızlı Hasat Booster</div>
                    <div style="font-size: 10px; color: var(--text-muted);">Süreleri 2 kat hızlandır</div>
                </div>
                <button class="btn-primary btn-gold" style="width: auto; padding: 6px 14px;" onclick="watchAdBooster()">Aktif Et</button>
            </div>
        </div>

        <div class="footer-note">Harvest Master Enterprise Edition v3.0</div>
    </div>

    <script>
        let gold = 500;
        let inventoryCount = 0;
        let level = 1;
        let speedMultiplier = 1;

        let plots = [
            { id: 0, status: 'empty', progress: 0, timer: null },
            { id: 1, status: 'empty', progress: 0, timer: null },
            { id: 2, status: 'locked', progress: 0, timer: null },
            { id: 3, status: 'locked', progress: 0, timer: null }
        ];

        let factories = [
            { id: 0, name: 'Değirmen ⚙️', product: 'Un', status: 'ready', progress: 0, timer: null },
            { id: 1, name: 'Fırın 🥖', product: 'Ekmek', status: 'ready', progress: 0, timer: null }
        ];

        let storage = { Buğday: 0, Un: 0, Ekmek: 0 };

        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "40974" }) : null;

        function showToast(text) {
            const t = document.getElementById('toast-notification');
            t.innerText = text;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2300);
        }

        function updateUI() {
            document.getElementById('lbl-gold').innerText = gold + " 🪙";
            document.getElementById('lbl-inv').innerText = inventoryCount + " / 25";
            document.getElementById('lbl-lvl').innerText = level + " ⭐";
            renderFarm();
            renderFactory();
            renderMarket();
        }

        function renderFarm() {
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';
            plots.forEach((p, idx) => {
                let card = document.createElement('div');
                card.className = 'game-card';
                if (p.status === 'locked') {
                    card.innerHTML = `🔒 Kilitli Arazi<br><button class="btn-primary" style="margin-top:8px;" onclick="unlockPlot(${idx})">150 🪙 Aç</button>`;
                } else if (p.status === 'empty') {
                    card.innerHTML = `🟫 Boş Toprak<br><span style="font-size:10px; color:var(--text-muted);">Buğday ek (10 🪙)</span><button class="btn-primary" style="margin-top:8px;" onclick="plantPlot(${idx})">Ekir</button>`;
                } else if (p.status === 'growing') {
                    card.innerHTML = `🌱 Büyüyor...<div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${p.progress}%"></div></div><span style="font-size:10px; color:var(--accent-gold);">${Math.round(p.progress)}%</span>`;
                } else if (p.status === 'ready') {
                    card.className += ' ready';
                    card.innerHTML = `✨ HAZIR!<br><span style="font-size:10px; color:var(--text-main);">Buğday Yetişti</span><button class="btn-primary" style="margin-top:8px;" onclick="harvestPlot(${idx})">Hasat Et</button>`;
                }
                grid.appendChild(card);
            });
        }

        function unlockPlot(idx) {
            if (gold >= 150) {
                gold -= 150;
                plots[idx].status = 'empty';
                showToast("Yeni arazi tarıma açıldı! 🌾");
                updateUI();
            } else {
                showToast("Yeterli altının yok! (150 🪙 gerekli)");
            }
        }

        function plantPlot(idx) {
            if (gold < 10) {
                showToast("Tohum için altının yetersiz!");
                return;
            }
            gold -= 10;
            plots[idx].status = 'growing';
            plots[idx].progress = 0;
            updateUI();

            let intervalTime = 100; // 5 saniye toplam
            plots[idx].timer = setInterval(() => {
                plots[idx].progress += (2 * speedMultiplier);
                if (plots[idx].progress >= 100) {
                    plots[idx].progress = 100;
                    plots[idx].status = 'ready';
                    clearInterval(plots[idx].timer);
                }
                renderFarm();
            }, intervalTime);
        }

        function harvestPlot(idx) {
            if (inventoryCount >= 25) {
                showToast("Depo tamamen dolu!");
                return;
            }
            storage.Buğday++;
            inventoryCount++;
            plots[idx].status = 'empty';
            showToast("+1 Buğday depoya eklendi 🧺");
            updateUI();
        }

        function renderFactory() {
            const grid = document.getElementById('factory-grid');
            grid.innerHTML = '';
            factories.forEach((f, idx) => {
                let card = document.createElement('div');
                card.className = 'game-card';
                if (f.status === 'ready') {
                    card.innerHTML = `${f.name}<br><span style="font-size:10px; color:var(--text-muted);">Durum: Boşta</span><button class="btn-primary" style="margin-top:8px;" onclick="startFactory(${idx})">Üret Başla</button>`;
                } else if (f.status === 'working') {
                    card.innerHTML = `${f.name}<br><div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${f.progress}%"></div></div><span style="font-size:10px; color:var(--accent-gold);">${Math.round(f.progress)}%</span>`;
                } else if (f.status === 'done') {
                    card.className += ' ready';
                    card.innerHTML = `${f.name}<br><span style="font-size:10px;">Ürün Hazır!</span><button class="btn-primary" style="margin-top:8px;" onclick="collectFactory(${idx})">Topla (${f.product})</button>`;
                }
                grid.appendChild(card);
            });
        }

        function startFactory(idx) {
            if (storage.Buğday < 1 && idx === 0) {
                showToast("Üretim için depoda Buğday lazım!");
                return;
            }
            if (idx === 0) storage.Buğday--;

            factories[idx].status = 'working';
            factories[idx].progress = 0;
            updateUI();

            let t = setInterval(() => {
                factories[idx].progress += (1.5 * speedMultiplier);
                if (factories[idx].progress >= 100) {
                    factories[idx].progress = 100;
                    factories[idx].status = 'done';
                    clearInterval(t);
                }
                renderFactory();
            }, 100);
        }

        function collectFactory(idx) {
            if (inventoryCount >= 25) {
                showToast("Depo dolu!");
                return;
            }
            let prod = factories[idx].product;
            storage[prod]++;
            inventoryCount++;
            showToast(`+1 ${prod} üretildi ve depoya eklendi! ✨`);
            factories[idx].status = 'ready';
            updateUI();
        }

        function renderMarket() {
            const list = document.getElementById('market-list');
            list.innerHTML = `
                <div class="market-row" style="margin-bottom:8px;">
                    <div><b>Buğday:</b> ${storage.Buğday} adet</div>
                    <span style="color:var(--accent-gold);">Değer: 25 🪙</span>
                </div>
                <div class="market-row" style="margin-bottom:8px;">
                    <div><b>Un:</b> ${storage.Un} adet</div>
                    <span style="color:var(--accent-gold);">Değer: 60 🪙</span>
                </div>
                <div class="market-row" style="margin-bottom:12px;">
                    <div><b>Ekmek:</b> ${storage.Ekmek} adet</div>
                    <span style="color:var(--accent-gold);">Değer: 150 🪙</span>
                </div>
            `;
        }

        function sellAllGoods() {
            let totalEarned = (storage.Buğday * 25) + (storage.Un * 60) + (storage.Ekmek * 150);
            if (totalEarned === 0) {
                showToast("Depoda satılacak ürün yok!");
                return;
            }
            gold += totalEarned;
            storage.Buğday = 0;
            storage.Un = 0;
            storage.Ekmek = 0;
            inventoryCount = 0;
            level++;
            showToast(`Tüm ürünler satıldı! +${totalEarned} 🪙 kazandın! 🎉`);
            updateUI();
        }

        function watchAdReward() {
            if (AdController) {
                AdController.show().then(() => {
                    gold += 200;
                    showToast("Reklam ödülü yüklendi: +200 🪙");
                    updateUI();
                }).catch(() => { showToast("Reklam yüklenemedi."); });
            } else {
                gold += 200;
                showToast("Test Modu: +200 Altın eklendi! 🪙");
                updateUI();
            }
        }

        function watchAdBooster() {
            speedMultiplier = 2;
            showToast("⚡ 2x Hızlandırıcı aktifleşti!");
            setTimeout(() => {
                speedMultiplier = 1;
                showToast("Hızlandırma süresi doldu.");
            }, 25000);
        }

        function switchTab(name, btn) {
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
            btn.classList.add('active');
        }

        updateUI();
    </script>
</body>
</html>
