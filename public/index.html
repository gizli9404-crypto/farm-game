<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash - Telegram Oyunu</title>
    <!-- AdsGram Resmi SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --primary: #8b5cf6;
            --accent: #06b6d4;
            --text: #f4f4f5;
            --border: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        .game-container {
            width: 100%; max-width: 400px; height: 100%; max-height: 800px;
            background: var(--bg); border: 1px solid var(--border); border-radius: 24px;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); position: relative; overflow: hidden;
        }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; z-index: 10; }
        .logo { font-size: 14px; font-weight: 900; color: var(--accent); letter-spacing: 1px; }
        .stats { font-size: 11px; font-weight: 800; color: var(--primary); }

        /* OYUN ALANI */
        .game-board {
            flex-grow: 1; background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; margin: 12px 0; position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }

        .target-box {
            width: 110px; height: 110px; border-radius: 24px; background: var(--bg);
            border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center;
            font-size: 36px; margin-bottom: 20px; box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
            transition: 0.1s;
        }

        .score-display { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
        .info-text { font-size: 11px; color: #a1a1aa; line-height: 1.4; margin-bottom: 20px; }

        /* BUTONLAR */
        .btn { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-accent { background: var(--accent); color: #000; margin-top: 8px; }
        .btn-ad { background: linear-gradient(135deg, #ec4899, #8b5cf6); margin-top: 8px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- ÜST PANEL -->
        <div class="header">
            <div class="logo">⚡ NEON DASH</div>
            <div class="stats">SKOR: <span id="skorDegeri">0</span> | CAN: <span id="canDegeri">3</span></div>
        </div>

        <!-- OYUN EKRANI -->
        <div class="game-board" id="startScreen">
            <div style="font-size: 48px; margin-bottom: 15px;">🎮</div>
            <h2 style="font-size: 18px; margin-bottom: 8px;">Neon Dokunma Oyunu</h2>
            <p class="info-text">Ekrana zamanında dokunarak neon küpü patlat, puanları topla! Canın bittiğinde reklam izleyerek canını yenileyebilirsin.</p>
            <button class="btn" onclick="oyunuBaslat()">OYUNA BAŞLA</button>
        </div>

        <div class="game-board hidden" id="playScreen">
            <div class="target-box" id="gameCube" onclick="puanKazan()">💎</div>
            <div class="score-display" id="liveScore">0</div>
            <div class="info-text">Küpün üzerine hızlıca tıkla!</div>
            <button class="btn" style="background:#ef4444;" onclick="oyunuBitir()">OYUNU BİTİR</button>
        </div>

        <div class="game-board hidden" id="gameOverScreen">
            <div style="font-size: 48px; margin-bottom: 10px;">💀</div>
            <h2 style="font-size: 18px; color: #ef4444; margin-bottom: 5px;">Oyun Bitti!</h2>
            <p class="info-text" id="finalScoreText">Toplam Skorun: 0</p>
            
            <button class="btn btn-ad" onclick="reklamIzleCanAl()">❤️ REKLAM İZLE & CAN AL (+3 CAN)</button>
            <button class="btn btn-accent" onclick="oyunuBaslat()">TEKRAR BAŞLA</button>
        </div>
    </div>

    <script>
        let skor = 0;
        let can = 3;

        function oyunuBaslat() {
            skor = 0;
            can = 3;
            document.getElementById("skorDegeri").innerText = skor;
            document.getElementById("canDegeri").innerText = can;

            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.add("hidden");
            document.getElementById("playScreen").classList.remove("hidden");
        }

        function puanKazan() {
            skor += 10;
            document.getElementById("skorDegeri").innerText = skor;
            document.getElementById("liveScore").innerText = skor;

            // Görsel efekt
            const cube = document.getElementById("gameCube");
            cube.style.transform = "scale(0.9)";
            setTimeout(() => { cube.style.transform = "scale(1)"; }, 100);
        }

        function oyunuBitir() {
            document.getElementById("playScreen").classList.add("hidden");
            document.getElementById("gameOverScreen").classList.remove("hidden");
            document.getElementById("finalScoreText").innerText = "Toplam Skorun: " + skor;
        }

        // AdsGram SDK Entegrasyonu (Ödüllü Reklam - Can Kazanma)
        function reklamIzleCanAl() {
            if (typeof window.Adsgram !== 'undefined') {
                window.Adsgram.init({ blockId: "int-your-block-id-here" }).show().then((result) => {
                    can = 3;
                    document.getElementById("canDegeri").innerText = can;
                    document.getElementById("gameOverScreen").classList.add("hidden");
                    document.getElementById("playScreen").classList.remove("hidden");
                    alert("Tebrikler! Reklam izlendi, 3 can yenilendi.");
                }).catch((result) => {
                    alert("Reklam tamamlanamadı.");
                });
            } else {
                // Tarayıcı Test Simülasyonu
                can = 3;
                document.getElementById("canDegeri").innerText = can;
                document.getElementById("gameOverScreen").classList.add("hidden");
                document.getElementById("playScreen").classList.remove("hidden");
                alert("AdsGram SDK simüle edildi: Canlar yenilendi!");
            }
        }
    </script>
</body>
</html>
