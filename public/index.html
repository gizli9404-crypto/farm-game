<!DOCTYPE html>
<html>
<body>
    <h1>Oyun Ekranı</h1>
    <p>Bakiyen: <span id="balance">0</span></p>
    <button onclick="addMoney()">10 Puan Kazan</button>

    <script>
        const telegram_id = "8256539395"; // Bunu kendi ID'nle değiştir
        
        function addMoney() {
            fetch('/api/update-balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegram_id, amount: 10 })
            }).then(() => location.reload());
        }

        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ telegram_id: telegram_id })
        }).then(res => res.json()).then(data => {
            document.getElementById('balance').innerText = data.balance;
        });
    </script>
</body>
</html>
