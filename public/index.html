<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Miner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #030712; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="p-4 glass-panel border-b border-slate-800">
        <h1 class="font-bold text-center">Sanal Miner Pro</h1>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 max-w-md">
        
        <!-- Maden Tabı -->
        <div id="tab-mining" class="tab-content">
            <div class="glass-panel p-6 rounded-2xl text-center">
                <p class="text-xs text-slate-400">Bakiyeniz</p>
                <h2 class="text-3xl font-black text-emerald-400" id="balance">0 PEPE</h2>
                <button onclick="claim()" class="mt-4 w-full py-3 bg-blue-600 rounded-xl font-bold">Kazım Yap</button>
            </div>
        </div>

        <!-- Liderlik Tabı (AdsGram Onayı İçin Şart) -->
        <div id="tab-leaderboard" class="tab-content hidden">
            <div class="glass-panel p-6 rounded-2xl">
                <h2 class="font-bold mb-4 flex items-center"><i class="fa-solid fa-trophy text-yellow-400 mr-2"></i> Liderlik Tablosu</h2>
                <table class="w-full text-xs text-slate-300" id="leaderboard-table">
                    <!-- JS ile doldurulacak -->
                </table>
            </div>
        </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 w-full glass-panel flex justify-around p-3 border-t border-slate-800">
        <button onclick="showTab('mining')" class="text-blue-400"><i class="fa-solid fa-server"></i></button>
        <button onclick="showTab('leaderboard'); loadLeaderboard()" class="text-slate-400"><i class="fa-solid fa-trophy"></i></button>
    </nav>

    <script>
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
        }

        async function loadLeaderboard() {
            const res = await fetch('/api/leaderboard');
            const data = await res.json();
            const table = document.getElementById('leaderboard-table');
            table.innerHTML = `<tr><th>#</th><th>Kullanıcı</th><th>PEPE</th></tr>`;
            data.leaders.forEach((u, i) => {
                table.innerHTML += `<tr><td class="py-2">${i+1}</td><td>${u.username}</td><td class="text-right text-emerald-400">${u.balance}</td></tr>`;
            });
        }
        
        async function claim() {
            // Basit madencilik isteği
            alert("Kazım başlatıldı!");
        }
    </script>
</body>
</html>
