<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Miner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .btn-glow { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body class="p-4 max-w-lg mx-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-xl font-bold tracking-tight">Sanal Miner <span class="text-emerald-500">Pro</span></h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest">Cüzdan ID: <span id="user-id">...</span></p>
        </div>
        <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700 font-bold">EA</div>
    </div>

    <!-- Bakiye Kartı -->
    <div class="glass p-6 rounded-3xl mb-6 text-center">
        <p class="text-slate-400 text-sm mb-2">Güncel Bakiye</p>
        <h2 id="main-balance" class="text-5xl font-black text-emerald-400">0.00</h2>
        <p class="text-slate-600 mt-2 font-bold">PEPE TOKEN</p>
    </div>

    <!-- Sekmeler -->
    <div class="grid grid-cols-3 gap-3 mb-6">
        <button onclick="showTab('mining')" class="p-3 rounded-2xl glass text-xs font-bold transition hover:bg-emerald-900">Kazım</button>
        <button onclick="showTab('wallet')" class="p-3 rounded-2xl glass text-xs font-bold transition hover:bg-emerald-900">Cüzdan</button>
        <button onclick="showTab('admin')" class="p-3 rounded-2xl glass text-xs font-bold transition hover:bg-emerald-900">Admin</button>
    </div>

    <!-- Paneller -->
    <div id="mining" class="tab-panel active glass p-6 rounded-3xl">
        <h3 class="text-lg font-bold mb-4">Aktif Kazım</h3>
        <button onclick="mine()" class="w-full py-4 bg-emerald-500 text-black font-black rounded-2xl btn-glow">KAZIMA BAŞLA</button>
    </div>

    <div id="wallet" class="tab-panel glass p-6 rounded-3xl">
        <h3 class="text-lg font-bold mb-4">Çekim İşlemleri</h3>
        <input id="w-amount" type="number" class="w-full p-4 mb-3 bg-black border border-slate-700 rounded-2xl" placeholder="Miktar (Min 5000)">
        <button onclick="withdraw()" class="w-full py-4 bg-slate-800 border border-slate-600 font-bold rounded-2xl">ÇEKİM TALEBİ</button>
    </div>

    <div id="admin" class="tab-panel glass p-6 rounded-3xl">
        <h3 class="text-lg font-bold mb-4">Admin Panel</h3>
        <input id="admin-val" type="number" class="w-full p-4 mb-3 bg-black border border-red-900 rounded-2xl" placeholder="Bakiye Ekle (Admin Yetkili)">
        <button onclick="adminGrant()" class="w-full py-4 bg-red-900 text-white font-bold rounded-2xl">BAKİYE YÜKLE</button>
    </div>

    <script>
        // Veri Motoru
        let data = JSON.parse(localStorage.getItem('miner_data')) || { balance: 0.0 };
        document.getElementById('user-id').innerText = "Engin_852";
        document.getElementById('main-balance').innerText = data.balance.toFixed(2);

        function saveData() {
            localStorage.setItem('miner_data', JSON.stringify(data));
            document.getElementById('main-balance').innerText = data.balance.toFixed(2);
        }

        function showTab(id) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function mine() {
            data.balance += 10.5; // Kazım miktarı
            saveData();
            alert("Kazım başarılı!");
        }

        function adminGrant() {
            let val = parseFloat(document.getElementById('admin-val').value);
            if(!isNaN(val)) {
                data.balance += val;
                saveData();
                alert("Admin tarafından bakiye eklendi: " + val);
            }
        }

        function withdraw() {
            alert("Çekim talebi alındı, işlem sıraya eklendi.");
        }
    </script>
</body>
</html>
