<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER RIG - Mining Simulator</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body { 
            background: #0a0a0c; color: #00ffcc; font-family: 'Share Tech Mono', monospace; 
            margin: 0; padding: 0; user-select: none; display: flex; flex-direction: column; height: 100vh;
        }
        
        .header { text-align: center; padding: 15px; border-bottom: 1px solid #00ffcc44; background: #111; }
        .title { font-size: 20px; letter-spacing: 2px; }
        
        .mining-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .balance-container { text-align: center; margin-bottom: 30px; }
        .balance-title { color: #888; font-size: 14px; }
        .balance-amount { font-size: 40px; text-shadow: 0 0 15px rgba(0, 255, 204, 0.5); margin: 10px 0; }
        
        .gpu-card {
            background: #15151a; border: 1px solid #00ffcc; border-radius: 10px;
            padding: 20px; width: 100%; max-width: 300px; text-align: center;
            box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.1);
        }
        
        .gpu-name { font-size: 18px; color: #fff; margin-bottom: 10px; }
        .stats { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 20px; }
        
        .tap-btn {
            background: rgba(0, 255, 204, 0.1); border: 2px solid #00ffcc; color: #00ffcc;
            width: 150px; height: 150px; border-radius: 50%; font-size: 24px; font-family: inherit;
            cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center;
            margin: 0 auto;
        }
        .tap-btn:active { transform: scale(0.95); background: rgba(0, 255, 204, 0.3); }

        .bottom-nav { background: #111; padding: 15px; border-top: 1px solid #00ffcc44; }
        
        .boost-card {
            background: #1a1a24; border: 1px dashed #ff0055; border-radius: 8px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .boost-info h4 { margin: 0; color: #ff0055; font-size: 16px; }
        .boost-info p { margin: 5px 0 0 0; font-size: 11px; color: #aaa; }
        
        .ad-btn {
            background: #ff0055; color: #fff; border: none; padding: 10px 15px;
            border-radius: 5px; font-family: inherit; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">_SYSTEM.RIG_MASTER_</div>
    </div>

    <div class="mining-area">
        <div class="balance-container">
            <div class="balance-title">TOPLAM KAZIM (CYBER)</div>
            <div class="balance-amount" id="balance">0.000</div>
        </div>

        <div class="gpu-card">
            <div class="gpu-name">ASUS RX 470 (Modlu)</div>
            <div class="stats">
                <span>Güç: 24 MH/s</span>
                <span>Sıcaklık: 65°C</span>
            </div>
            
            <button class="tap-btn" onclick="mine()">KAZ (TAP)</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="boost-card">
            <div class="boost-info">
                <h4>OVERCLOCK MODU</h4>
                <p>Reklam izle, 30 sn boyunca 2x kazım yap!</p>
            </div>
            <button class="ad-btn" onclick="watchAd()">AKTİF ET</button>
        </div>
    </div>

    <script>
        let balance = 0.000;
        let clickValue = 0.001;
        const balanceEl = document.getElementById("balance");

        // Tıklama (Kazım) Fonksiyonu
        function mine() {
            balance += clickValue;
            balanceEl.innerText = balance.toFixed(3);
            
            // Tıklama efekti eklenebilir
            if (navigator.vibrate) navigator.vibrate(50); // Telefonda titreme yapar
        }

        // AdsGram Reklam Fonksiyonu
        function watchAd() {
            if (typeof window.Adsgram !== 'undefined') {
                window.Adsgram.init({ blockId: "senin-reklam-kodun" }).show()
                .then(() => {
                    alert("Overclock Başarılı! Kazım gücü 2 katına çıktı.");
                    clickValue = 0.002; // Reklam bitince tıklama gücünü artır
                    setTimeout(() => { 
                        clickValue = 0.001; 
                        alert("Overclock bitti. Güç normale döndü.");
                    }, 30000);
                })
                .catch(() => alert("Reklam tam izlenmedi."));
            } else {
                // Test Modu
                alert("TEST: Reklam izlendi, x2 Güç aktif!");
                clickValue = 0.002;
                setTimeout(() => clickValue = 0.001, 30000);
            }
        }
    </script>
</body>
</html>
