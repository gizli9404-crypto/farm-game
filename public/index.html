<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenValley Farm Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        #toast {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        .header-stats {
            background: var(--card);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 13px;
        }
        .tabs {
            display: flex;
            background: var(--card);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #000;
        }
        .panel {
            display: none;
            background: var(--card);
            border-radius: 14px;
            padding: 12px;
            min-height: 240px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .panel.active {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .card-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            font-size: 12px;
        }
        .card-box.ready {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.08);
        }
        button.action-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            margin-top: 5px;
            width: 100%;
        }
        button.action-btn:active { transform: scale(0.97); }
        
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 11px;
        }
        .footer {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="toast">Bildiri</div>

        <!-- Üst İstatistikler -->
        <div class="header-stats">
            <div>🪙 <span id="gold">300</span> Altın</div>
            <div>📦 Depo: <span id="inventoryCount">0</span>/20</div>
            <div>⭐ Lv.<span id="level">1</span></div>
        </div>

        <!-- Sekme Butonları -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('farm', this)">🌾 Tarım</button>
            <button class="tab-btn" onclick="switchTab('animals', this)">🐄 Hayvancılık</button>
            <button class="tab-btn" onclick="switchTab('orders', this)">📋 Siparişler</button>
            <button class="tab-btn" onclick="switchTab('ads', this)">📺 Ödüllü Reklam</button>
        </div>

        <!-- 1. TARIM PANELİ -->
        <div id="farm-panel" class="panel active">
            <div style="font-size: 11px; color: var(--text-secondary); display:flex; justify-content:space-between; align-items:center;">
                <span>Aktif Tohum: <b id="seedName" style="color:var(--text)">Buğday (5s)</b></span>
                <button onclick="selectSeed('Buğday', 10, 5)" style="width:auto; padding:3px 8px; font-size:10px;" class="action-btn">Buğday Seç</button>
            </div>
            <div class="grid-2" id="farmGrid"></div>
        </div>

        <!-- 2. HAYVANCILIK PANELİ -->
        <div id="animals-panel" class="panel">
            <div style="font-size: 11px; color: var(--text-secondary);">Ahır ve Kümes Üretimi</div>
            <div class="grid-2" id="animalGrid"></div>
        </div>

        <!-- 3. SİPARİŞLER PANELİ -->
        <div id="orders-panel" class="panel">
            <div style="font-size: 11px; color: var(--text-secondary); font-weight: bold;">Şehir Pazarı Siparişleri</div>
            <div id="ordersList"></div>
        </div>

        <!-- 4. REKLAM PANELİ (Adsgram Entegrasyonu) -->
        <div id="ads-panel" class="panel">
            <div style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">Reklam İzle, Anında Ödül Kazan!</div>
            <div class="list-item">
                <span>📺 Reklam İzle (+150 Altın)</span>
                <button class="action-btn" style="width: auto; padding: 6px 12px;" onclick="watchRewardAd()">İzle & Kazan</button>
            </div>
            <div class="list-item">
                <span>⚡ 2x Hızlandırıcı (30 Saniye)</span>
                <button class="action-btn" style="width: auto; padding: 6px 12px;" onclick="watchSpeedAd()">Aktif Et</button>
            </div>
        </div>

        <div class="footer">GreenValley Pro v2.5 - Compliant System</div>
    </div>

    <script>
        let gold = 300;
        let inventoryCount = 0;
        let level = 1;
        let activeSeed = { name: 'Buğday', cost: 10, time: 5, reward: 25 };

        let plots = [
            { id: 0, status: 'empty', timeLeft: 0, timer: null },
            { id: 1, status: 'empty', timeLeft: 0, timer: null },
            { id: 2, status: 'locked', timeLeft: 0, timer: null },
            { id: 3, status: 'locked', timeLeft: 0, timer: null }
        ];

        let animals = [
            { id: 0, name: 'İnek 🐄', product: 'Süt', status: 'ready', time: 10, timeLeft: 0, timer: null },
            { id: 1, name: 'Tavuk 🐔', product: 'Yumurta', status: 'ready', time: 6, timeLeft: 0, timer: null }
        ];

        let orders = [
            { id: 1, req: '2x Buğday', reward: 70, count: 2, item: 'Buğday' }
        ];

        let storage = { Buğday: 0, Süt: 0, Yumurta: 0 };

        // Adsgram entegrasyonu (Blok ID: 40974)
        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "40974" }) : null;

        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2200);
        }

        function updateUI() {
            document.getElementById('gold').innerText = gold;
            document.getElementById('inventoryCount').innerText = inventoryCount;
            document.getElementById('level').innerText = level;
            renderFarm();
            renderAnimals();
            renderOrders();
        }

        function renderFarm() {
            let grid = document.getElementById('farmGrid');
            grid.innerHTML = '';
            plots.forEach((p, idx) => {
                let div = document.createElement('div');
                div.className = 'card-box';
                if (p.status === 'locked') {
                    div.innerHTML = `🔒 Kilitli<br><button class="action-btn" onclick="unlockPlot(${idx})">100 🪙 Aç</button>`;
                } else if (p.status === 'empty') {
                    div.innerHTML = `🟫 Boş Toprak<br><button class="action-btn" onclick="plantPlot(${idx})">Ekir (-${activeSeed.cost})</button>`;
                } else if (p.status === 'growing') {
                    div.innerHTML = `🌱 Büyüyor...<br><b style="color:#22c55e">${p.timeLeft}s</b>`;
                } else if (p.status === 'ready') {
                    div.className += ' ready';
                    div.innerHTML = `✨ HAZIR!<br><button class="action-btn" onclick="harvestPlot(${idx})">Hasat Et</button>`;
                }
                grid.appendChild(div);
            });
        }

        function unlockPlot(idx) {
            if (gold >= 100) {
                gold -= 100;
                plots[idx].status = 'empty';
                showToast("Yeni tarla açıldı!");
                updateUI();
            } else {
                showToast("Altının yetersiz!");
            }
        }

        function plantPlot(idx) {
            if (gold < activeSeed.cost) {
                showToast("Tohum için altının yok!");
                return;
            }
            gold -= activeSeed.cost;
            plots[idx].status = 'growing';
            plots[idx].timeLeft = activeSeed.time;
            updateUI();

            plots[idx].timer = setInterval(() => {
                plots[idx].timeLeft--;
                if (plots[idx].timeLeft <= 0) {
                    clearInterval(plots[idx].timer);
                    plots[idx].status = 'ready';
                }
                renderFarm();
            }, 1000);
        }

        function harvestPlot(idx) {
            if (inventoryCount >= 20) {
                showToast("Depo dolu! Siparişleri tamamla.");
                return;
            }
            storage.Buğday++;
            inventoryCount++;
            plots[idx].status = 'empty';
            showToast("+1 Buğday depoya eklendi!");
            updateUI();
        }

        function renderAnimals() {
            let grid = document.getElementById('animalGrid');
            grid.innerHTML = '';
            animals.forEach((a, idx) => {
                let div = document.createElement('div');
                div.className = 'card-box';
                if (a.status === 'ready') {
                    div.className += ' ready';
                    div.innerHTML = `${a.name}<br><button class="action-btn" onclick="collectAnimal(${idx})">Topla (${a.product})</button>`;
                } else {
                    div.innerHTML = `${a.name}<br><b style="color:#22c55e">${a.timeLeft}s bekliyor</b>`;
                }
                grid.appendChild(div);
            });
        }

        function collectAnimal(idx) {
            if (inventoryCount >= 20) {
                showToast("Depo dolu!");
                return;
            }
            let prod = animals[idx].product;
            storage[prod]++;
            inventoryCount++;
            showToast(`+1 ${prod} toplandı!`);

            animals[idx].status = 'cooldown';
            animals[idx].timeLeft = animals[idx].time;
            animals[idx].timer = setInterval(() => {
                animals[idx].timeLeft--;
                if (animals[idx].timeLeft <= 0) {
                    clearInterval(animals[idx].timer);
                    animals[idx].status = 'ready';
                }
                renderAnimals();
            }, 1000);
            updateUI();
        }

        function renderOrders() {
            let list = document.getElementById('ordersList');
            list.innerHTML = '';
            orders.forEach((o, idx) => {
                let div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<span><b>Sipariş:</b> ${o.req}</span><button class="action-btn" style="width:auto; padding:4px 8px;" onclick="completeOrder(${idx})">Teslim Et (${o.reward} 🪙)</button>`;
                list.appendChild(div);
            });
        }

        function completeOrder(idx) {
            let o = orders[idx];
            if (storage[o.item] >= o.count) {
                storage[o.item] -= o.count;
                inventoryCount -= o.count;
                gold += o.reward;
                level++;
                showToast("Sipariş teslim edildi, ödül alındı! 🎉");
                // Yeni sipariş üret
                orders[idx] = { id: Date.now(), req: '2x Buğday', reward: 80, count: 2, item: 'Buğday' };
                updateUI();
            } else {
                showToast("Deponda yeterli ürün yok!");
            }
        }

        function watchRewardAd() {
            if (AdController) {
                AdController.show().then(() => {
                    gold += 150;
                    showToast("Reklam ödülü eklendi: +150 Altın! 🪙");
                    updateUI();
                }).catch(() => { showToast("Reklam gösterilemedi."); });
            } else {
                // Test ortamı için simülasyon
                gold += 150;
                showToast("Test Modu: +150 Altın eklendi! 🪙");
                updateUI();
            }
        }

        function watchSpeedAd() {
            showToast("Hızlandırma aktif! (Test Modu)");
        }

        function switchTab(name, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name + '-panel').classList.add('active');
            btn.classList.add('active');
        }

        updateUI();
    </script>
</body>
</html>
