<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanal Miner Pro - Elite Ultimate Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #030712 0%, #0f172a 100%); color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        .glass-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(30, 41, 59, 0.65); border: 1px solid rgba(255, 255, 255, 0.06); }
        .tab-content { display: none; }
        .tab-content.active { display: flex; }
        #svg-wheel { transition: transform 5s cubic-bezier(0.15, 0.85, 0.05, 1); transform-origin: center; }
        @keyframes neon-pulse { 0%, 100% { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.3)); } 50% { filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.6)); } }
        .wheel-glow { animation: neon-pulse 4s infinite ease-in-out; }
    </style>
</head>
<body class="flex flex-col h-screen justify-between overflow-hidden">

    <!-- HEADER -->
    <header class="p-4 glass-panel border-b border-slate-800/80 z-20 space-y-3">
        <div class="flex justify-between items-center">
            <div class="flex bg-slate-950/90 p-1 rounded-xl border border-slate-800/80">
                <button class="px-4 py-1.5 rounded-lg bg-emerald-500 text-slate-950 font-black text-xs">PEPE</button>
            </div>
            <div class="flex space-x-2">
                <button onclick="switchTab('wallet')" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl font-bold border border-slate-700/60 shadow">Çekim</button>
            </div>
        </div>

        <!-- Bakiye Kartı -->
        <div class="glass-card p-4 rounded-2xl space-y-2 shadow-lg">
            <div class="text-[10px] text-slate-400 font-black tracking-wider uppercase">Toplam Bakiyeniz</div>
            <div class="flex items-baseline space-x-2">
                <span id="balance" class="text-3xl font-black text-white tracking-tight">150.0000</span>
                <span class="text-xs font-bold text-emerald-400">PEPE</span>
            </div>
            <div class="w-full bg-slate-950/90 h-2 rounded-full overflow-hidden border border-slate-800">
                <div id="progress-bar" class="bg-emerald-500 h-full w-[3%] transition-all"></div>
            </div>
        </div>
    </header>

    <!-- ANA İÇERİK -->
    <main class="flex-1 overflow-y-auto p-4 pb-24 flex flex-col space-y-4">
        
        <!-- HOME -->
        <div id="tab-home" class="tab-content flex-col space-y-4 active">
            <div class="glass-card p-4 rounded-2xl flex items-center justify-between border-slate-800 shadow">
                <div>
                    <div class="text-xs font-bold text-white">AdsGram Sponsorlu Reklam</div>
                    <div class="text-[10px] text-emerald-400 font-bold">+1 🎫 Bilet</div>
                </div>
                <button onclick="watchAdTask()" class="bg-emerald-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs">İzle</button>
            </div>
        </div>

        <!-- SPIN -->
        <div id="tab-spin" class="tab-content flex-col items-center space-y-4">
            <div class="relative w-56 h-56 flex items-center justify-center wheel-glow">
                <div class="absolute -top-3 z-30 text-amber-400 text-2xl animate-bounce"><i class="fa-solid fa-caret-down"></i></div>
                <svg id="svg-wheel" class="w-52 h-52 rounded-full border-4 border-slate-800" viewBox="0 0 100 100">
                    <path d="M50 50 L50 3 A47 47 0 0 1 90.7 26.5 Z" fill="#0369a1"/>
                    <path d="M50 50 L90.7 26.5 A47 47 0 0 1 90.7 73.5 Z" fill="#1e293b"/>
                    <path d="M50 50 L90.7 73.5 A47 47 0 0 1 50 97 Z" fill="#6d28d9"/>
                    <path d="M50 50 L50 97 A47 47 0 0 1 9.3 73.5 Z" fill="#b45309"/>
                    <path d="M50 50 L9.3 73.5 A47 47 0 0 1 9.3 26.5 Z" fill="#1e293b"/>
                    <path d="M50 50 L9.3 26.5 A47 47 0 0 1 50 3 Z" fill="#047857"/>
                </svg>
            </div>
            <button id="spin-btn" onclick="spinWheel()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl text-sm border border-slate-700">Çarkı Çevir</button>
        </div>

        <!-- WALLET -->
        <div id="tab-wallet" class="tab-content flex-col space-y-4">
            <div class="glass-card p-4 rounded-2xl space-y-3">
                <input type="text" id="wallet-addr" placeholder="TON/BEP20 Cüzdan Adresi" class="w-full bg-slate-950 p-3 rounded-xl text-xs border border-slate-700 text-white">
                <button onclick="requestWithdraw()" class="w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl text-xs">Bot ile Çekim Yap</button>
            </div>
            <div id="live-withdrawals" class="space-y-2"></div>
        </div>
    </main>

    <!-- JS MANTIĞI -->
    <script>
        let gameState = { balance: 150.00, tickets: 2 };
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function updateUI() {
            document.getElementById('balance').innerText = gameState.balance.toFixed(4);
            document.getElementById('progress-bar').style.width = Math.min((gameState.balance / 5000) * 100, 100) + '%';
        }

        function spinWheel() {
            if(gameState.tickets <= 0) return alert("Biletin yok!");
            gameState.tickets -= 1;
            let wheel = document.getElementById('svg-wheel');
            wheel.style.transform = `rotate(${360 * 5 + Math.random() * 360}deg)`;
            setTimeout(() => { 
                gameState.balance += 50; 
                updateUI();
                alert("Tebrikler 50 PEPE kazandın!"); 
            }, 5000);
        }

        function requestWithdraw() {
            const addr = document.getElementById('wallet-addr').value;
            if(addr.length < 10) return alert("Geçersiz adres!");
            const amount = 5000;
            if(gameState.balance >= amount) {
                gameState.balance -= amount;
                updateUI();
                let log = document.createElement('div');
                log.className = "p-2 bg-slate-800 rounded text-xs text-emerald-400";
                log.innerText = "İşlem onaylandı: " + addr.slice(0,6) + "...";
                document.getElementById('live-withdrawals').prepend(log);
            }
        }
        
        function watchAdTask() {
            gameState.tickets += 1;
            alert("Reklam izlendi, 1 Bilet eklendi!");
            updateUI();
        }
    </script>
</body>
</html>
