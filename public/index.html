<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Empire - Tap & Idle Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* Üst Bilgi Kartı */
        .stats-card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .gold-display {
            font-size: 32px;
            font-weight: 800;
            color: #fbbf24;
            margin: 4px 0;
        }
        .profit-display {
            font-size: 13px;
            color: var(--text-secondary);
        }
        /* Ana Tıklama Alanı */
        .clicker-section {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .farm-btn-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto;
            cursor: pointer;
            user-select: none;
        }
        .farm-circle {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #059669, #10b981);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
            transition: transform 0.1s ease;
        }
        .farm-circle:active {
            transform: scale(0.92);
        }
        /* Uçan Altın Efekti */
        .floating-text {
            position: absolute;
            font-weight: bold;
            color: #fbbf24;
            font-size: 20px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
        }
        /* Sekmeler */
        .tabs {
            display: flex;
            background: var(--card);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 10px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent);
            color: white;
        }
        /* İçerik Panelleri */
        .panel {
            display: none;
            background: var(--card);
            border-radius: 16px;
            padding: 14px;
            min-height: 220px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .panel.active {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .shop-info h4 {
            margin: 0;
            font-size: 13px;
        }
        .shop-info p {
            margin: 2px 0 0 0;
            font-size: 11px;
            color: var(--text-secondary);
        }
        button.buy-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.buy-btn:hover {
            background: var(--accent-hover);
        }
        button.buy-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Üst Bilgi Alanı -->
        <div class="stats-card">
            <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;">Toplam Servet</div>
            <div class="gold-display" id="goldDisplay">🪙 0</div>
            <div class="profit-display">⚡ Saatlik Pasif Gelir: +<span id="profitDisplay">0</span> /saat</div>
        </div>

        <!-- Tıklama / Kazanç Alanı -->
        <div class="clicker-section">
            <div class="farm-btn-container" id="clickArea" onclick="handleTap(event)">
                <div class="farm-circle">🌾</div>
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: var(--text-secondary);">Hasat etmek için tıkla!</div>
        </div>

        <!-- Sekme Butonları -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('upgrades', this)">🚀 Geli̇ştirmeler</button>
            <button class="tab-btn" onclick="switchTab('business', this)">🏭 Fabrikalar</button>
            <button class="tab-btn" onclick="switchTab('quests', this)">🎯 Görevler</button>
        </div>

        <!-- 1. Geliştirmeler Paneli -->
        <div id="upgrades-panel" class="panel active">
            <div class="shop-item">
                <div class="shop-info">
                    <h4>Elmas Çapa ⛏️</h4>
                    <p>Tıklama başına +1 Altın</p>
                </div>
                <button class="buy-btn" id="up1Btn" onclick="buyUpgrade(1)">50 🪙</button>
            </div>
            <div class="shop-item">
                <div class="shop-info">
                    <h4>Otomatik Sulama 💧</h4>
                    <p>Tıklama başına +5 Altın</p>
                </div>
                <button class="buy-btn" id="up2Btn" onclick="buyUpgrade(2)">300 🪙</button>
            </div>
        </div>

        <!-- 2. Fabrikalar / Pasif Gelir Paneli -->
        <div id="business-panel" class="panel">
            <div class="shop-item">
                <div class="shop-info">
                    <h4>Küçük Sera 🏡</h4>
                    <p>+10 Altın / saat</p>
                </div>
                <button class="buy-btn" id="b1Btn" onclick="buyBusiness(1)">100 🪙</button>
            </div>
            <div class="shop-item">
                <div class="shop-info">
                    <h4>Süt İnekleri 🐄</h4>
                    <p>+60 Altın / saat</p>
                </div>
                <button class="buy-btn" id="b2Btn" onclick="buyBusiness(2)">500 🪙</button>
            </div>
            <div class="shop-item">
                <div class="shop-info">
                    <h4>Dev Traktör 🚜</h4>
                    <p>+300 Altın / saat</p>
                </div>
                <button class="buy-btn" id="b3Btn" onclick="buyBusiness(3)">2500 🪙</button>
            </div>
        </div>

        <!-- 3. Görevler Paneli -->
        <div id="quests-panel" class="panel">
            <div class="shop-item">
                <div class="shop-info">
                    <h4>İlk Hasat 🌿</h4>
                    <p>10 kez tarlaya dokun</p>
                </div>
                <button class="buy-btn" onclick="claimQuest(1)" id="q1Btn">Ödül Al (50 🪙)</button>
            </div>
        </div>
    </div>

    <script>
        let gold = 100;
        let tapPower = 1;
        let passiveIncome = 0;
        let totalTaps = 0;

        // Yükseltme Maliyetleri ve Seviyeleri
        let upgrades = {
            1: { cost: 50, powerAdd: 1, level: 0 },
            2: { cost: 300, powerAdd: 5, level: 0 }
        };

        // Fabrikalar
        let businesses = {
            1: { cost: 100, incomeAdd: 10, count: 0 },
            2: { cost: 500, incomeAdd: 60, count: 0 },
            3: { cost: 2500, incomeAdd: 300, count: 0 }
        };

        let questCompleted = false;

        function updateUI() {
            document.getElementById('goldDisplay').innerText = "🪙 " + Math.floor(gold);
            document.getElementById('profitDisplay').innerText = passiveIncome;

            // Buton durumları
            document.getElementById('up1Btn').innerText = upgrades[1].cost + " 🪙";
            document.getElementById('up1Btn').disabled = gold < upgrades[1].cost;

            document.getElementById('up2Btn').innerText = upgrades[2].cost + " 🪙";
            document.getElementById('up2Btn').disabled = gold < upgrades[2].cost;

            document.getElementById('b1Btn').innerText = businesses[1].cost + " 🪙 (" + businesses[1].count + ")";
            document.getElementById('b1Btn').disabled = gold < businesses[1].cost;

            document.getElementById('b2Btn').innerText = businesses[2].cost + " 🪙 (" + businesses[2].count + ")";
            document.getElementById('b2Btn').disabled = gold < businesses[2].cost;

            document.getElementById('b3Btn').innerText = businesses[3].cost + " 🪙 (" + businesses[3].count + ")";
            document.getElementById('b3Btn').disabled = gold < businesses[3].cost;
        }

        // Tıklama Olayı & Efekt
        function handleTap(e) {
            gold += tapPower;
            totalTaps++;

            // Uçan yazı efekti
            const clickArea = document.getElementById('clickArea');
            const rect = clickArea.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;

            let el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = "+" + tapPower;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            clickArea.appendChild(el);

            setTimeout(() => el.remove(), 800);
            updateUI();
        }

        function buyUpgrade(id) {
            let up = upgrades[id];
            if (gold >= up.cost) {
                gold -= up.cost;
                tapPower += up.powerAdd;
                up.cost = Math.floor(up.cost * 1.6);
                up.level++;
                updateUI();
            }
        }

        function buyBusiness(id) {
            let b = businesses[id];
            if (gold >= b.cost) {
                gold -= b.cost;
                passiveIncome += b.incomeAdd;
                b.count++;
                b.cost = Math.floor(b.cost * 1.5);
                updateUI();
            }
        }

        function claimQuest(id) {
            if (!questCompleted && totalTaps >= 10) {
                questCompleted = true;
                gold += 50;
                let btn = document.getElementById('q1Btn');
                btn.innerText = "Tamamlandı ✅";
                btn.disabled = true;
                updateUI();
            } else {
                alert("Yeterli tıklama yapmadın! (10 tıklama gerekiyor)");
            }
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName + '-panel').classList.add('active');
            btn.classList.add('active');
        }

        // Pasif Gelir Döngüsü (Her saniye hesaba yatar)
        setInterval(() => {
            if (passiveIncome > 0) {
                gold += passiveIncome / 3600;
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
