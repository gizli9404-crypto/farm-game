<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Basit Çiftlik Oyunu</title>
    <style>
        body { background: #1b2838; color: white; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .kutu { background: #2a3f5f; width: 350px; margin: 0 auto; padding: 20px; border-radius: 10px; border: 2px solid #4a6984; }
        .tarla { background: #795548; padding: 25px; margin: 15px 0; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .tarla:hover { opacity: 0.9; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 5px; }
        button:hover { background: #2ecc71; }
    </style>
</head>
<body>

    <div class="kutu">
        <h2>🌾 Çiftlik Paneli</h2>
        <p>💰 Altın: <span id="altin">1000</span> | 📦 Depo: <span id="depo">0</span></p>
        
        <div class="tarla" id="tarlaDiv" onclick="tiklaIslem()">
            🌱 Boş Toprak (Ek)
        </div>

        <button onclick="pazardaSat()">Pazarda Sat (+100 Altın)</button>
        <p id="bilgi" style="font-size: 14px; color: #bdc3c7; margin-top: 15px;">Tarlaya tıklayarak tohum ekebilirsin.</p>
    </div>

    <script>
        let altin = 1000;
        let depo = 0;
        let durum = "bos"; // bos, buyuyor, hazir

        function tiklaIslem() {
            let tarlaDiv = document.getElementById("tarlaDiv");
            let bilgi = document.getElementById("bilgi");

            if (durum === "bos") {
                durum = "buyuyor";
                tarlaDiv.style.background = "#e67e22";
                tarlaDiv.innerHTML = "⏳ Bitki Büyüyor...";
                bilgi.innerText = "Tohum ekildi, 3 saniye bekleniyor...";

                setTimeout(() => {
                    durum = "hazir";
                    tarlaDiv.style.background = "#27ae60";
                    tarlaDiv.innerHTML = "🌽 Hasat Zamanı! (Tıkla)";
                    bilgi.innerText = "Ürün olgunlaştı! Şimdi hasat etmek için tarlaya tıkla.";
                }, 3000);

            } else if (durum === "hazir") {
                durum = "bos";
                depo += 1;
                tarlaDiv.style.background = "#795548";
                tarlaDiv.innerHTML = "🌱 Boş Toprak (Ek)";
                bilgi.innerText = "Ürün depoya eklendi! Pazarda satabilirsin.";
                
                document.getElementById("depo").innerText = depo;
            } else if (durum === "buyuyor") {
                bilgi.innerText = "⚠ Bitki henüz büyümedi, lütfen bekle!";
            }
        }

        function pazardaSat() {
            if (depo > 0) {
                let kazan = depo * 100;
                altin += kazan;
                document.getElementById("altin").innerText = altin;
                depo = 0;
                document.getElementById("depo").innerText = depo;
                document.getElementById("bilgi").innerText = `🎉 ${kazan} altın kazandın!`;
            } else {
                document.getElementById("bilgi").innerText = "⚠ Satılacak ürünün yok, önce hasat yap!";
            }
        }
    </script>

</body>
</html>
