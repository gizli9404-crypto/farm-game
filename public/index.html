<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Farm Adventure</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #2c2c2c;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #ffcc00;
        }
        .card {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid #333;
        }
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #388e3c; }
        button.ads { background-color: #0288d1; }
        button.ads:hover { background-color: #039be5; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .footer {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="stats">
            <div>🪙 Altın: <span id="gold">575</span></div>
            <div>🌾 Seviye: <span id="level">1</span> Çiftçi</div>
        </div>

        <!-- Tarla Bölümü -->
        <div class="card">
            <h3 id="crop-title">🥕 Havuç Tarlası</h3>
            <p id="crop-desc">Havucun büyüdü! Toplayarak altın kazanabilirsin.</p>
            <p id="timer" style="color: #ff5252; font-weight: bold; display:none;"></p>
            <button id="harvest-btn" onclick="harvestCrop()">MAHSULÜ TOPLA (+25 Altın)</button>
        </div>

        <!-- Market Bölümü -->
        <div class="card">
            <h3>🛒 Çiftlik Market</h3>
            <p style="font-size: 13px; color: #aaa;">Yeni mahsullerin kilidini aç!</p>
            <button onclick="buyCrop('Tomato', 200, '🍅 Domates', 50)">🍅 Domates Tarlası Al (200 Altın)</button>
            <button onclick="buyCrop('Strawberry', 500, '🍓 Çilek', 120)" style="background-color: #c2185b;">🍓 Çilek Tarlası Al (500 Altın)</button>
        </div>

        <!-- Ödüllü Reklam -->
        <div class="card">
            <h3>🎁 Ödüllü Görev</h3>
            <p style="font-size: 13px; color: #aaa;">Kısa bir reklam izleyerek anında altın kazan!</p>
            <button class="ads" onclick="watchAd()">▶ ️REKLAM İZLE (+100 ALTIN)</button>
        </div>

        <div class="footer">Tiny Farm Adventure v2.0 - Tam Sürüm</div>
    </div>

    <script>
        let gold = 575;
        let level = 1;
        let currentCropReward = 25;
        let unlockedCrops = ['Carrot'];
        let activeCropName = '🥕 Havuç Tarlası';

        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "40974" }) : null;

        function updateUI() {
            document.getElementById('gold').innerText = gold;
            document.getElementById('level').innerText = level;
            document.getElementById('crop-title').innerText = activeCropName;
            document.getElementById('harvest-btn').innerText = `MAHSULÜ TOPLA (+${currentCropReward} Altın)`;
        }

        function harvestCrop() {
            gold += currentCropReward;
            updateUI();
            
            const btn = document.getElementById('harvest-btn');
            btn.disabled = true;
            btn.innerText = "Büyüyor...";
            
            let timeLeft = 5; // 5 saniye büyüme süresi
            const timerEl = document.getElementById('timer');
            timerEl.style.display = 'block';
            timerEl.innerText = `Hasat için bekleniyor: ${timeLeft}s`;

            let interval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = `Hasat için bekleniyor: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerEl.style.display = 'none';
                    btn.disabled = false;
                    updateUI();
                }
            }, 1000);
        }

        function buyCrop(type, cost, name, reward) {
            if (unlockedCrops.includes(type)) {
                activeCropName = name;
                currentCropReward = reward;
                alert(name + " tarlasına geçiş yapıldı!");
                updateUI();
                return;
            }

            if (gold >= cost) {
                gold -= cost;
                level++;
                unlockedCrops.push(type);
                activeCropName = name;
                currentCropReward = reward;
                alert("Tebrikler! " + name + " tarlasını açtın!");
                updateUI();
            } else {
                alert("Yeterli altın yok!");
            }
        }

        function watchAd() {
            if (AdController) {
                AdController.show().then((result) => {
                    gold += 100;
                    updateUI();
                    alert("Tebrikler! 100 altın kazandın!");
                }).catch((result) => {
                    alert("Reklam izlenemedi.");
                });
            } else {
                // Test ortamı için doğrudan ödül
                gold += 100;
                updateUI();
                alert("Test Modu: 100 altın eklendi!");
            }
        }

        updateUI();
    </script>
</body>
</html>
