<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çekim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6 flex flex-col items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="text-lg font-black text-emerald-400">💸 Token Çekim İşlemi</h2>
        
        <div class="text-xs text-slate-400">
            Mevcut Bakiye: <span id="user-balance" class="text-white font-bold">10,000 PEPE</span>
        </div>

        <div class="space-y-1">
            <label class="text-[10px] text-slate-400 font-bold uppercase">Ağ Seçimi</label>
            <select id="network" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                <option value="TON">TON Blockchain</option>
                <option value="BEP20">Binance Smart Chain (BEP20)</option>
            </select>
        </div>

        <div class="space-y-1">
            <label class="text-[10px] text-slate-400 font-bold uppercase">Cüzdan Adresiniz</label>
            <input type="text" id="address" placeholder="UQ... veya 0x..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div class="space-y-1">
            <label class="text-[10px] text-slate-400 font-bold uppercase">Çekilecek Miktar</label>
            <input type="number" id="amount" value="5000" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>

        <button onclick="sendWithdrawRequest()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl text-xs transition-all shadow-lg cursor-pointer">
            Çekim Talebi Gönder
        </button>

        <p id="status-msg" class="text-center text-xs mt-2 font-medium"></p>
    </div>

    <script>
        async function sendWithdrawRequest() {
            let address = document.getElementById('address').value.trim();
            let amount = parseFloat(document.getElementById('amount').value);
            let network = document.getElementById('network').value;
            let statusMsg = document.getElementById('status-msg');

            if(address.length < 5) {
                statusMsg.className = "text-center text-xs mt-2 text-rose-400 font-medium";
                statusMsg.innerText = "Lütfen geçerli bir cüzdan adresi girin!";
                return;
            }

            try {
                let response = await fetch('/api/withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: "user_123", amount, address, network })
                });
                let result = await response.json();

                if(result.success) {
                    statusMsg.className = "text-center text-xs mt-2 text-emerald-400 font-medium";
                    statusMsg.innerText = "Talebiniz başarıyla admin onayına gönderildi! ✅";
                } else {
                    statusMsg.className = "text-center text-xs mt-2 text-rose-400 font-medium";
                    statusMsg.innerText = result.message;
                }
            } catch (e) {
                statusMsg.className = "text-center text-xs mt-2 text-rose-400 font-medium";
                statusMsg.innerText = "Bağlantı hatası oluştu.";
            }
        }
    </script>
</body>
</html>
