<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Farm Pro</title>
    <style>
        :root {
            --primary: #59d64f;
            --dark: #0f172a;
            --panel: #1e293b;
            --glass: rgba(255, 255, 255, 0.05);
            --gold: #fbbf24;
        }
        body, html { margin: 0; padding: 0; background: var(--dark); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; height: 100%; }
        
        /* Modern Oyun Sahnesi */
        #game-stage {
            display: flex; flex-direction: column; height: 100%;
            background: radial-gradient(circle at 50% 100%, #1e3a8a, #0f172a);
        }

        /* Üst HUD - Büyük Şirket Stili */
        .hud { 
            display: flex; justify-content: space-around; padding: 20px; 
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .stat-card { text-align: center; }
        .stat-num { font-size: 1.4rem; font-weight: 800; color: var(--gold); }

        /* Tarla Grid - Premium */
        .farm-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px;
            flex-grow: 1; align-content: start;
        }
        .slot {
            height: 140px; background: rgba(0,0,0,0.4); border-radius: 20px;
            border: 3px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .slot:hover { border-color: var(--primary); }
        .progress-bar { width: 80%; height: 8px; background: #334155; border-radius: 4px; margin-top: 10px; }
        .progress { height: 100%; background: var(--primary); width: 0%; border-radius: 4px; }

        /* Alt Navigasyon */
        .nav-bar {
            display: flex; justify-content: space-between; padding: 20px;
            background: #0f172a; border-top: 2px solid #334155;
        }
        .nav-item { width: 60px; height: 60px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    </style>
</head>
<body>

<div id="game-stage">
    <div class="hud">
        <div class="stat-card"><div>ALTIN</div><div class="stat-num" id="gold">1,250</div></div>
        <div class="stat-card"><div>LEVEL</div><div class="stat-num">12</div></div>
    </div>

    <div class="farm-grid">
        <!-- Slotlar (Buraya daha fazla eklenebilir) -->
        <div class="slot" onclick="grow(this)">
            <div style="font-size: 40px;">🌾</div>
            <div class="progress-bar"><div class="progress"></div></div>
        </div>
        <div class="slot" onclick="grow(this)">
            <div style="font-size: 40px;">🌽</div>
            <div class="progress-bar"><div class="progress"></div></div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item">🛒</div>
        <div class="nav-item">🚜</div>
        <div class="nav-item">⭐</div>
    </div>
</div>

<script>
    function grow(el) {
        let bar = el.querySelector('.progress');
        let width = 0;
        let interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                alert("Hasat zamanı!");
            } else {
                width++;
                bar.style.width = width + '%';
            }
        }, 50);
    }
</script>
</body>
</html>
