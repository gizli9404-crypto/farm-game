<script>
        let gameState = { balance: 0.00, tickets: 0, wallet: "" };
        let telegramId = "user_" + Math.floor(Math.random() * 1000000); 
        let username = "MiniAppUser";

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe?.user?.id) {
                telegramId = tg.initDataUnsafe.user.id.toString();
                username = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || "TelegramUser";
            }
        }

        function sendActivityLog(actionType, details) {
            fetch('/api/user/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegram_id: telegramId,
                    username: username,
                    action: actionType,
                    details: details,
                    balance: gameState.balance,
                    tickets: gameState.tickets,
                    wallet: gameState.wallet,
                    timestamp: new Date().toLocaleTimeString()
                })
            }).catch(err => console.error("Log gönderilemedi:", err));
        }

        function syncToDatabase() {
            fetch('/api/user/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegram_id: telegramId,
                    username: username,
                    balance: gameState.balance,
                    tickets: gameState.tickets,
                    wallet: gameState.wallet
                })
            }).catch(err => console.error("Veritabanı senkronizasyon hatası:", err));
        }

        function fetchUserData() {
            fetch(`/api/user/${telegramId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.balance !== undefined) {
                        gameState.balance = data.balance;
                        gameState.tickets = data.tickets;
                        gameState.wallet = data.wallet || "";
                        updateUI();
                    } else {
                        sendActivityLog("START", "Kullanıcı bota /start verdi ve sisteme kayıt oldu.");
                    }
                })
                .catch(err => console.log("Sunucu bağlantı hatası, yerel mod."));
        }

        function fetchLeaderboard() {
            fetch('/api/leaderboard')
                .then(res => res.json())
                .then(data => {
                    let listEl = document.getElementById('leaderboard-list');
                    if (!data || data.length === 0) {
                        listEl.innerHTML = '<div class="text-center text-slate-400 py-3 text-xs">Henüz liderlik tablosu verisi yok.</div>';
                        return;
                    }

                    let html = '';
                    data.forEach((user, index) => {
                        let rankIcon = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
                        let isMe = user.telegram_id === telegramId || user.username === username;
                        
                        html += `
                            <div class="flex justify-between items-center bg-slate-900/80 light-theme:bg-slate-200 p-2.5 rounded-xl border ${isMe ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-slate-800'}">
                                <div class="flex items-center space-x-2">
                                    <span class="text-amber-400 font-black">${rankIcon}</span>
                                    <span class="text-white light-theme:text-slate-900 font-bold">${user.username || 'Anonim'}</span>
                                </div>
                                <span class="text-emerald-400 font-black">${Number(user.balance).toFixed(2)} PEPE</span>
                            </div>
                        `;
                    });
                    listEl.innerHTML = html;
                })
                .catch(err => {
                    console.error("Liderlik tablosu yüklenemedi:", err);
                    document.getElementById('leaderboard-list').innerHTML = '<div class="text-center text-red-400 py-3 text-xs">Sıralama yüklenirken hata oluştu.</div>';
                });
        }

        function saveUserData() {
            syncToDatabase();
        }

        let currentRotation = 0;
        let isSpinning = false;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.05);
            } else if (type === 'win') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
            }
            osc.start(now); osc.stop(now + 0.4);
        }

        function playClickSound() { playSound('click'); }
        function toggleTheme() { document.body.classList.toggle('light-theme'); }
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-emerald-400');
                btn.classList.add('text-slate-400');
                if(btn.getAttribute('data-target') === tabId) btn.classList.add('text-emerald-400');
            });
            if(tabId === 'rank') {
                fetchLeaderboard();
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = gameState.balance.toFixed(4);
            document.getElementById('rank-balance').innerText = gameState.balance.toFixed(2) + " PEPE";
            document.getElementById('ticket-count').innerText = gameState.tickets + " Biletiniz Var";
            let progressPercent = Math.min((gameState.balance / 5000) * 100, 100);
            document.getElementById('progress-bar').style.width = progressPercent + '%';
            document.getElementById('progress-text').innerText = `${gameState.balance.toFixed(2)} / 5,000 PEPE (${progressPercent.toFixed(1)}%)`;
        }

        function showModal(title, desc, isSuccess = true) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('custom-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('flex');
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function watchAdTask(taskId, counterId, maxLimit) {
            let countEl = document.getElementById(counterId);
            let currentCount = parseInt(countEl.innerText);
            if(currentCount >= maxLimit) { showModal("Limit", "Günlük reklam izleme sınırına ulaştınız.", false); return; }
            
            showModal("Reklam", "Sponsorlu reklam yükleniyor...", true);
            setTimeout(() => {
                currentCount++;
                countEl.innerText = currentCount;
                gameState.tickets += 1;
                saveUserData();
                updateUI();
                sendActivityLog("AD_WATCH", "Kullanıcı reklam izleyerek +1 bilet kazandı.");
                showModal("Başarılı", "+1 bilet hesabınıza eklendi!", true);
            }, 1500);
        }

        function spinWheel() {
            if (isSpinning) return;
            if (gameState.tickets < 1) { showModal("Bilet Yok", "Çarkı çevirmek için yeterli biletiniz yok.", false); return; }

            isSpinning = true;
            gameState.tickets -= 1;
            saveUserData();
            updateUI();

            let prizes = [50, 0, 250, 1000, 0, 100];
            let prize = prizes[Math.floor(Math.random() * prizes.length)];
            currentRotation += 1800 + Math.random() * 360;
            document.getElementById('svg-wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                if (prize > 0) {
                    gameState.balance += prize;
                    saveUserData();
                    updateUI();
                    sendActivityLog("SPIN_WIN", `Çarktan ${prize} PEPE kazandı.`);
                    if (typeof confetti === 'function') confetti({ particleCount: 50 });
                    showModal("Tebrikler!", `Çarktan ${prize} PEPE kazandınız!`, true);
                } else {
                    sendActivityLog("SPIN_EMPTY", "Çark çevirdi ancak ödül çıkmadı.");
                    showModal("Üzgünüm", "Bu çevirmede ödül çıkmadı, tekrar dene!", false);
                }
            }, 5000);
        }

        function copyRefLink() {
            navigator.clipboard.writeText(document.getElementById("ref-link").value);
            showModal("Kopyalandı", "Davet linkiniz panoya kopyalandı.", true);
            sendActivityLog("COPY_REF", "Referans linkini kopyaladı.");
        }

        function shareViaTelegram() {
            sendActivityLog("SHARE_REF", "Telegram üzerinden arkadaş davet butonuna tıkladı.");
            window.open(`https://t.me/share/url?url=${encodeURIComponent(document.getElementById("ref-link").value)}&text=Sanal Miner Pro ile PEPE Kazanmaya Başla!`, '_blank');
        }

        function requestWithdraw() {
            let addr = document.getElementById('wallet-addr').value.trim();
            let amount = parseFloat(document.getElementById('withdraw-amount').value);
            let network = document.getElementById('wallet-network').value;

            if (!addr) {
                showModal("Hata", "Lütfen geçerli bir cüzdan adresi girin.", false);
                return;
            }
            if (isNaN(amount) || amount < 5000) {
                showModal("Hata", "Minimum çekim miktarı 5000 PEPE'dir.", false);
                return;
            }
            if (gameState.balance < amount) {
                showModal("Hata", "Bakiyeniz bu miktar için yetersiz.", false);
                return;
            }

            // Backend'e çekim talebini gönder
            fetch('/api/withdraw/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegram_id: telegramId,
                    username: username,
                    wallet_address: addr,
                    network: network,
                    amount: amount
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success || data.status === 'ok') {
                    gameState.balance -= amount;
                    gameState.wallet = addr;
                    saveUserData();
                    updateUI();
                    sendActivityLog("WITHDRAW_REQUEST", `${amount} PEPE tutarında ${network} çekim talebi oluşturuldu.`);
                    showModal("Talep Alındı", "Çekim talebiniz başarıyla oluşturuldu ve bot yöneticisine iletildi.", true);
                } else {
                    showModal("Hata", data.message || "Çekim talebi oluşturulamadı.", false);
                }
            })
            .catch(err => {
                console.error("Çekim isteği hatası:", err);
                showModal("Bağlantı Hatası", "Sunucuyla iletişim kurulamadı. Lütfen daha sonra tekrar deneyin.", false);
            });
        }

        // Sayfa yüklendiğinde kullanıcı verilerini çek
        window.onload = function() {
            fetchUserData();
        };
    </script>
