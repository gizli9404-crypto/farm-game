<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Farm Adventure</title>
    <meta name="referrer" content="no-referrer-when-downgrade">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #121814; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .farm-card { background: #1a2620; border: 1px solid #2d4a38; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

    <!-- ÜST BİLGİ (Skor / Altın) -->
    <header class="flex justify-between items-center farm-card p-4 rounded-2xl shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-amber-500/20 text-amber-400 rounded-xl flex items-center justify-center text-lg">
                <i class="fa-solid fa-wheat-awn"></i>
            </div>
            <div>
                <h1 class="text-xs text-slate-400 font-medium">Çiftlik Altını</h1>
                <span id="gold-count" class="text-lg font-black text-amber-400">250</span>
            </div>
        </div>
        <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-xl text-xs font-bold border border-emerald-500/20">
            Seviye 1 Çiftçi
        </div>
    </header>

    <!-- ANA OYUN ALANI (Çiftlik) -->
    <main class="my-auto space-y-4 text-center">
        <div class="farm-card p-6 rounded-3xl border-2 border-emerald-500/20 shadow-xl space-y-4">
            <div class="w-20 h-20 bg-emerald-500/10 text-emerald-400 rounded-3xl flex items-center justify-center mx-auto text-3xl shadow-inner">
                <i class="fa-solid fa-carrot animate-bounce"></i>
            </div>
            <div>
                <h2 class="text-base font-bold text-white">Bahçe Tarlası</h2>
                <p class="text-xs text-slate-400 mt-1">Havuçların büyüdü! Toplayarak altın kazanabilirsin.</p>
            </div>
            <button onclick="harvestCrop()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-hand-holding-seedling"></i>
                <span>MAHSULÜ TOPLA (+25 ALTIN)</span>
            </button>
        </div>

        <!-- REKLAM İLE ALTIN KAZANMA BÖLÜMÜ -->
        <div class="farm-card p-5 rounded-2xl text-center space-y-3">
            <div class="flex items-center space-x-3 text-left">
                <div class="w-10 h-10 bg-sky-500/10 text-sky-400 rounded-xl flex items-center justify-center flex-shrink-0 text-base">
                    <i class="fa-solid fa-gift"></i>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-white">Ödüllü Sulama / Gübre</h3>
                    <p class="text-[11px] text-slate-400">Kısa bir reklam izleyerek anında 100 altın kazan!</p>
                </div>
            </div>
            
            <button id="ads-btn" onclick="initAdsgram()" class="w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-sky-600/20 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-play"></i>
                <span id="btn-text">REKLAM İZLE (+100 ALTIN)</span>
            </button>
        </div>
    </main>

    <!-- ALT BİLGİ / TELİF -->
    <footer class="text-center text-[10px] text-slate-500 py-2">
        Tiny Farm Adventure v1.0 - Eğlence Amaçlı Simülasyon
    </footer>

    <script>
        let currentGold = 250;

        function harvestCrop() {
            currentGold += 25;
            document.getElementById('gold-count').innerText = currentGold;
            
            // Telegram haptic feedback (varsa titreşim efekti)
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
        }

        // Adsgram Entegrasyonu (Buraya onay aldıktan sonra gerçek Block ID gelecek)
        // Test aşamasında sistemin çalışıp çalışmadığını görmek için test ID kullanılabilir
        const AdController = window.Adsgram?.init({ blockId: "40974" });

        async function initAdsgram() {
            const btn = document.getElementById('ads-btn');
            const btnText = document.getElementById('btn-text');

            if (!AdController) {
                alert("Reklam yüklenemiyor.");
                return;
            }

            btn.disabled = true;
            btnText.innerText = "YÜKLENİYOR...";

            AdController.show()
                .then((result) => {
                    if (result.done) {
                        currentGold += 100;
                        document.getElementById('gold-count').innerText = currentGold;
                        alert("Tebrikler! Gübre desteği alındı ve +100 altın eklendi.");
                    }
                })
                .catch((err) => {
                    console.error("Reklam hatası:", err);
                    alert("Reklam gösterilemedi veya yarıda kesildi.");
                })
                .finally(() => {
                    btn.disabled = false;
                    btnText.innerHTML = '<i class="fa-solid fa-play"></i> <span id="btn-text">REKLAM İZLE (+100 ALTIN)</span>';
                });
        }
    </script>
</body>
</html>
