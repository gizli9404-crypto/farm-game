<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Çiftlik Oyunu</title>
    <style>
        body {
            background-color: #1a202c;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2d3748;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stats {
            font-size: 18px;
            margin-bottom: 20px;
            background: #1a202c;
            padding: 10px;
            border-radius: 8px;
        }
        .field {
            font-size: 20px;
            margin: 20px 0;
            padding: 20px;
            background: #4a5568;
            border-radius: 8px;
            border: 2px dashed #48bb78;
        }
        button {
            background-color: #48bb78;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #38a169;
        }
        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .log {
            margin-top: 15px;
            font-size: 14px;
            color: #cbd5e0;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌾 Mini Çiftlik Simülasyonu</h2>
        
        <div class="stats">
            💰 Altın: <span id="altin">1000</span><br>
            📦 Depo: <span id="depo">0</span> Ürün
        </div>

        <div class="field" id="tarlaAlani">
            🌱 Tarla: Boş Toprak
        </div>

        <button id="ekimBtn" onclick="tohumEk()">Tohum Ek (3 Sn)</button>
        <button id="hasatBtn" onclick="hasatEt()" disabled>Hasat Et</button>
        <button id="satisBtn" onclick="pazardaSat()">Pazarda Sat (+100 Altın)</button>

        <div class="log" id="mesaj">Hadi çiftliğe başla! Tarlaya tohum ekerek başla.</div>
    </div>

    <script>
        let altin = 1000;
        let depo = 0;
        let tarlaDurumu = "bos"; // bos, buyuyor, hazir

        function guncelle() {
            document.getElementById("altin").innerText = altin;
            document.getElementById("depo").innerText = depo;
        }

        function mesajYaz(txt) {
            document.getElementById("mesaj").innerText = txt;
        }

        function tohumEk() {
            if (tarlaDurumu !== "bos") return;

            tarlaDurumu = "buyuyor";
            document.getElementById("tarlaAlani").innerText = "🌱 Tarla: Bitki Büyüyor...";
            document.getElementById("ekimBtn").disabled = true;
            mesajYaz("Tohum ekildi, bitkinin büyümesi bekleniyor...");

            // 3 saniye sonra büyüme tamamlanır
            setTimeout(() => {
                tarlaDurumu = "hazir";
                document.getElementById("tarlaAlani").innerText = "🌽 Tarla: Hasat Zamanı!";
                mesajYaz("Ürün olgunlaştı! Şimdi hasat edebilirsin.");
                document.getElementById("hasatBtn").disabled = false;
            }, 3000);
        }

        function hasatEt() {
            if (tarlaDurumu !== "hazir") return;

            depo += 1;
            tarlaDurumu = "bos";
            document.getElementById("tarlaAlani").innerText = "🌱 Tarla: Boş Toprak";
            document.getElementById("hasatBtn").disabled = true;
            document.getElementById("ekimBtn").disabled = false;
            
            mesajYaz("Ürün başarıyla hasat edildi ve depoya eklendi!");
            guncelle();
        }

        function pazardaSat() {
            if (depo <= 0) {
                mesajYaz("⚠ Pazarda satacak ürünün yok!");
                return;
            }

            let kazanc = depo * 100;
            altin += kazanc;
            mesajYaz(`🎉 ${depo} ürün satıldı, +${kazanc} altın kazandın!`);
            depo = 0;
            guncelle();
        }
    </script>

</body>
</html>
