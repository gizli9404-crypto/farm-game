<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Miner Pro App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h0 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #38bdf8;
        }
        .balance-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .balance-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            color: #4ade80;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 15px;
            background: #334155;
            padding: 10px 15px;
            border-radius: 8px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-green {
            background: #22c55e;
            color: white;
        }
        .btn-green:hover {
            background: #16a34a;
        }
        .btn-blue {
            background: #0ea5e9;
            color: white;
        }
        .btn-blue:hover {
            background: #0284c7;
        }
        .sync-status {
            font-size: 12px;
            color: #64748b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⛏️ Sanal Miner Pro</h2>
        <p id="user-welcome" style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">Yükleniyor...</p>

        <div class="balance-card">
            <div class="balance-title">TOPLAM BAKİYENİZ</div>
            <div class="balance-amount"><span id="balance-val">750.0000</span> PEPE</div>
        </div>

        <div class="info-row">
            <span>Biletiniz:</span>
            <strong><span id="tickets-val">11</span> Bilet</strong>
        </div>

        <button class="btn btn-green" onclick="watchAd()">📺 Reklam İzle & Bilet Kazan</button>
        <button class="btn btn-blue" onclick="spinWheel()">🎡 Çarkı Çevir (1 Bilet Harca)</button>
        
        <div class="sync-status" id="sync-status">Veritabanı senkronize ediliyor...</div>
    </div>

    <script>
        // Telegram WebApp Başlatma
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Kullanıcı Verileri
        let userId = 8256539395; // Varsayılan test ID
        let username = "EnginGüven";
        let balance = 750.0;
        let tickets = 11;
        let userWallet = "Yok";

        // Telegram'dan gerçek kullanıcıyı çek
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
            username = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
            document.getElementById('user-welcome').innerText = `Hoş geldin, ${tg.initDataUnsafe.user.first_name}!`;
        }

        // Ekranı Güncelle
        function updateUI() {
            document.getElementById('balance-val').innerText = balance.toFixed(4);
            document.getElementById('tickets-val').innerText = tickets;
        }

        // Merkezi Veritabanı ile Senkronizasyon (Anlık Kayıt)
        function syncToDatabase() {
            fetch('/api/user/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegram_id: userId,
                    username: username,
                    balance: balance,
                    tickets: tickets,
                    wallet: userWallet
                })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('sync-status').innerText = "🟢 Veriler Canlı Senkronize Edildi";
            })
            .catch(err => {
                document.getElementById('sync-status').innerText = "🔴 Senkronizasyon Hatası!";
                console.error("Hata:", err);
            });
        }

        // Reklam İzleme Simülasyonu
        function watchAd() {
            tickets += 1;
            balance += 0.5;
            updateUI();
            syncToDatabase();
            alert("Tebrikler! Reklam izlendi, 1 bilet ve 0.5 PEPE kazandınız.");
        }

        // Çark Çevirme Simülasyonu
        function spinWheel() {
            if (tickets <= 0) {
                alert("Yetersiz bilet! Reklam izleyerek bilet kazanabilirsin.");
                return;
            }
            tickets -= 1;
            balance += 10; // Çarktan 10 Pepe kazandığını varsayalım
            updateUI();
            syncToDatabase();
            alert("Çark çevrildi! 10 PEPE kazandınız.");
        }

        // Sayfa açıldığında sunucudan verileri çek
        function fetchUserData() {
            fetch(`/api/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    if(data.balance !== undefined) {
                        balance = data.balance;
                        tickets = data.tickets;
                        userWallet = data.wallet || "Yok";
                        updateUI();
                    }
                });
        }

        // Başlangıçta verileri çek ve her 3 saniyede bir veritabanına otomatik kaydet
        fetchUserData();
        setInterval(syncToDatabase, 3000);
    </script>
</body>
</html>
