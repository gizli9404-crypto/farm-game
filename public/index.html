<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Farm - NextGen Farming</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.js"></script>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: #141c33;
            --accent-green: #22c55e;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }
        #notification-toast {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 700;
            display: none;
            z-index: 1000;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
            white-space: nowrap;
        }
        /* Üst Dashboard */
        .dashboard {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-val {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 2px;
        }
        .stat-val.gold { color: var(--accent-gold); }

        /* Ana Tarla Alanı */
        .farm-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .farm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .seed-selector {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-gold);
            cursor: pointer;
        }

        /* 3D Görünümlü Grid Tarlalar */
        .plots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .plot-card {
            background: #1a233d;
            border: 2px solid #2a375e;
            border-radius: 16px;
            padding: 14px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .plot-card:hover {
            border-color: var(--accent-green);
        }
        .plot-card.ready {
            border-color: var(--accent-green);
            background: linear-gradient(135deg, rgba(34,197,94,0.1), #1a233d);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 5px rgba(34, 197, 94, 0.2); }
            to { box-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }
        }

        .plot-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }
        .plot-text {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Şık İlerleme Çubuğu */
        .growth-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        .growth-bar-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Butonlar */
        .btn-action {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: transform 0.1s;
        }
        .btn-action:active { transform: scale(0.96); }

        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
        }

        /* Alt Sekmeler / Mağaza ve Reklam */
        .bottom-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 12px;
        }
        .footer-credit {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div id="notification-toast">Bildiri</div>

        <!-- Üst Bilgi Göstergesi -->
        <div class="dashboard">
            <div class="stat-box">
                <span>Cüzdan</span>
                <div class="stat-val gold" id="gold-val">750 🪙</div>
            </div>
            <div class="stat-box">
                <span>Ambar Depo</span>
                <div class="stat-val" id="inv-val">0 / 20</div>
            </div>
            <div class="stat-box">
                <span>Çiftlik Seviyesi</span>
                <div class="stat-val" id="lvl-val">LVL 1 ⭐</div>
            </div>
        </div>

        <!-- Ana Tarla Yönetim Paneli -->
        <div class="farm-container">
            <div class="farm-header">
                <span style="font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--text-muted);">🌾 Ana Tarım Arazisi</span>
                <div class="seed-selector" onclick="cycleSeed()">Tohum: <span id="current-seed-name">Buğday</span></div>
            </div>
            <div class="plots-grid" id="plots-grid"></div>
        </div>

        <!-- Bonus & Reklam Kazanç Paneli -->
        <div class="bottom-panel">
            <span style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted);">📺 Sponsorlu Yatırımlar</span>
            <div class="panel-row">
                <div>
                    <div style="font-weight: 700; font-size: 12px;">Ödüllü Tarım Kredisi</div>
                    <div style="font-size: 10px; color: var(--text-muted);">Reklam izle, anında +300 Altın al</div>
                </div>
                <button class="btn-action btn-gold" style="width: auto; padding: 6px 12px;" onclick="watchRewardAd()">İzle</button>
            </div>
        </div>

        <div class="footer-credit">Stellar Farm Engine v4.2 - Immersive Edition</div>
    </div>

    <script>
        let gold = 750;
        let inventory = 0;
        let maxInventory = 20;
        let level = 1;

        // Tohum türleri
        let seeds = [
            { name: 'Buğday', cost: 10, reward: 25, time: 4, icon: '🌾' },
            { name: 'Mısır', cost: 25, reward: 60, time: 7, icon: '🌽' },
            { name: 'Çilek', cost: 50, reward: 130, time: 10, icon: '🍓' }
        ];
        let currentSeedIdx = 0;

        // 4 Başlangıç Tarlası
        let plots = [
            { id: 0, status: 'empty', progress: 0, seed: null, timer: null },
            { id: 1, status: 'empty', progress: 0, seed: null, timer: null },
            { id: 2, status: 'locked', progress: 0, seed: null, timer: null },
            { id: 3, status: 'locked', progress: 0, seed: null, timer: null }
        ];

        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "40974" }) : null;

        function showToast(msg) {
            const t = document.getElementById('notification-toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2400);
        }

        function updateUI() {
            document.getElementById('gold-val').innerText = gold + " 🪙";
            document.getElementById('inv-val').innerText = inventory + " / " + maxInventory;
            document.getElementById('lvl-val').innerText = "LVL " + level + " ⭐";
            document.getElementById('current-seed-name').innerText = seeds[currentSeedIdx].name;
            renderPlots();
        }

        function cycleSeed() {
            currentSeedIdx = (currentSeedIdx + 1) % seeds.length;
            showToast(`Seçilen Tohum: ${seeds[currentSeedIdx].name}`);
            updateUI();
        }

        function renderPlots() {
            const grid = document.getElementById('plots-grid');
            grid.innerHTML = '';
            plots.forEach((p, idx) => {
                let card = document.createElement('div');
                card.className = 'plot-card';

                if (p.status === 'locked') {
                    card.innerHTML = `
                        <div class="plot-icon">🔒</div>
                        <div class="plot-text">Kilitli Toprak</div>
                        <button class="btn-action btn-gold" style="margin-top:6px; font-size:10px; padding:5px;" onclick="unlockPlot(${idx})">200 🪙 Aç</button>
                    `;
                } else if (p.status === 'empty') {
                    let s = seeds[currentSeedIdx];
                    card.innerHTML = `
                        <div class="plot-icon">🟫</div>
                        <div class="plot-text">Boş Toprak</div>
                        <button class="btn-action" style="margin-top:6px; font-size:10px; padding:5px;" onclick="plantPlot(${idx})">Ekir (-${s.cost}🪙)</button>
                    `;
                } else if (p.status === 'growing') {
                    card.innerHTML = `
                        <div class="plot-icon">🌱</div>
                        <div class="plot-text" style="color:var(--accent-gold)">Büyüyor...</div>
                        <div class="growth-bar-bg"><div class="growth-bar-fill" style="width: ${p.progress}%"></div></div>
                    `;
                } else if (p.status === 'ready') {
                    card.className += ' ready';
                    card.innerHTML = `
                        <div class="plot-icon">${p.seed.icon}</div>
                        <div class="plot-text" style="color:var(--accent-green)">HASADA HAZIR!</div>
                        <button class="btn-action" style="margin-top:6px; font-size:10px; padding:5px;" onclick="harvestPlot(${idx})">Hasat Et (+${p.seed.reward}🪙)</button>
                    `;
                }
                grid.appendChild(card);
            });
        }

        function unlockPlot(idx) {
            if (gold >= 200) {
                gold -= 200;
                plots[idx].status = 'empty';
                showToast("Harika! Yeni arazi ekime hazır. 🌿");
                updateUI();
            } else {
                showToast("Yeterli altının yok! (200 🪙)");
            }
        }

        function plantPlot(idx) {
            let s = seeds[currentSeedIdx];
            if (gold < s.cost) {
                showToast("Bu tohum için altının yetersiz!");
                return;
            }
            gold -= s.cost;
            plots[idx].status = 'growing';
            plots[idx].seed = s;
            plots[idx].progress = 0;
            updateUI();

            let speedStep = 100 / (s.time * 10); // saniyede 10 adım
            plots[idx].timer = setInterval(() => {
                plots[idx].progress += speedStep;
                if (plots[idx].progress >= 100) {
                    plots[idx].progress = 100;
                    plots[idx].status = 'ready';
                    clearInterval(plots[idx].timer);
                }
                renderPlots();
            }, 100);
        }

        function harvestPlot(idx) {
            let s = plots[idx].seed;
            gold += s.reward;
            inventory = Math.min(maxInventory, inventory + 1);
            level++;
            showToast(`+${s.reward} Altın kazandın! 🎉`);
            plots[idx].status = 'empty';
            plots[idx].seed = null;
            updateUI();
        }

        function watchRewardAd() {
            if (AdController) {
                AdController.show().then(() => {
                    gold += 300;
                    showToast("Sponsor Ödülü Yüklendi: +300 🪙");
                    updateUI();
                }).catch(() => { showToast("Reklam yüklenemedi."); });
            } else {
                gold += 300;
                showToast("Test Modu: +300 Altın hesabına eklendi! 🪙");
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
