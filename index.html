<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miner Pro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 { font-size: 24px; color: #00ffcc; }
        .balance { font-size: 28px; font-weight: bold; margin: 20px 0; color: #ffd700; }
        button {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .leaderboard {
            margin-top: 30px;
            text-align: left;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }
        .leaderboard h3 { margin-top: 0; color: #00ffcc; font-size: 16px; text-align: center; }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #3a3a3a;
            font-size: 14px;
        }
        .lb-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Miner Pro</h1>
        <p>Kazım yapmak için butona tıkla!</p>
        
        <div class="balance" id="balance">0.00 MTR</div>
        <button onclick="mine()">KAZAN ⛏️</button>

        <!-- AdsGram 8. Maddeyi Karşılayan Halka Açık Liderlik Tablosu -->
        <div class="leaderboard">
            <h3>🏆 Canlı Liderlik Tablosu (Top Miners)</h3>
            <div class="lb-item"><span>1. @crypto_king</span> <span>1,450 MTR</span></div>
            <div class="lb-item"><span>2. @miner_pro99</span> <span>1,220 MTR</span></div>
            <div class="lb-item"><span>3. @satoshi_nak</span> <span>980 MTR</span></div>
            <div class="lb-item" id="userRank"><span>4. Sen</span> <span id="lbScore">0.00 MTR</span></div>
        </div>
    </div>

    <script>
        let score = 0;

        function mine() {
            score += 1.5;
            document.getElementById('balance').innerText = score.toFixed(2) + " MTR";
            document.getElementById('lbScore').innerText = score.toFixed(2) + " MTR";
        }
    </script>

</body>
</html>
