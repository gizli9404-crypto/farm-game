<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanal Miner Pro - Şans Çarkı</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--tg-theme-bg-color, #0b0e14);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 10px;
        }
        .header h1 {
            font-size: 18px;
            color: var(--tg-theme-accent-text-color, #00b09b);
            margin-bottom: 5px;
        }
        .balance {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #a4b0be);
        }
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            transition: transform 4s cubic-bezier(0.15, 0.75, 0.10, 1);
        }
        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 22px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }
        .actions {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: #ffffff;
            background: var(--tg-theme-button-color, #00b09b);
            color: var(--tg-theme-button-text-color, #ffffff);
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            background: #4b6584;
            cursor: not-allowed;
            box-shadow: none;
        }
        .result-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(15, 19, 26, 0.95);
            border: 2px solid #00b09b;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .result-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .result-popup h2 {
            font-size: 20px;
            color: #2ed573;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎡 Şans Çarkı</h1>
        <div class="balance">Bakiye: <span id="balance">100.0</span> PTS</div>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
        <div id="popup" class="result-popup">
            <h2 id="winText">Tebrikler!</h2>
            <p id="winAmount">+50 PTS Kazandın</p>
        </div>
    </div>

    <div class="actions">
        <button id="spinBtn" class="btn" onclick="spinWheel()">Çarkı Çevir</button>
    </div>

    <script>
        // Telegram WebApp başlatma
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const balanceEl = document.getElementById("balance");
        const spinBtn = document.getElementById("spinBtn");
        const popup = document.getElementById("popup");
        const winText = document.getElementById("winText");
        const winAmount = document.getElementById("winAmount");

        let balance = 100.0;
        let spinning = false;
        let currentRotation = 0;

        // Çark dilimleri
        const sectors = [
            { color: "#ff4757", text: "10 PTS", value: 10 },
            { color: "#2ed573", text: "50 PTS", value: 50 },
            { color: "#ffa502", text: "100 PTS", value: 100 },
            { color: "#3742fa", text: "250 PTS", value: 250 },
            { color: "#ff6b81", text: "500 PTS", value: 500 },
            { color: "#70a1ff", text: "1000 PTS", value: 1000 }
        ];

        const arc = Math.PI / (sectors.length / 2);

        function drawSector(sector, i) {
            const angle = i * arc;
            ctx.save();
            ctx.beginPath();
            ctx.arc(250, 250, 250, angle, angle + arc, false);
            ctx.lineTo(250, 250);
            ctx.fillStyle = sector.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#0b0e14";
            ctx.stroke();

            ctx.translate(250, 250);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 26px sans-serif";
            ctx.fillText(sector.text, 220, 10);
            ctx.restore();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, 500, 500);
            for (let i = 0; i < sectors.length; i++) {
                drawSector(sectors[i], i);
            }
        }

        function spinWheel() {
            if (spinning) return;
            spinning = true;
            spinBtn.disabled = true;
            popup.classList.remove("show");

            const randomIndex = Math.floor(Math.random() * sectors.length);
            const degreesPerSector = 360 / sectors.length;
            const extraTurns = 360 * 5;
            
            const targetDegree = extraTurns + (360 - (randomIndex * degreesPerSector)) - (degreesPerSector / 2);
            currentRotation += targetDegree;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                spinning = false;
                spinBtn.disabled = false;

                const won = sectors[randomIndex];
                balance += won.value;
                balanceEl.innerText = balance.toFixed(1);

                // Telegram Haptic Feedback (Telefonu hafifçe titreştirir)
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                winAmount.innerText = `+${won.value} PTS Kazandın!`;
                popup.classList.add("show");

                setTimeout(() => {
                    popup.classList.remove("show");
                }, 2000);

            }, 4000);
        }

        drawWheel();
    </script>
</body>
</html>
