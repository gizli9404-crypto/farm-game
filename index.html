<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanal Miner</title>
    <style>
        /* Örnek sayfa tasarımı (Kendi stillerinle uyumlu olması için temel yapılar) */
        body {
            background-color: #0f0f1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        /* Test Butonu */
        .test-btn {
            background: linear-gradient(135deg, #4e54c8, #8f94fb);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.4);
        }

        .test-btn:active {
            transform: scale(0.95);
        }

        /* ========================================== */
        /* ÖZEL UYARI (MODAL) STİLLERİ                */
        /* ========================================== */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            backdrop-filter: blur(4px);
        }

        .custom-modal-content {
            background: #1a1a2e;
            border: 1px solid #4e54c8;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            animation: modalScaleUp 0.2s ease-in-out;
        }

        .custom-modal-body {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .custom-modal-btn {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .custom-modal-btn:active {
            opacity: 0.8;
        }

        @keyframes modalScaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sanal Miner Web App</h2>
        <!-- Test amaçlı buton (Mevcut bakiye kontrolüne bağlayabilirsin) -->
        <button class="test-btn" onclick=" satinAlTiklandi() ">Satın Al (Test Et)</button>
    </div>

    <!-- ========================================== -->
    /* ÖZEL UYARI HTML İSKELETİ                   */
    /* ========================================== -->
    <div id="customAlertModal" class="custom-modal-overlay" style="display: none;">
        <div class="custom-modal-content">
            <div class="custom-modal-body" id="customAlertMessage">Yetersiz bakiye! Reklam izleyerek ve görevleri yaparak PTS toplamalısın.</div>
            <button id="customAlertBtn" class="custom-modal-btn">Tamam</button>
        </div>
    </div>

    <script>
        /* ========================================== */
        /* ÖZEL UYARI JAVASCRIPT FONKSİYONLARI        */
        /* ========================================== */
        
        // Uyarıyı ekrana getiren ana fonksiyon
        function showCustomAlert(message) {
            const modal = document.getElementById('customAlertModal');
            const messageEl = document.getElementById('customAlertMessage');
            
            messageEl.innerText = message;
            modal.style.display = 'flex';
        }

        // "Tamam" butonuna basıldığında modalı gizleyen olay dinleyicisi
        document.getElementById('customAlertBtn').addEventListener('click', function() {
            document.getElementById('customAlertModal').style.display = 'none';
        });

        // Satın alma veya bakiye kontrolü yaptığın yerde eski alert() yerine bunu çağıracaksın:
        function satinAlTiklandi() {
            let bakiyeYetersizMi = true; // Örnek kontrol

            if (bakiyeYetersizMi) {
                // Eskisi: alert("Yetersiz bakiye!..."); yerine:
                showCustomAlert("Yetersiz bakiye! Reklam izleyerek ve görevleri yaparak PTS toplamalısın.");
            }
        }
    </script>
</body>
</html>
