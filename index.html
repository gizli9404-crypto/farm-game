<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoTap Pro - Mining Bot</title>
    <style>
        :root {
            --bg-dark: #0f1219;
            --card-bg: #181d28;
            --accent: #f3ba2f;
            --accent-glow: rgba(243, 186, 47, 0.3);
            --text-main: #ffffff;
            --text-muted: #8c96a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 850px;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: relative;
        }

        /* Üst Bilgi / Profil */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-info h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .profile-info span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .ad-badge {
            background: rgba(243, 186, 47, 0.1);
            color: var(--accent);
            border: 1px solid rgba(243, 186, 47, 0.3);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Skor Göstergesi */
        .score-section {
            text-align: center;
            margin: 10px 0;
        }

        .coin-icon {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .score-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Tıklama Alanı (Ana Maden Taşı) */
        .tap-area-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-grow: 1;
        }

        .tap-coin {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #252c3d 0%, #181d28 100%);
            border: 4px solid var(--accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 30px var(--accent-glow);
            transition: transform 0.05s ease;
            position: relative;
        }

        .tap-coin:active {
            transform: scale(0.93);
        }

        .tap-coin span {
            font-size: 50px;
        }

        /* Enerji Barı */
        .energy-section {
            margin-bottom: 15px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .energy-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.2s;
        }

        /* Alt Menü Barı */
        .nav-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: var(--card-bg);
            border-radius: 14px;
            padding: 8px;
            gap: 5px;
        }

        .nav-item {
            text-align: center;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .nav-item.active, .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
        }

        .nav-item div {
            font-size: 16px;
            margin-bottom: 2px;
        }

        /* Uçan Puan Animasyonu */
        .floating-number {
            position: absolute;
            color: var(--accent);
            font-weight: bold;
            font-size: 20px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <!-- Header -->
        <div class="header">
            <div class="profile-info">
                <h3>Madenci #8912</h3>
                <span>Lig: Bronz 🥉</span>
            </div>
            <!-- Senin reklamdan para kazanacağın ana buton -->
            <div class="ad-badge" onclick="watchAdReward()">📺 2x Kazan (Reklam)</div>
        </div>

        <!-- Skor -->
        <div class="score-section">
            <div class="score-title">Toplam Kazanç</div>
            <div class="score-value" id="score">0.00</div>
        </div>

        <!-- Tıklama Alanı -->
        <div class="tap-area-wrapper" id="tapArea" onclick="tapCoin(event)">
            <div class="tap-coin">
                <span>🪙</span>
            </div>
        </div>

        <!-- Enerji -->
        <div class="energy-section">
            <div class="energy-info">
                <span>Enerji</span>
                <span id="energyText">1000 / 1000</span>
            </div>
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energyFill"></div>
            </div>
        </div>

        <!-- Menü -->
        <div class="nav-menu">
            <div class="nav-item active">
                <div>⛏️</div>Madende
            </div>
            <div class="nav-item" onclick="openBoostMenu()">
                <div>🚀</div>Boost
            </div>
            <div class="nav-item" onclick="openFriendsMenu()">
                <div>👥</div>Arkadaş
            </div>
            <div class="nav-item" onclick="openWalletMenu()">
                <div>💰</div>Cüzdan
            </div>
        </div>
    </div>

    <script>
        let score = 0.00;
        let energy = 1000;
        let maxEnergy = 1000;
        let tapPower = 1;
        let multiplier = 1;

        function tapCoin(event) {
            if (energy >= tapPower) {
                energy -= tapPower;
                score += (tapPower * multiplier);
                
                updateUI();
                showFloatingText(event);
            }
        }

        function showFloatingText(event) {
            const app = document.getElementById('app');
            const el = document.createElement('div');
            el.className = 'floating-number';
            el.innerText = "+" + (tapPower * multiplier);
            
            const rect = app.getBoundingClientRect();
            el.style.left = (event.clientX - rect.left) + 'px';
            el.style.top = (event.clientY - rect.top - 20) + 'px';
            
            app.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function updateUI() {
            document.getElementById('score').innerText = score.toFixed(2);
            document.getElementById('energyText').innerText = `${energy} / ${maxEnergy}`;
            let percentage = (energy / maxEnergy) * 100;
            document.getElementById('energyFill').style.width = percentage + '%';
        }

        // Enerji dolumu (Her saniye)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 5);
                updateUI();
            }
        }, 1000);

        function watchAdReward() {
            // Buraya Adsgram veya Telegram reklam SDK entegrasyonu gelecek.
            // Kullanıcı reklam izlediğinde hem reklam gösterilip sana para kazandıracak 
            // hem de kullanıcıya 30 saniyeliğine 2x kazanç bonusu vereceksin.
            alert("📺 Reklam gösteriliyor... (İzleme bittiğinde sana reklam geliri yazıldı ve 2x aktifleşti!)");
            multiplier = 2;
            setTimeout(() => {
                multiplier = 1;
                alert("⏰ 2x bonus süresi bitti.");
            }, 30000); // 30 saniye 2x
        }

        function openBoostMenu() {
            alert("🚀 Boost Menüsü: Reklam izleyerek enerji sınırını artırabilir veya otomatik kazım botu kiralayabilirsin!");
        }

        function openFriendsMenu() {
            alert("👥 Davet Et Kazan: Arkadaşını getiren herkesten sen de pasif gelir alırsın!");
        }

        function openWalletMenu() {
            alert("💰 Cüzdan: Çekim yapabilmek için günlük görevleri tamamlaman ve reklam izleme sınırını doldurman gerekiyor.");
        }
    </script>
</body>
</html>
