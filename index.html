<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şans Çarkı</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        canvas {
            width: 100%;
            height: 100%;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 25px solid #ff4757;
            z-index: 10;
        }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>
    <button onclick="spinWheel()">Çarkı Çevir</button>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        const sectors = [
            { color: "#1e272e", text: "10 PTS" },
            { color: "#0d5c75", text: "50 PTS" },
            { color: "#8854d0", text: "100 PTS" },
            { color: "#eb3b5a", text: "250 PTS" },
            { color: "#20bf6b", text: "500 PTS" },
            { color: "#f7b731", text: "1000 PTS" }
        ];

        const arc = Math.PI / (sectors.length / 2);
        let startAngle = 0;
        let spinning = false;

        function drawSector(sector, i) {
            const angle = startAngle + i * arc;
            ctx.save();
            ctx.beginPath();
            ctx.arc(250, 250, 250, angle, angle + arc, false);
            ctx.lineTo(250, 250);
            ctx.fillStyle = sector.color;
            ctx.fill();
            ctx.stroke();

            ctx.translate(250, 250);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 24px Arial";
            ctx.fillText(sector.text, 220, 10);
            ctx.restore();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, 500, 500);
            for (let i = 0; i < sectors.length; i++) {
                drawSector(sectors[i], i);
            }
        }

        function spinWheel() {
            if (spinning) return;
            spinning = true;

            // Rastgele dönme miktarı (En az 5 tam tur + rastgele açı)
            const randomDegree = Math.floor(Math.random() * 360) + 1800;
            const targetAngle = canvas.style.transform ? (parseFloat(canvas.style.transform.replace('rotate(', '').replace('deg)', '')) + randomDegree) : randomDegree;

            canvas.style.transform = `rotate(${targetAngle}deg)`;

            setTimeout(() => {
                spinning = false;
                // Burada çevirme bittikten sonra ödül kazandırma mantığını çalıştırabilirsin
            }, 4000);
        }

        drawWheel();
    </script>
</body>
</html>
