<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanal Miner Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background: radial-gradient(circle at top, #1b1b3a, #0b0c10);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(22, 33, 62, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 245, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        h1 { color: #00fff5; font-size: 20px; margin: 0; text-shadow: 0 0 10px rgba(0, 255, 245, 0.6); text-align: left; }
        .sound-toggle { background: rgba(0, 255, 245, 0.1); border: 1px solid rgba(0, 255, 245, 0.3); color: #00fff5; padding: 6px 10px; border-radius: 10px; font-size: 11px; cursor: pointer; }
        
        .rig-icon { font-size: 70px; margin: 10px 0; filter: drop-shadow(0 0 15px rgba(0, 255, 245, 0.6)); animation: pulse 2s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        .stat-box { background: rgba(15, 52, 96, 0.6); padding: 12px; border-radius: 16px; margin: 10px 0; border: 1px solid rgba(255, 255, 255, 0.08); }
        .stat-title { font-size: 11px; color: #8a99ad; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #ff416c; text-shadow: 0 0 10px rgba(255, 65, 108, 0.6); margin-top: 3px; }
        
        .mini-stats { display: flex; gap: 8px; margin-bottom: 10px; }
        .mini-stat-card { flex: 1; background: rgba(15, 52, 96, 0.4); padding: 8px; border-radius: 12px; border: 1px solid rgba(0, 255, 245, 0.1); font-size: 11px; color: #8a99ad; }
        .mini-stat-card b { display: block; color: #00fff5; font-size: 13px; margin-top: 2px; }

        button { background: linear-gradient(135deg, #00fff5, #0088cc); border: none; color: #000; padding: 12px; font-size: 15px; font-weight: 800; border-radius: 16px; cursor: pointer; width: 100%; margin-top: 8px; box-shadow: 0 4px 15px rgba(0,255,245,0.3); transition: 0.1s; }
        button:active { transform: scale(0.97); }
        #mine-btn { background: linear-gradient(135deg, #00fff5, #00b894); font-size: 17px; }
        .ad-btn { background: linear-gradient(135deg, #ff9900, #ff5500); color: #fff; box-shadow: 0 4px 15px rgba(255,153,0,0.3); }

        .section { background: rgba(15, 52, 96, 0.4); padding: 10px 12px; border-radius: 14px; margin-top: 10px; border: 1px solid rgba(0, 255, 245, 0.15); text-align: left; }
        .section h3 { color: #00fff5; font-size: 13px; margin: 0 0 8px 0; text-align: center; }
        
        .form-group { margin-bottom: 8px; }
        .form-label { font-size: 10px; color: #8a99ad; margin-bottom: 2px; display: block; font-weight: 600; }
        select, input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(0, 255, 245, 0.3); background: #0a1128; color: #fff; font-size: 12px; outline: none; }
        
        .float-text { position: absolute; color: #00fff5; font-weight: bold; font-size: 18px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 999; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(1.2); } }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <h1>🚀 SANAL MINER</h1>
        <button class="sound-toggle" id="sound-toggle-btn" onclick="toggleSound()">🔊 Ses: Açık</button>
    </div>
    
    <div class="rig-icon">🖥️</div>
    
    <div class="stat-box">
        <div class="stat-title">Toplam Bakiye</div>
        <div class="stat-value"><span id="balance">0.0000</span> PTS</div>
    </div>

    <!-- Yeni Eklenen Mini İstatistik Kartları -->
    <div class="mini-stats">
        <div class="mini-stat-card">Toplam Tık<b id="total-clicks">0</b></div>
        <div class="mini-stat-card">Pasif Kazanç<b id="passive-display">0.0000/sn</b></div>
    </div>

    <button id="mine-btn" onclick="mine(event)">⛏️ Maden Yap (+<span id="click-power">0.0010</span>)</button>
    <button class="ad-btn" onclick="showAd()">📺 Reklam İzle (Hız +0.5x)</button>
    <div style="font-size: 11px; color: #8a99ad; margin-top: 6px;">Mevcut Hız: <span id="speed" style="color:#00fff5">1.0</span>x</div>

    <!-- EKRAN KARTI MARKETİ -->
    <div class="section">
        <h3>💻 Ekran Kartı Marketi</h3>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 6px;">
            <div><b>GTX 1660</b> (<span id="count-gtx1660">0</span> Adet)<br><small style="color:#00fff5">+0.0005 PTS/sn</small></div>
            <button style="width: auto; padding: 5px 10px; font-size: 11px; margin:0;" onclick="buyGPU('gtx1660', 10, 0.0005)">10 PTS</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px;">
            <div><b>RTX 3060</b> (<span id="count-rtx3060">0</span> Adet)<br><small style="color:#00fff5">+0.0020 PTS/sn</small></div>
            <button style="width: auto; padding: 5px 10px; font-size: 11px; margin:0;" onclick="buyGPU('rtx3060', 35, 0.0020)">35 PTS</button>
        </div>
    </div>

    <!-- GÜNLÜK ÖDÜL -->
    <div class="section">
        <h3>🎁 Günlük Bonus</h3>
        <button style="background: #00b894; color: #fff; padding: 8px; font-size: 12px;" onclick="claimDailyReward()">🎁 24 Saatte Bir 5 PTS Al</button>
    </div>

    <!-- ARKADAŞINI DAVET ET -->
    <div class="section">
        <h3>👥 Arkadaşını Davet Et</h3>
        <p style="font-size: 11px; margin: 0 0 6px 0;">Davet Edilen: <b id="ref-count" style="color:#00fff5">0</b></p>
        <button style="padding: 8px; font-size: 12px;" onclick="shareRefLink()">🔗 Davet Linkini Paylaş</button>
    </div>

    <!-- KRİPTO ÇEKİM TALEBİ -->
    <div class="section">
        <h3>💸 Kripto Çekim Talebi</h3>
        <div style="font-size: 10px; color: #00fff5; margin-bottom: 6px; text-align: center;">10.000 PTS = 1 USDT</div>
        <div class="form-group">
            <label class="form-label">Ağ (Network)</label>
            <select id="wallet-network">
                <option value="TON Network">TON Network</option>
                <option value="TRC20">TRON (TRC20)</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Cüzdan Adresi</label>
            <input type="text" id="wallet-address" placeholder="UQ... veya 0x...">
        </div>
        <div class="form-group">
            <label class="form-label">Miktar (Min: 10.000)</label>
            <input type="number" id="withdraw-amount" placeholder="0">
        </div>
        <button onclick="requestWithdraw()">Onayla ve Gönder</button>
    </div>

    <!-- ADMIN PANELİ -->
    <div class="section" id="admin-panel" style="display:none; border-color:#ff416c;">
        <h3 style="color:#ff416c;">👑 Admin Paneli</h3>
        <button style="background:#00b894; color:#fff; font-size:11px; padding:6px;" onclick="adminAddDirectBalance(10000)">+10 Bin PTS Ekle</button>
    </div>
</div>

<script>
    const ADMIN_ID = "8256539395";

    let balance = parseFloat(localStorage.getItem('miner_balance')) || 0;
    let speed = parseFloat(localStorage.getItem('miner_speed')) || 1.0;
    let passiveRate = parseFloat(localStorage.getItem('miner_passive_rate')) || 0;
    let lastRewardTime = parseInt(localStorage.getItem('last_reward_time')) || 0;
    let refCount = parseInt(localStorage.getItem('miner_ref_count')) || 0;
    let totalClicks = parseInt(localStorage.getItem('miner_total_clicks')) || 0;
    let soundEnabled = localStorage.getItem('miner_sound') !== 'false';
    let gpuCounts = JSON.parse(localStorage.getItem('miner_gpu_counts')) || { gtx1660: 0, rtx3060: 0 };

    // Ses Efekti (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
        if (!soundEnabled || !audioCtx) return;
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        localStorage.setItem('miner_sound', soundEnabled);
        document.getElementById('sound-toggle-btn').innerText = soundEnabled ? "🔊 Ses: Açık" : "muted Ses: Kapalı";
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance.toFixed(4);
        document.getElementById('speed').innerText = speed.toFixed(1);
        document.getElementById('click-power').innerText = (0.0010 * speed).toFixed(4);
        document.getElementById('ref-count').innerText = refCount;
        document.getElementById('total-clicks').innerText = totalClicks;
        document.getElementById('passive-display').innerText = passiveRate.toFixed(4) + '/sn';
        document.getElementById('count-gtx1660').innerText = gpuCounts.gtx1660 || 0;
        document.getElementById('count-rtx3060').innerText = gpuCounts.rtx3060 || 0;
        document.getElementById('sound-toggle-btn').innerText = soundEnabled ? "🔊 Ses: Açık" : "🔇 Ses: Kapalı";
    }

    let lastClickTime = 0;
    function mine(e) {
        const now = Date.now();
        if (now - lastClickTime < 80) return;
        lastClickTime = now;
        
        const gain = 0.0010 * speed;
        balance += gain;
        totalClicks++;
        localStorage.setItem('miner_balance', balance);
        localStorage.setItem('miner_total_clicks', totalClicks);
        updateUI();
        
        playClickSound();
        
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
        createFloatingText(e, `+${gain.toFixed(4)}`);
    }

    function createFloatingText(e, text) {
        const btn = document.getElementById('mine-btn');
        const rect = btn.getBoundingClientRect();
        const floatEl = document.createElement('div');
        floatEl.className = 'float-text'; floatEl.innerText = text;
        floatEl.style.left = `${(e.clientX || rect.left + rect.width / 2) - 20}px`;
        floatEl.style.top = `${(e.clientY || rect.top) - 10}px`;
        document.body.appendChild(floatEl);
        setTimeout(() => floatEl.remove(), 800);
    }

    setInterval(() => {
        if (passiveRate > 0) {
            balance += passiveRate;
            localStorage.setItem('miner_balance', balance);
            updateUI();
        }
    }, 1000);

    function buyGPU(gpuKey, price, rateGain) {
        if (balance >= price) {
            balance -= price;
            passiveRate += rateGain;
            gpuCounts[gpuKey] = (gpuCounts[gpuKey] || 0) + 1;
            localStorage.setItem('miner_balance', balance);
            localStorage.setItem('miner_passive_rate', passiveRate);
            localStorage.setItem('miner_gpu_counts', JSON.stringify(gpuCounts));
            updateUI();
            alert("Satın alım başarılı!");
        } else { alert("Yetersiz bakiye!"); }
    }

    function claimDailyReward() {
        const now = Date.now();
        if (now - lastRewardTime > 24 * 60 * 60 * 1000) {
            balance += 5; lastRewardTime = now;
            localStorage.setItem('miner_balance', balance);
            localStorage.setItem('last_reward_time', lastRewardTime);
            updateUI();
            alert("5 PTS eklendi!");
        } else { alert("Bugünkü ödülü zaten aldın!"); }
    }

    function shareRefLink() {
        let userId = "user123";
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
            userId = window.Telegram.WebApp.initDataUnsafe.user.id;
        }
        const refLink = `https://t.me/sanal_miner_test_bot?start=${userId}`;
        const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent("Sanal Miner'da madencilik yap, kazan! 🚀")}`;
        if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.openTelegramLink(shareUrl);
        else window.open(shareUrl, '_blank');
    }

    function requestWithdraw() {
        const wallet = document.getElementById('wallet-address').value;
        const amount = parseFloat(document.getElementById('withdraw-amount').value);
        if (!wallet || amount < 10000 || amount > balance) { alert("Geçersiz bilgiler veya yetersiz bakiye!"); return; }
        balance -= amount;
        localStorage.setItem('miner_balance', balance);
        updateUI();
        alert("Çekim talebi alındı!");
    }

    function adminAddDirectBalance(amount) {
        balance += amount;
        localStorage.setItem('miner_balance', balance);
        updateUI();
        alert(`+${amount} PTS eklendi!`);
    }

    let AdController = null;
    if (window.Adsgram) { AdController = window.Adsgram.init({ blockId: "42652" }); }
    function showAd() {
        if (!AdController) { alert("Reklam yüklenemedi."); return; }
        AdController.show().then(() => {
            speed += 0.5; localStorage.setItem('miner_speed', speed); updateUI();
            alert("Hızın arttı! 🚀");
        }).catch(e => {});
    }

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        if (window.Telegram.WebApp.initDataUnsafe.user && String(window.Telegram.WebApp.initDataUnsafe.user.id) === ADMIN_ID) {
            document.getElementById('admin-panel').style.display = 'block';
        }
    } else {
        document.getElementById('admin-panel').style.display = 'block';
    }

    updateUI();
</script>

</body>
</html>
