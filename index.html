<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Blade Slice</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #05050a;
            --primary: #f43f5e;
            --primary-glow: rgba(244, 63, 94, 0.4);
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.4);
            --text: #ffffff;
            --text-muted: #94a3b8;
            --card: #0f172a;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at center, #111827 0%, #05050a 100%);
            overflow: hidden;
        }

        /* Üst Bilgi Paneli */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 800;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .lives {
            display: flex;
            gap: 4px;
            font-size: 18px;
        }

        /* Oyun Tuvali */
        canvas {
            flex: 1;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        /* Menü Ekranları (Overlay) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 24px;
        }

        .overlay h1 {
            font-size: 32px;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--primary-glow);
        }

        .overlay p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), #e11d48);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: transform 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

        /* Combo Efekti */
        .combo-popup {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: 900;
            color: #f59e0b;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 15;
        }

        .combo-popup.show {
            opacity: 1;
            transform: translateX(-50%) scale(1.2);
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Üst Bar -->
    <div class="header">
        <div class="stat-box">
            <span class="stat-label">Skor</span>
            <span class="stat-value" id="score-val">0</span>
        </div>
        <div class="stat-box" style="align-items: center;">
            <span class="stat-label">En Yüksek</span>
            <span class="stat-value" id="highscore-val" style="color:var(--primary);">0</span>
        </div>
        <div class="stat-box" style="align-items: flex-end;">
            <span class="stat-label">Can</span>
            <div class="lives" id="lives-container">❤️❤️❤️</div>
        </div>
    </div>

    <!-- Oyun Alanı -->
    <canvas id="gameCanvas"></canvas>

    <!-- Combo Uyarı Alanı -->
    <div class="combo-popup" id="comboPopup">KUSURSUZ KESİŞ!</div>

    <!-- Ana Menü / Başlangıç Ekranı -->
    <div class="overlay" id="startScreen">
        <h1>CYBER BLADE</h1>
        <p>Ekranda parmağını kaydırarak siber nesneleri kes, bombalardan kaç ve yüksek skorları patlat!</p>
        <button class="btn" onclick="startGame()">Oyuna Başla</button>
    </div>

    <!-- Game Over Ekranı -->
    <div class="overlay hidden" id="gameOverScreen">
        <h1>OYUN BİTTİ</h1>
        <p>Toplam Skorun: <span id="finalScore" style="color:var(--accent); font-weight:bold;">0</span></p>
        <button class="btn" onclick="startGame()">Tekrar Dene</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight - document.querySelector('.header').offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let highscore = localStorage.getItem('cb_high') || 0;
    let lives = 3;
    let isPlaying = false;

    document.getElementById('highscore-val').innerText = highscore;

    let objects = [];
    let particles = [];
    let trail = [];

    // Nesne Tipleri (Şekiller, Renkler, Puanlar)
    const itemTypes = [
        { type: 'target', radius: 28, color: '#06b6d4', points: 10, label: '🔷' },
        { type: 'target', radius: 32, color: '#3b82f6', points: 15, label: '💠' },
        { type: 'target', radius: 24, color: '#10b981', points: 20, label: '🟢' },
        { type: 'bonus', radius: 22, color: '#f59e0b', points: 50, label: '⭐' },
        { type: 'bomb', radius: 26, color: '#ef4444', points: 0, label: '💣' }
    ];

    function startGame() {
        score = 0;
        lives = 3;
        objects = [];
        particles = [];
        isPlaying = true;
        document.getElementById('score-val').innerText = score;
        updateLivesUI();
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
    }

    function gameOver() {
        isPlaying = false;
        if (score > highscore) {
            highscore = score;
            localStorage.setItem('cb_high', highscore);
            document.getElementById('highscore-val').innerText = highscore;
        }
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function updateLivesUI() {
        let str = '';
        for (let i = 0; i < lives; i++) str += '❤️';
        document.getElementById('lives-container').innerText = str;
    }

    // Nesne Üretici
    function spawnObject() {
        if (!isPlaying) return;
        let template = itemTypes[Math.floor(Math.random() * itemTypes.length)];
        // Bombanın çıkma olasılığını dengele
        if (Math.random() < 0.2 && template.type !== 'bomb') {
            template = itemTypes[4];
        }

        let x = Math.random() * (canvas.width - 100) + 50;
        let y = canvas.height + 40;
        let vx = (canvas.width / 2 - x) / 25 + (Math.random() - 0.5) * 4;
        let vy = -(Math.random() * 5 + 13);
        let g = 0.35;

        objects.push({
            x: x,
            y: y,
            vx: vx,
            vy: vy,
            g: g,
            radius: template.radius,
            color: template.color,
            points: template.points,
            label: template.label,
            type: template.type,
            sliced: false,
            rotation: 0,
            vRot: (Math.random() - 0.5) * 0.1
        });
    }

    // Efekt Partikülleri
    function createParticles(x, y, color) {
        for (let i = 0; i < 12; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                alpha: 1,
                color: color,
                radius: Math.random() * 4 + 2
            });
        }
    }

    // Dokunma ve Fare Kontrolü (Kılıç İzleme)
    let isDrawing = false;

    canvas.addEventListener('pointerdown', (e) => {
        isDrawing = true;
        trail = [{x: e.offsetX, y: e.offsetY, time: Date.now()}];
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing) return;
        let pt = {x: e.offsetX, y: e.offsetY, time: Date.now()};
        trail.push(pt);

        // Kesme kontrolü
        checkSlice(pt);
    });

    canvas.addEventListener('pointerup', () => {
        isDrawing = false;
        trail = [];
    });

    canvas.addEventListener('pointerleave', () => {
        isDrawing = false;
        trail = [];
    });

    function checkSlice(pt) {
        if (!isPlaying) return;
        for (let obj of objects) {
            if (obj.sliced) continue;
            let dist = Math.hypot(obj.x - pt.x, obj.y - pt.y);
            if (dist < obj.radius + 15) {
                obj.sliced = true;
                createParticles(obj.x, obj.y, obj.color);

                if (obj.type === 'bomb') {
                    lives = 0;
                    updateLivesUI();
                    gameOver();
                    return;
                } else {
                    score += obj.points;
                    document.getElementById('score-val').innerText = score;
                    if (obj.points >= 50) showCombo("SÜPER BONUS! +50");
                }
            }
        }
    }

    function showCombo(text) {
        let popup = document.getElementById('comboPopup');
        popup.innerText = text;
        popup.classList.add('show');
        setTimeout(() => popup.classList.remove('show'), 600);
    }

    // Oyun Döngüsü
    let spawnTimer = 0;

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (isPlaying) {
            spawnTimer++;
            if (spawnTimer > 45) {
                spawnObject();
                spawnTimer = 0;
            }

            // Nesneleri Güncelle ve Çiz
            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                obj.x += obj.vx;
                obj.y += obj.vy;
                obj.vy += obj.g;
                obj.rotation += obj.vRot;

                ctx.save();
                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.rotation);

                if (!obj.sliced) {
                    ctx.beginPath();
                    ctx.arc(0, 0, obj.radius, 0, Math.PI * 2);
                    ctx.fillStyle = obj.color;
                    ctx.shadowColor = obj.color;
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();

                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(obj.label, 0, 0);
                }
                ctx.restore();

                // Ekrandan düşen kaçırılan nesneler
                if (obj.y > canvas.height + 60) {
                    if (!obj.sliced && obj.type === 'target') {
                        lives--;
                        updateLivesUI();
                        if (lives <= 0) gameOver();
                    }
                    objects.splice(i, 1);
                }
            }
        }

        // Partikülleri Çiz
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.03;

            if (p.alpha <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.restore();
        }

        // Kılıç İzi (Blade Trail) Çizimi
        let now = Date.now();
        trail = trail.filter(pt => now - pt.time < 180);

        if (trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(trail[0].x, trail[0].y);
            for (let i = 1; i < trail.length; i++) {
                ctx.lineTo(trail[i].x, trail[i].y);
            }
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 20;
            ctx.stroke();
        }

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
