<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HertzCore Genesis Pro | Web3 Mining Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: #020201;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 176, 255, 0.1) 0%, transparent 70%),
                radial-gradient(circle at 20% 90%, rgba(212, 160, 23, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(0, 230, 118, 0.15) 0%, transparent 50%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            flex: 1;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 14px 85px 14px;
            overflow-y: auto;
            position: relative;
        }

        /* ÜST BAR VE MARKA */
        .header-box {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid rgba(212,160,23,0.4); padding-bottom: 10px;
        }
        .brand-logo {
            font-size: 12px; font-weight: 900; color: #d4a017; letter-spacing: 1.8px;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
        }
        .live-badge {
            background: rgba(0,230,118,0.15); border: 1px solid rgba(0,230,118,0.5);
            color: #00e676; padding: 3px 9px; border-radius: 8px; font-size: 9px; font-weight: 900; text-transform: uppercase;
        }

        /* ANA BİLANÇO VE TİCKER */
        .main-balance-card {
            background: linear-gradient(135deg, #171107 0%, #060402 100%);
            border: 1px solid rgba(212, 160, 23, 0.6); border-radius: 24px;
            padding: 18px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.95);
            margin-bottom: 12px; position: relative;
        }
        .balance-number { font-size: 32px; font-weight: 800; color: #d4a017; margin: 6px 0; }
        .node-rank { font-size: 11px; color: #00e676; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        .ticker-card {
            background: linear-gradient(90deg, rgba(212,160,23,0.15), rgba(0,230,118,0.05));
            border: 1px solid rgba(212,160,23,0.4); border-radius: 14px; padding: 8px 12px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
            font-size: 11px; font-weight: 700; color: #b39b7f;
        }

        /* STAMİNA, İLERLEME VE GÜNLÜK SERİ */
        .progress-box-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .info-card {
            background: #0d0904; border: 1px solid rgba(212, 160, 23, 0.4); border-radius: 16px; padding: 10px 14px;
        }
        .info-row { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: #b39b7f; margin-bottom: 6px; }
        .progress-bg { width: 100%; height: 7px; background: #030201; border-radius: 4px; overflow: hidden; border: 1px solid rgba(212,160,23,0.2); }
        .bar-fill { width: 100%; height: 100%; border-radius: 4px; transition: width 0.1s linear; }
        .stamina-fill { background: linear-gradient(90deg, #d4a017, #00e676); }
        .xp-fill { background: linear-gradient(90deg, #00b0ff, #00e676); }

        @keyframes numberBounce {
            0% { transform: scale(1); } 50% { transform: scale(1.08); color: #00e676; } 100% { transform: scale(1); }
        }
        .bounce-anim { animation: numberBounce 0.2s ease-in-out; }

        /* DOKUNMA EFEKTİ */
        .tap-effect {
            position: absolute; font-size: 16px; font-weight: 900; color: #00e676;
            text-shadow: 0 0 15px rgba(0,230,118,0.9); pointer-events: none; z-index: 999;
            animation: flyUpAnim 0.6s cubic-bezier(0.1, 0.9, 0.3, 1) forwards;
        }
        @keyframes flyUpAnim {
            0% { transform: translate(0, 0) scale(0.7); opacity: 1; }
            100% { transform: translate(var(--tx), -95px) scale(1.4) rotate(var(--trot)); opacity: 0; }
        }

        /* MADENCİLİK RIG KARTI */
        .mining-rig-box {
            width: 100%; background: linear-gradient(145deg, #1a1408, #060402);
            border: 3px solid rgba(212, 160, 23, 0.8); border-radius: 20px; margin-bottom: 12px; padding: 18px;
            box-shadow: inset 0 0 40px rgba(212,160,23,0.15), 0 10px 30px rgba(0,0,0,0.95); position: relative; cursor: pointer;
            transition: all 0.1s ease-out;
        }
        .mining-rig-box:active { transform: scale(0.98); border-color: #00e676; box-shadow: 0 0 25px rgba(0,230,118,0.4); }
        .rig-top-info { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 900; color: #d4a017; margin-bottom: 14px; }
        .fans-row-box { display: flex; justify-content: space-around; align-items: center; padding: 6px 0 14px 0; }
        .rig-fan-item {
            width: 52px; height: 52px; background: #030201; border: 2px solid rgba(212, 160, 23, 0.6);
            border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative;
        }
        .fan-spin-layer { width: 100%; height: 100%; position: relative; animation: fanRotate 0.2s linear infinite; }
        @keyframes fanRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fan-spin-layer::before, .fan-spin-layer::after { content: ''; position: absolute; background: #d4a017; }
        .fan-spin-layer::before { width: 3px; height: 100%; left: 23.5px; top: 0; border-radius: 2px; }
        .fan-spin-layer::after { width: 100%; height: 3px; left: 0; top: 23.5px; border-radius: 2px; }
        .fan-core-dot { position: absolute; width: 14px; height: 14px; background: radial-gradient(circle, #fff, #00e676); border-radius: 50%; z-index: 2; box-shadow: 0 0 10px #00e676; }
        .rig-bottom-info { display: flex; justify-content: space-between; font-size: 10px; color: #b39b7f; font-weight: 800; border-top: 1px solid rgba(212, 160, 23, 0.3); padding-top: 10px; }

        /* MAĞAZA VE YÜKSELTME KARTLARI */
        .shop-header { color: #d4a017; font-size: 13px; font-weight: 800; margin-bottom: 8px; margin-top: 4px; }
        .shop-item-card {
            background: linear-gradient(135deg, #171107 0%, #050402 100%); border: 1px solid rgba(212, 160, 23, 0.5);
            border-radius: 18px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
        }
        .item-info b { font-size: 12px; color: #fff; display: block; margin-bottom: 2px; }
        .item-info small { font-size: 10px; color: #00e676; font-weight: 800; }
        
        .btn-action-gold {
            background: linear-gradient(135deg, #d4a017, #aa7c11); color: #050402; border: none;
            padding: 10px 16px; border-radius: 12px; font-size: 11px; font-weight: 900; cursor: pointer; transition: all 0.2s;
        }
        .btn-action-gold:disabled { background: #332915; color: #665542; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-action-gold:active:not(:disabled) { transform: scale(0.95); }

        /* ŞANS ÇARKI VE GÜNLÜK SERİ */
        .streak-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
        .streak-box {
            background: #0d0904; border: 1px solid rgba(212,160,23,0.4); border-radius: 14px; padding: 10px 6px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .streak-box.claimed { border-color: #00e676; background: rgba(0,230,118,0.08); cursor: default; }
        .streak-box.claimed b, .streak-box.claimed span { color: #00e676; }
        .streak-box b { font-size: 11px; color: #d4a017; display: block; }
        .streak-box span { font-size: 9px; color: #b39b7f; font-weight: 800; }

        .wheel-container { background: linear-gradient(135deg, #120e06, #050402); border: 1px solid rgba(212, 160, 23, 0.5); border-radius: 20px; padding: 16px; text-align: center; margin-bottom: 12px; }
        .wheel-box {
            width: 160px; height: 160px; border-radius: 50%; border: 5px solid #d4a017; margin: 14px auto; position: relative;
            background: conic-gradient(#d4a017 0deg 60deg, #120e06 60deg 120deg, #00e676 120deg 180deg, #171107 180deg 240deg, #aa7c11 240deg 300deg, #030201 300deg 360deg);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.15, 1); box-shadow: 0 0 30px rgba(212,160,23,0.4);
        }
        .wheel-pointer {
            position: absolute; top: -13px; left: calc(50% - 8px); width: 0; height: 0;
            border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 18px solid #00e676; z-index: 10; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.7));
        }

        /* LİDER TABLOSU VE CÜZDAN */
        .leaderboard-card, .wallet-card-box {
            background: linear-gradient(135deg
