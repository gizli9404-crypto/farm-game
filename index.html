<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rig Tycoon - Mining Manager</title>
    <style>
        :root {
            --bg: #090a0f;
            --panel: #131722;
            --border: #2a2e3d;
            --accent: #00ff88;
            --warning: #ff4d4d;
            --text: #ffffff;
            --muted: #848e9c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 850px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            position: relative;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .rig-title h4 {
            font-size: 13px;
            color: var(--accent);
        }

        .rig-title span {
            font-size: 10px;
            color: var(--muted);
        }

        .ad-income-btn {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Main Dashboard Screen */
        .dash-screen {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .stat-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
        }

        .stat-box .lbl {
            font-size: 10px;
            color: var(--muted);
        }

        .stat-box .val {
            font-size: 14px;
            font-weight: bold;
            color: var(--text);
            margin-top: 2px;
        }

        .main-balance {
            margin: 10px 0;
            padding: 12px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px dashed var(--accent);
            border-radius: 8px;
        }

        .main-balance .title {
            font-size: 10px;
            color: var(--muted);
        }

        .main-balance .amount {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            margin-top: 2px;
        }

        /* Interactive Mining Rig Area */
        .rig-workbench {
            background: #1a1f2c;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            text-align: center;
        }

        .rig-workbench p {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .action-main-btn {
            width: 100%;
            background: linear-gradient(135deg, #00ff88 0%, #00b4d8 100%);
            color: #000;
            border: none;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,255,136,0.2);
        }

        .action-main-btn:active {
            transform: scale(0.97);
        }

        /* Mandatory Ad / Difficulty Wall */
        .ad-wall {
            background: rgba(255, 77, 77, 0.05);
            border: 1px solid rgba(255, 77, 77, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ad-wall-info h5 {
            font-size: 11px;
            color: var(--warning);
        }

        .ad-wall-info p {
            font-size: 9px;
            color: var(--muted);
        }

        .watch-ad-btn {
            background: var(--warning);
            color: #fff;
            border: none;
            padding: 6px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Bottom Nav */
        .nav-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            gap: 4px;
        }

        .nav-btn {
            text-align: center;
            color: var(--muted);
            font-size: 10px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .nav-btn.active, .nav-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--accent);
        }

        .nav-btn div {
            font-size: 16px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="rig-title">
                <h4>ASIC Rig #01</h4>
                <span>Durum: Aktif & Stabil</span>
            </div>
            <button class="ad-income-btn" onclick="triggerForcedAd()">📺 2X Güç</button>
        </div>

        <!-- Main Dashboard -->
        <div class="dash-screen">
            <div class="stat-row">
                <div class="stat-box">
                    <div class="lbl">Anlık Hashrate</div>
                    <div class="val" id="hashrate">45.0 MH/s</div>
                </div>
                <div class="stat-box">
                    <div class="lbl">GPU Sıcaklığı</div>
                    <div class="val" id="temp">65 °C</div>
                </div>
            </div>

            <div class="main-balance">
                <div class="title">HAVUZDA BİRİKEN BAKİYE</div>
                <div class="amount" id="balance">0.000000 USDT</div>
            </div>

            <!-- Rig Workbench / Zorunlu Tıklama & Bakım Alanı -->
            <div class="rig-workbench">
                <p>⚠️ Cihazın soğuması ve blok çözmesi için işlem yapman gerekiyor!</p>
                <button class="action-main-btn" onclick="boostWork()">⚡ BLOK ÇÖZ & HİSSE TOPLA</button>
            </div>

            <!-- Zorunlu Reklam / Para Kazanma Duvarı -->
            <div class="ad-wall">
                <div class="ad-wall-info">
                    <h5>Çekim Kilidi Aktif!</h5>
                    <p>Bakiyeyi cüzdana aktarmak için reklam izle.</p>
                </div>
                <button class="watch-ad-btn" onclick="triggerForcedAd()">REKLAM İZLE</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="nav-bar">
            <div class="nav-btn active">
                <div>💻</div>Rigler
            </div>
            <div class="nav-btn" onclick="alert('Market: Buradan daha güçlü ekran kartları alarak pasif geliri artırabilirsin!')">
                <div>🛒</div>Market
            </div>
            <div class="nav-btn" onclick="alert('Görevler: Reklam izleyerek ekstra ödüller topla!')">
                <div>🎯</div>Görevler
            </div>
            <div class="nav-btn" onclick="alert('Cüzdan: Çekim yapabilmek için reklam sınırını doldurmalısın.')">
                <div>💳</div>Cüzdan
            </div>
        </div>
    </div>

    <script>
        let balance = 0.000000;
        let hashrate = 45.0;

        // Çok yavaş artış (Millet hemen kazanamasın, zorlansın ki reklam izlesin)
        setInterval(() => {
            balance += 0.000001 * (hashrate / 10);
            document.getElementById("balance").innerText = balance.toFixed(6) + " USDT";
        }, 1000);

        function boostWork() {
            balance += 0.000500;
            document.getElementById("balance").innerText = balance.toFixed(6) + " USDT";
            
            // Kullanıcı tıkladıkça sanki işlemci ısınıyormuş gibi dereceyi anlık oynatalım
            let tempEl = document.getElementById("temp");
            let currentTemp = parseInt(tempEl.innerText);
            tempEl.innerText = (currentTemp + 1) + " °C";
            
            setTimeout(() => {
                tempEl.innerText = currentTemp + " °C";
            }, 500);
        }

        function triggerForcedAd() {
            // Burası senin Telegram Adsgram veya reklam kodunu bağlayacağın yer.
            // Kullanıcı buraya tıkladığında reklam açılacak, reklam oynatılırken hem senin 
            // kasana para yazılacak hem de kullanıcının kazanç hızı katlanacak.
            alert("📺 Reklam yükleniyor... (Bu reklam tetiklendiğinde senin reklam geliriniz hesabınıza işlenecektir.)");
            hashrate += 15.0;
            document.getElementById("hashrate").innerText = hashrate.toFixed(1) + " MH/s";
            alert("🚀 Reklam başarıyla izlendi! Hashrate artırıldı ve bakiye çekim kilidi esnetildi.");
        }
    </script>
</body>
</html>
