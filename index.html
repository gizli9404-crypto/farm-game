<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanal Miner Pro</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
            display: none;
        }
        .content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #38bdf8; }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-ad {
            background: #10b981;
            color: #fff;
        }
        /* Bottom Navigation */
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #334155;
            z-index: 100;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex: 1;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .nav-item span {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- MINE TAB -->
    <div id="tab-mine" class="content active">
        <h1>Sanal Miner Pro</h1>
        <div class="card">
            <p>Bakiye</p>
            <h2 id="balance" style="font-size: 2rem; margin: 10px 0; color: #4ade80;">0.00 MC</h2>
            <p id="hashrate" style="font-size: 0.9rem; color: #94a3b8;">Hız: 1.0x / sn</p>
            <button class="btn" onclick="mineCoin()">Kazanç Sağla</button>
        </div>

        <div class="card">
            <h3>Reklam ile Güçlendir</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin: 8px 0;">Ödüllü reklam izle, madencilik hızını artır!</p>
            <button class="btn btn-ad" onclick="showRewardedAd()">Reklam İzle (+0.5x Hız)</button>
        </div>
    </div>

    <!-- SHOP TAB -->
    <div id="tab-shop" class="content">
        <h1>Ekipman Market</h1>
        <div class="card">
            <h3>ASIC Miner Kartı</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin: 8px 0;">Saniyede +2.0 Coin kazandırır.</p>
            <button class="btn" onclick="buyUpgrade(50, 2)">Satın Al (50 MC)</button>
        </div>
    </div>

    <!-- PROFILE TAB -->
    <div id="tab-profile" class="content">
        <h1>Profil</h1>
        <div class="card">
            <p id="user-info">Telegram Kullanıcısı</p>
            <p style="margin-top: 10px; color: #94a3b8; font-size: 0.9rem;">Platform ID: 40080</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav">
        <button class="nav-item active" onclick="switchTab('mine', this)">
            <span>⛏️</span> Maden
        </button>
        <button class="nav-item" onclick="switchTab('shop', this)">
            <span>🛒</span> Market
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <span>👤</span> Profil
        </button>
    </div>

    <script>
        // Telegram WebApp Initialization
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-info').innerText = `Kullanıcı: ${tg.initDataUnsafe.user.first_name}`;
        }

        // Game State & LocalStorage
        let gameData = JSON.parse(localStorage.getItem('sanal_miner_save')) || {
            balance: 0,
            power: 1
        };

        function saveGame() {
            localStorage.setItem('sanal_miner_save', JSON.stringify(gameData));
        }

        function updateUI() {
            document.getElementById('balance').innerText = gameData.balance.toFixed(2) + " MC";
            document.getElementById('hashrate').innerText = `Hız: ${gameData.power.toFixed(1)}x / sn`;
        }

        // Web Audio API Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'reward') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Haptic Feedback helper
        function triggerHaptic(style = 'medium') {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred(style);
            }
        }

        // Mining Action
        function mineCoin() {
            gameData.balance += gameData.power;
            playSound('click');
            triggerHaptic('light');
            updateUI();
            saveGame();
        }

        // Passive Mining Loop (Her saniye)
        setInterval(() => {
            gameData.balance += gameData.power * 0.1;
            updateUI();
            saveGame();
        }, 1000);

        // Adsgram Integration (BlockID: 42740)
        const adController = window.Adsgram.init({ blockId: "42740" });

        function showRewardedAd() {
            triggerHaptic('heavy');
            adController.show().then((result) => {
                // Reklam başarıyla izlendi
                gameData.power += 0.5;
                playSound('reward');
                alert("Tebrikler! Madencilik hızınız artırıldı.");
                updateUI();
                saveGame();
            }).catch((err) => {
                console.log("Reklam gösterilemedi veya kapatıldı", err);
            });
        }

        // Upgrade Shop
        function buyUpgrade(cost, powerBoost) {
            if (gameData.balance >= cost) {
                gameData.balance -= cost;
                gameData.power += powerBoost;
                playSound('reward');
                triggerHaptic('medium');
                updateUI();
                saveGame();
                alert("Ekipman başarıyla yükseltildi!");
            } else {
                alert("Yetersiz bakiye!");
            }
        }

        // Navigation Switcher
        function switchTab(tabName, element) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
            triggerHaptic('light');
        }

        // Initial UI Render
        updateUI();
    </script>
</body>
</html>
