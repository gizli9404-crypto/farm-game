<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoEmpire - Idle Clicker</title>
    <style>
        :root {
            --bg: #0c0e15;
            --card: #161b26;
            --border: #2d3748;
            --primary: #f59e0b; /* Altın / Kripto Sarısı */
            --accent: #10b981;  /* Kazanç Yeşili */
            --text: #ffffff;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 850px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            position: relative;
        }

        /* Üst Panel & Cüzdan */
        .top-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-tag h4 {
            font-size: 13px;
            color: var(--primary);
        }

        .user-tag span {
            font-size: 10px;
            color: var(--muted);
        }

        .ad-boost-pill {
            background: rgba(245, 158, 11, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Merkez Skor Alanı */
        .game-center {
            text-align: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .coin-balance-label {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .coin-balance-val {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 15px;
        }

        /* Tıklanacak Büyük Kripto Sandığı / Token */
        .click-target {
            width: 140px;
            height: 140px;
            margin: 0 auto;
            background: radial-gradient(circle, #374151 0%, #1f2937 100%);
            border: 4px solid var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.3);
            transition: transform 0.08s ease;
        }

        .click-target:active {
            transform: scale(0.92);
        }

        .click-target span {
            font-size: 60px;
        }

        .click-hint {
            font-size: 10px;
            color: var(--muted);
            margin-top: 12px;
        }

        /* Reklam / Para Duvarı Alanı (Sana kazandıracak yer) */
        .monetize-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(59, 130, 246, 0.1) 100%);
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .monetize-text h5 {
            font-size: 12px;
            color: var(--accent);
        }

        .monetize-text p {
            font-size: 10px;
            color: var(--muted);
        }

        .watch-ad-action {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Alt Sekmeler */
        .bottom-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            gap: 4px;
        }

        .tab-item {
            text-align: center;
            color: var(--muted);
            font-size: 10px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .tab-item.active, .tab-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--primary);
        }

        .tab-item div {
            font-size: 16px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Üst Panel -->
        <div class="top-panel">
            <div class="user-tag">
                <h4>Trader #5091</h4>
                <span>Seviye: 1 • Çırak</span>
            </div>
            <div class="ad-boost-pill" onclick="forceAdView()">⚡ 3x Hız (Reklam)</div>
        </div>

        <!-- Merkez Skor ve Oyun Alanı -->
        <div class="game-center">
            <div class="coin-balance-label">TOPLAM RIX COİN</div>
            <div class="coin-balance-val" id="score">0.00</div>

            <div class="click-target" onclick="earnCoin(event)">
                <span>💎</span>
            </div>
            <div class="click-hint">Blokları çözmek için dokun!</div>
        </div>

        <!-- Senin Reklam Geliri Elde Edeceğin Alan -->
        <div class="monetize-box">
            <div class="monetize-text">
                <h5>Ödüllü Blok Havuzu</h5>
                <p>Çekim yapabilmek için reklam onayı şart.</p>
            </div>
            <button class="watch-ad-action" onclick="forceAdView()">REKLAM İZLE</button>
        </div>

        <!-- Alt Sekmeler -->
        <div class="bottom-tabs">
            <div class="tab-item active">
                <div>🪙</div>Kazanç
            </div>
            <div class="tab-item" onclick="alert('Borsa: Topladığın coinleri burada USDT karşılığında satabilmek için günlük reklam kotanı doldurmalısın.')">
                <div>📈</div>Borsa
            </div>
            <div class="tab-item" onclick="alert('Görevler: Sponsor kanallara katılarak ve reklam izleyerek ekstra kazanç sağla.')">
                <div>🎯</div>Görevler
            </div>
            <div class="tab-item" onclick="alert('Cüzdan: Çekimler her pazartesi yapılır. Minimum çekim için aktif reklam izleme zorunludur.')">
                <div>👛</div>Cüzdan
            </div>
        </div>
    </div>

    <script>
        let score = 0.00;
        let perClick = 1.00;

        function earnCoin(event) {
            score += perClick;
            document.getElementById("score").innerText = score.toFixed(2);
        }

        function forceAdView() {
            // Buraya Telegram Adsgram veya harici reklam kodunu entegre edeceksin.
            // Kullanıcı bu butona tıkladığında reklam açılacak, sen reklamdan paranı kazanacaksın,
            // kullanıcı da oyunda hız veya ekstra ödül alacak.
            alert("📺 Reklam oynatılıyor... (Bu tıklama üzerinden reklam geliriniz sisteme yansıtıldı!)");
            score += 50.00; // Kullanıcıya ödül
            document.getElementById("score").innerText = score.toFixed(2);
            alert("🎉 Reklam tamamlandı! Hesabına +50 RIX Coin eklendi.");
        }
    </script>
</body>
</html>
