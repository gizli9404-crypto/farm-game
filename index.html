<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoRig Pro - Mining Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151b22;
            --accent-green: #00ff88;
            --accent-blue: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* Header */
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .user-info h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .user-info span {
            font-size: 12px;
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .status-badge {
            font-size: 11px;
            color: var(--accent-blue);
            background: rgba(0, 210, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* Dashboard Main Stats */
        .dashboard {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(21,27,34,0.8) 0%, rgba(11,14,20,1) 100%);
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Action Button (Start/Stop Mining) */
        .mine-btn {
            width: 100%;
            background: linear-gradient(135deg, #00ff88 0%, #00b4d8 100%);
            color: #0b0e14;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,255,136,0.3);
        }

        .mine-btn:active {
            transform: scale(0.98);
        }

        /* Rig Market Section */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin: 20px 20px 10px 20px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .market-list {
            padding: 0 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .market-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
        }

        .item-details h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .item-details p {
            font-size: 11px;
            color: var(--accent-green);
        }

        .buy-btn {
            background: var(--border);
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .buy-btn:hover {
            background: var(--accent-green);
            color: #0b0e14;
        }

        /* Bottom Nav */
        .nav-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #11161d;
            border-top: 1px solid var(--border);
            padding: 10px 0;
        }

        .nav-item {
            text-align: center;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <h3>Mining Worker #1</h3>
                <span>Online</span>
            </div>
            <div class="status-badge">Pool: ⚡ Auto</div>
        </div>

        <!-- Dashboard Stats -->
        <div class="dashboard">
            <div class="balance-title">TOPLAM KAZANÇ (USDT)</div>
            <div class="balance-amount" id="balance">14.8520</div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="label">Hashrate</div>
                    <div class="value" id="hashrate">45.5 MH/s</div>
                </div>
                <div class="stat-card">
                    <div class="label">Sıcaklık</div>
                    <div class="value">62 °C</div>
                </div>
                <div class="stat-card">
                    <div class="label">Günlük Verim</div>
                    <div class="value">+2.40 $</div>
                </div>
            </div>

            <button class="mine-btn" onclick="boostMining()">🚀 HIZLANDIRCIYI AKTİFLEŞTİR</button>
        </div>

        <!-- Rig Market -->
        <div class="section-title">
            <span>Donanım & Rig Mağazası</span>
            <span>💎</span>
        </div>
        <div class="market-list">
            <div class="market-item">
                <div class="item-details">
                    <h4>AMD RX 470 4GB</h4>
                    <p>+12.5 MH/s Kazanç</p>
                </div>
                <button class="buy-btn" onclick="buyRig(50, 12.5)">50 USDT</button>
            </div>
            <div class="market-item">
                <div class="item-details">
                    <h4>AMD RX 590 8GB</h4>
                    <p>+28.0 MH/s Kazanç</p>
                </div>
                <button class="buy-btn" onclick="buyRig(110, 28.0)">110 USDT</button>
            </div>
            <div class="market-item">
                <div class="item-details">
                    <h4>NVIDIA RTX 3060</h4>
                    <p>+55.0 MH/s Kazanç</p>
                </div>
                <button class="buy-btn" onclick="buyRig(220, 55.0)">220 USDT</button>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-bar">
            <div class="nav-item active">💻 Kazım</div>
            <div class="nav-item">🛒 Market</div>
            <div class="nav-item">👥 Takım</div>
            <div class="nav-item">💳 Cüzdan</div>
        </div>
    </div>

    <script>
        let balance = 14.8520;
        let hashrate = 45.5;

        // Her saniye aktif hashrate'e göre bakiye artışı simülasyonu
        setInterval(() => {
            let earningsPerSecond = (hashrate * 0.000001);
            balance += earningsPerSecond;
            document.getElementById("balance").innerText = balance.toFixed(4);
        }, 1000);

        function boostMining() {
            hashrate += 5.0;
            document.getElementById("hashrate").innerText = hashrate.toFixed(1) + " MH/s";
            alert("🚀 Donanım overclock edildi! Hashrate artırıldı.");
        }

        function buyRig(price, power) {
            if (balance >= price) {
                balance -= price;
                hashrate += power;
                document.getElementById("balance").innerText = balance.toFixed(4);
                document.getElementById("hashrate").innerText = hashrate.toFixed(1) + " MH/s";
                alert("🎉 Rig başarıyla sisteme eklendi ve kazanca başladı!");
            } else {
                alert("❌ Yetersiz bakiye! Önce biraz daha kaz ya da cüzdanı doldur.");
            }
        }
    </script>
</body>
</html>
