<script>
        function showCustomAlert(message) {
            document.getElementById('customAlertMessage').innerText = message;
            document.getElementById('customAlertModal').style.display = 'flex';
        }

        document.getElementById('customAlertBtn').onclick = function() {
            document.getElementById('customAlertModal').style.display = 'none';
        };

        function openSettingsModal() {
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function openGuideModal() {
            document.getElementById('guideModal').style.display = 'flex';
        }

        function closeGuideModal() {
            document.getElementById('guideModal').style.display = 'none';
        }

        // State Variables
        let balance = parseFloat(localStorage.getItem('sm_balance')) || 0;
        let clickPower = parseFloat(localStorage.getItem('sm_clickPower')) || 0.0010;
        let speedMultiplier = parseFloat(localStorage.getItem('sm_speedMultiplier')) || 1.0;
        let passiveRate = parseFloat(localStorage.getItem('sm_passiveRate')) || 0.0000;
        let refCount = parseInt(localStorage.getItem('sm_refCount')) || 0;
        
        let gpus = JSON.parse(localStorage.getItem('sm_gpus')) || {
            gt730: 0,
            gtx1050: 0,
            gtx1660: 0,
            rtx3060: 0,
            rtx4080: 0,
            rtx4090: 0
        };

        let userTgId = "123456789"; // Default mock or Telegram WebApp user ID
        let userName = "Madenci";
        let userHandle = "@madenci";

        // Initialize Telegram WebApp Data if available
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userTgId = tg.initDataUnsafe.user.id.toString();
                userName = tg.initDataUnsafe.user.first_name || "Madenci";
                userHandle = tg.initDataUnsafe.user.username ? "@" + tg.initDataUnsafe.user.username : "@id_" + userTgId.slice(-4);
                if (tg.initDataUnsafe.user.photo_url) {
                    document.getElementById('user-avatar-img').src = tg.initDataUnsafe.user.photo_url;
                }
            }
        }

        document.getElementById('user-display-name').innerText = userName;
        document.getElementById('user-display-username').innerText = userHandle;

        // Admin check (Example: specific Telegram ID can unlock admin features)
        if (userTgId === "YOUR_ADMIN_ID" || localStorage.getItem('sm_isAdmin') === 'true') {
            document.getElementById('nav-admin-btn').style.display = 'block';
        }

        // Save State
        function saveData() {
            localStorage.setItem('sm_balance', balance);
            localStorage.setItem('sm_clickPower', clickPower);
            localStorage.setItem('sm_speedMultiplier', speedMultiplier);
            localStorage.setItem('sm_passiveRate', passiveRate);
            localStorage.setItem('sm_refCount', refCount);
            localStorage.setItem('sm_gpus', JSON.stringify(gpus));
            updateUI();
        }

        // Update UI Elements
        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(4);
            document.getElementById('speed').innerText = speedMultiplier.toFixed(1);
            document.getElementById('passive-rate').innerText = passiveRate.toFixed(4);
            document.getElementById('click-power').innerText = clickPower.toFixed(4);
            document.getElementById('ref-count').innerText = refCount;

            // GPU Counts
            for (let key in gpus) {
                const el = document.getElementById('count-' + key);
                if (el) el.innerText = gpus[key] + " Adet";
            }
        }

        // Mining Action
        function mine(event) {
            balance += clickPower * speedMultiplier;
            
            // Floating animation effect
            const rect = event.target.getBoundingClientRect();
            const floatText = document.createElement('div');
            floatText.className = 'float-text';
            floatText.innerText = "+" + (clickPower * speedMultiplier).toFixed(4);
            floatText.style.left = (event.clientX || (rect.left + rect.width / 2)) + 'px';
            floatText.style.top = (event.clientY || rect.top) + 'px';
            document.body.appendChild(floatText);
            setTimeout(() => floatText.remove(), 800);

            saveData();
        }

        // Passive Income Loop (1 second interval)
        setInterval(() => {
            if (passiveRate > 0) {
                balance += passiveRate;
                saveData();
            }
        }, 1000);

        // Switch Tabs
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));

            document.getElementById('tab-' + tabId).classList.add('active');
            if (element) element.classList.add('active');
        }

        // Buy GPU Rig
        function buyGPU(gpuKey, gpuName, price, rateBoost, durationDays) {
            if (balance >= price) {
                balance -= price;
                gpus[gpuKey]++;
                passiveRate += rateBoost;
                saveData();
                showCustomAlert("Tebrikler! Başarıyla " + gpuName + " kiraladınız. Pasif kazancınız arttı!");
            } else {
                showCustomAlert("Yetersiz bakiye! Daha fazla PTS kazın veya reklam izleyin.");
            }
        }

        // Simulate Ad Watch
        function showAd() {
            // Adsgram or custom mock ad integration
            if (window.Adsgram) {
                // Implement Adsgram block logic if configured
            }
            balance += 10; // Reward for watching ad
            speedMultiplier += 0.1;
            saveData();
            showCustomAlert("Reklam başarıyla izlendi! +10 PTS eklendi ve hızınız arttı.");
        }

        // Daily Bonus
        function claimDailyReward() {
            const lastClaim = localStorage.getItem('sm_lastClaim');
            const today = new Date().toDateString();
            if (lastClaim === today) {
                showCustomAlert("Bugünkü ödülünüzü zaten aldınız! Yarın tekrar gelin.");
                return;
            }
            localStorage.setItem('sm_lastClaim', today);
            balance += 25;
            saveData();
            showCustomAlert("Günlük 25 PTS ödülünüz başarıyla hesabınıza eklendi!");
        }

        // Tasks
        function completeTask(taskId, requiredAds, reward) {
            showCustomAlert("Görev ilerlemesi güncellendi. Ödül: +" + reward + " PTS");
            balance += reward;
            saveData();
        }

        // Referral Share
        function shareRefLink() {
            const refLink = "https://t.me/SanalMinerProBot?start=ref_" + userTgId;
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(refLink) + "&text=" + encodeURIComponent("Sanal Miner Pro ile kripto kazanmaya başla!"));
            } else {
                navigator.clipboard.writeText(refLink);
                showCustomAlert("Davet linkiniz panoya kopyalandı!");
            }
        }

        // Withdraw Calculations & Request
        function calculateEstimate() {
            const amount = parseFloat(document.getElementById('withdraw-amount').value) || 0;
            const usdtValue = amount / 10000;
            document.getElementById('calc-result').innerText = usdtValue.toFixed(2) + " USDT";
        }

        function setQuickAmount(percentage) {
            const amount = balance * percentage;
            document.getElementById('withdraw-amount').value = amount.toFixed(0);
            calculateEstimate();
        }

        function requestWithdraw() {
            const amount = parseFloat(document.getElementById('withdraw-amount').value) || 0;
            const address = document.getElementById('wallet-address').value;
            const network = document.getElementById('wallet-network').value;

            if (amount < 10000) {
                showCustomAlert("Minimum çekim miktarı 10.000 PTS'dir.");
                return;
            }
            if (!address) {
                showCustomAlert("Lütfen geçerli bir cüzdan adresi girin.");
                return;
            }
            if (balance < amount) {
                showCustomAlert("Bakiyeniz bu tutar için yetersiz.");
                return;
            }

            balance -= amount;
            saveData();
            showCustomAlert("Çekim talebiniz başarıyla alındı! İncelemeden sonra cüzdanınıza gönderilecektir.");
        }

        // Support Channel
        function openSupport() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openTelegramLink("https://t.me/SanalMinerSupport");
            } else {
                window.open("https://t.me/SanalMinerSupport", "_blank");
            }
        }

        // Music Toggle Mock
        let musicPlaying = false;
        function toggleMusic() {
            musicPlaying = !musicPlaying;
            document.getElementById('music-toggle-btn').innerText = musicPlaying ? "🔊 Müzik (Açık)" : "🔇 Müzik (Kapalı)";
        }

        // Admin Functions
        function adminAddDirectBalance(amount) {
            balance += amount;
            saveData();
            showCustomAlert("Admin: Hesaba +" + amount + " PTS eklendi.");
        }

        function adminHardReset() {
            if (confirm("Tüm veriler sıfırlanacak. Emin misiniz?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Initial UI sync on load
        updateUI();
    </script>
</body>
</html>
