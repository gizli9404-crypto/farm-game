<!DOCTYPE html>
<html lang="tr">
<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #020201;
            background-image:

        /* --- ÜST BAR VE MARKA --- */
        .header-box {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; border-bottom: 1px solid rgba(212,160,23,0.4); padding-bottom: 10px;
        }
        .brand-logo {
            font-size: 13px; font-weight: 900; color: #d4a017; letter-spacing: 1.8px;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;

        .brand-logo i { font-size: 18px;}
        .live-badge {
            background: rgba(0,230,118,0.15); border: 1px solid rgba(0,230,118,0.5);

        }

        /* --- ANA BİLANÇO VE TİCKER --- */
        .main-balance-card {
            background: linear-gradient(145deg, #171107 0%, #060402 100%);
            border: 1px solid rgba(212, 160, 23, 0.6); border-radius: 24px;

            margin-bottom: 16px; position: relative; overflow: hidden;
        }
        .main-balance-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(212,160,23,0.05) 0%, transparent 60%); transform: rotate(15deg);

        .balance-title { font-size: 10px; color: #8c7355; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;}

        .ticker-price { font-size: 11px; font-weight: 800; color: #d4a017; }
        .ticker-change { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
        .change-pos { color: #00e676; background: rgba(0,230,118,0.1); }

        .p-bar-box { background: #0d0904; border: 1px solid rgba(212,160,23,0.4); border-radius: 16px; padding: 10px 14px; }
        .p-info { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: #b39b7f; margin-bottom: 6px; }
        .p-bg { width: 100%; height: 8px; background: #030201; border-radius: 4px; overflow: hidden; border: 1px solid rgba(212,160,23,0.2); position: relative;}
        .p-fill { height: 100%; border-radius: 4px; transition: width 0.2s ease, background-color 0.2s ease; position: absolute; top: 0; left: 0;}
        
        .stamina-fill { background: linear-gradient(90deg, #d4a017, #00e676); box-shadow: 0 0 10px rgba(0,230,118,0.3); }
        .xp-fill { background: linear-gradient(90deg, #00b0ff, #00e676); box-shadow: 0 0 10px rgba(0,176,255,0.3); }
        .p-txt-val { color: #fff; font-weight: 900; font-size: 10px;}

        @keyframes numberBounce {
            0% { transform: scale(1); } 50% { transform: scale(1.08); color: #00e676; } 100% { transform: scale(1); }
        }
        .bounce-anim { animation: numberBounce 0.2s ease-in-out; }

        /* --- DOKUNMA EFEKTİ --- */
        .tap-effect {
            position: absolute; font-size: 16px; font-weight: 900; color: #00e676;
            text-shadow: 0 0 15px rgba(0,230,118,0.9); pointer-events: none; z-index: 999;
            animation: flyUpAnim 0.6s cubic-bezier(0.1, 0.9, 0.3, 1) forwards;
        }
        @keyframes flyUpAnim {

            transition: all 0.15s ease-out;

        .rig-top-info { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 900; color: #d4a017; margin-bottom: 18px; }
        .fans-row-box { display: flex; justify-content: space-around; align-items: center; padding: 8px 0 18px 0; }

        .rig-bottom-info { display: flex; justify-content: space-between; font-size: 11px; color: #b39b7f; font-weight: 800; border-top: 1px solid rgba(212, 160, 23, 0.4); padding-top: 12px; }
        .tap-power-label { text-align: center; font-size: 11px; color: #00e676; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;}

        /* --- SEKMELER VE GENEL KARTLAR --- */
        .tab-section { display: none; }
        .tab-section.active { display: block; animation: fadeInSec 0.3s ease-out; }
        @keyframes fadeInSec { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
