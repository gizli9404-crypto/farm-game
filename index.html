<div class="wheel-container">
  <div class="pointer"></div>
  <div id="wheel" class="wheel">
    <div class="slice" style="--i:1; --clr:#f87171;">PEPE</div>
    <div class="slice" style="--i:2; --clr:#fb923c;">0.1 ETH</div>
    <div class="slice" style="--i:3; --clr:#facc15;">1000 PEPE</div>
    <div class="slice" style="--i:4; --clr:#4ade80;">BOOS</div>
    <div class="slice" style="--i:5; --clr:#38bdf8;">500 PEPE</div>
    <div class="slice" style="--i:6; --clr:#c084fc;">TRY</div>
  </div>
</div>
<button onclick="spinWheel()">Çarkı Çevir</button>
